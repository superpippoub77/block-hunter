name: Deploy block-hunter to Aruba via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ftp.filippomorano.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: ./
          server-dir: /www.filippomorano.com/projects/block-hunter/

          exclude: |
            **/.git*
            **/.github*
            **/.vs/**
            **/.vscode/**
            **/node_modules/**
            README*
            package.json
            server.js
            scripts/**
