name: Deploy block-hunter to Aruba via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # kit/ (SpikeCode engine) can be a submodule pointing to the private spikeengine repo:
          # add a KIT_TOKEN secret (token with read access to it); without one the default token is used
          submodules: recursive
          token: ${{ secrets.KIT_TOKEN || github.token }}

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ftp.filippomorano.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: ./
          server-dir: /www.filippomorano.com/projects/block-hunter/

          exclude: |
            **/.git*
            **/.github*
            **/.vs/**
            **/.vscode/**
            **/node_modules/**
            **/tools/**
            dist/**
            bck/**
            README*
            package.json
            server.js
            scripts/**
