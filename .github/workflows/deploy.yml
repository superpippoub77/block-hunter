name: Deploy block-hunter to Aruba via FTP

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # kit/ is the SpikeCode engine, a submodule pointing to the private repo superpippoub77/spikeengine.
      # Needs the secret KIT_TOKEN: a GitHub token with read access (Contents: Read-only) to spikeengine.
      - name: Checkout SpikeCode engine (kit/)
        env:
          KIT_TOKEN: ${{ secrets.KIT_TOKEN }}
        run: |
          if [ -z "$KIT_TOKEN" ]; then
            echo "::error::Manca il secret KIT_TOKEN (Settings > Secrets and variables > Actions): token con accesso in lettura a superpippoub77/spikeengine"
            exit 1
          fi
          git config --global url."https://x-access-token:${KIT_TOKEN}@github.com/superpippoub77/spikeengine".insteadOf "https://github.com/superpippoub77/spikeengine"
          git submodule update --init --recursive
          test -f kit/engine/index.js && echo "Motore SpikeCode: $(git -C kit log -1 --format='%h %s')"

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ftp.filippomorano.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: ./
          server-dir: /www.filippomorano.com/projects/block-hunter/

          exclude: |
            **/.git*
            **/.github*
            **/.vs/**
            **/.vscode/**
            **/node_modules/**
            **/tools/**
            dist/**
            bck/**
            README*
            package.json
            server.js
            scripts/**
            kit/studio/**
            kit/template/**
