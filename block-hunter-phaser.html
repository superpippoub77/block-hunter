<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK HUNTER</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #game-container {
            border: 4px solid #00ffff;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.5),
                0 0 40px rgba(0, 255, 255, 0.3);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        // Configurazione Phaser
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            },
            backgroundColor: '#0a0e27'
        };

        const game = new Phaser.Game(config);
        
        // Variabili globali
        let player;
        let target;
        let blocks;
        let bullets;
        let cursors;
        let spaceKey;
        let scoreText;
        let levelText;
        let livesText;
        let score = 0;
        let level = 1;
        let lives = 3;
        let gameStarted = false;
        let targetLifetime = 0;
        let blockSpawnTimer = 0;
        let particles;
    // Attract / TopTen UI state
    let attractCycleEvent = null;
    let attractVisible = false;
    let attractContainer = null;
    let topTenContainer = null;
    // Language selector
    const LANGS = ['it','fr','de','en','us','ja','es','zh'];
    let currentLangIndex = 0;
    let langFlagImage = null;
    let langTitleText = null;
    let langInstructionsText = null;
    let langStartText = null;
    let topTenCreditsFooter = null;

        function preload() {
            // Carica risorse usate dalla UI di attract
            this.load.image('attractBg', "images/bg.png");
            this.load.image('flags', 'images/flags.png');
            // tilesheet
            this.load.image('tileSheet', 'images/tile.png');
        }

        function create() {
            this.cameras.main.setBackgroundColor('#0a0e27');
            
            // Griglia di sfondo
            // const graphics = this.add.graphics();
            // graphics.lineStyle(1, 0x00ffff, 0.1);
            // for (let i = 0; i < 800; i += 40) {
            //     graphics.lineBetween(i, 0, i, 600);
            // }
            // for (let i = 0; i < 600; i += 40) {
            //     graphics.lineBetween(0, i, 800, i);
            // }
            
            // Schermata Attract (riutilizzabile)
            if (!gameStarted) {
                initAttractUI(this);
                showAttractUI(this);
                return;
            }
            
            // Player
            player = this.add.rectangle(400, 550, 20, 20, 0x00ff00);
            this.physics.add.existing(player);
            player.body.setCollideWorldBounds(true);
            
            // Target
            target = this.add.rectangle(0, 0, 15, 15, 0xffff00);
            this.physics.add.existing(target);
            spawnTarget(this);
            
            // Gruppi
            blocks = this.physics.add.group();
            bullets = this.physics.add.group();
            particles = this.add.particles(0, 0);
            
            // Input
            cursors = this.input.keyboard.createCursorKeys();
            spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
            
            // HUD
            scoreText = this.add.text(16, 16, 'SCORE: 0', {
                fontSize: '14px',
                fontFamily: 'Press Start 2P',
                fill: '#00ffff'
            }).setDepth(100);
            
            levelText = this.add.text(16, 40, 'LEVEL: 1', {
                fontSize: '14px',
                fontFamily: 'Press Start 2P',
                fill: '#00ffff'
            }).setDepth(100);
            
            livesText = this.add.text(16, 64, 'LIVES: 3', {
                fontSize: '14px',
                fontFamily: 'Press Start 2P',
                fill: '#00ffff'
            }).setDepth(100);
            
            // Collisioni
            this.physics.add.overlap(player, target, collectTarget, null, this);
            this.physics.add.overlap(player, blocks, hitBlock, null, this);
            this.physics.add.overlap(bullets, blocks, destroyBlock, null, this);
        }

        // Initialize attract UI and top-ten container (created once per scene lifecycle)
        function initAttractUI(scene) {
            if (attractContainer) return; // already created for this scene

            const centerX = 400;
            const centerY = 300;

            // Container for attract screen
            attractContainer = scene.add.container(0, 0);

            // Background: usa l'immagine se caricata, altrimenti fallback grafico
            let bg;
            if (scene.textures.exists('attractBg')) {
                bg = scene.add.image(centerX, centerY, 'attractBg');
                bg.setOrigin(0.5, 0.5);
                // Usa dimensione dinamica della scena per coprire il canvas
                bg.setDisplaySize(scene.scale.width || 800, scene.scale.height || 600);
                attractContainer.add(bg);
            } else {
                console.warn('attractBg texture not found — using fallback background');
                bg = scene.add.rectangle(scene.scale.width/2 || centerX, scene.scale.height/2 || centerY, scene.scale.width || 800, scene.scale.height || 600, 0x07102a);
                attractContainer.add(bg);

                // leggero overlay scanline per effetto retrò
                const lines = scene.add.graphics();
                lines.lineStyle(1, 0x001020, 0.03);
                for (let y = 0; y < (scene.scale.height || 600); y += 4) {
                    lines.moveTo(0, y);
                    lines.lineTo(scene.scale.width || 800, y);
                }
                lines.strokePath();
                attractContainer.add(lines);
            }

            // Title
            const title = scene.add.text(centerX, 150, 'BLOCK HUNTER', {
                fontSize: '48px',
                fontFamily: 'Press Start 2P',
                fill: '#ff00ff',
                stroke: '#00ffff',
                strokeThickness: 3
            }).setOrigin(0.5);
            attractContainer.add(title);
            langTitleText = title;

            // Glow animation
            scene.tweens.add({
                targets: title,
                alpha: { from: 1, to: 0.5 },
                duration: 1000,
                yoyo: true,
                repeat: -1
            });

            // Instructions
            const instructions = scene.add.text(centerX, 280,
                'FRECCE - MOVIMENTO\nSPAZIO - SPARA\nRECUPERA L\'OGGETTO\nSCHIVA I BLOCCHI',
                {
                    fontSize: '14px',
                    fontFamily: 'Press Start 2P',
                    fill: '#00ffff',
                    align: 'center',
                    lineSpacing: 10
                }
            ).setOrigin(0.5);
            attractContainer.add(instructions);
            langInstructionsText = instructions;

            // Start button (acts as INSERT COIN / START)
            const startButton = scene.add.rectangle(centerX, 420, 300, 60, 0xff00ff).setInteractive({ useHandCursor: true });
            const startText = scene.add.text(centerX, 420, 'INSERISCI MONETA', {
                fontSize: '16px',
                fontFamily: 'Press Start 2P',
                fill: '#000000'
            }).setOrigin(0.5);
            attractContainer.add(startButton);
            attractContainer.add(startText);
            langStartText = startText;

            // Pulsing animation
            scene.tweens.add({
                targets: startButton,
                scaleX: { from: 1, to: 1.05 },
                scaleY: { from: 1, to: 1.05 },
                duration: 800,
                yoyo: true,
                repeat: -1
            });

            startButton.on('pointerover', () => startButton.setFillStyle(0x00ffff));
            startButton.on('pointerout', () => startButton.setFillStyle(0xff00ff));

            const startGame = () => {
                gameStarted = true;
                hideAttractUI(scene, true);
                if (attractCycleEvent) {
                    attractCycleEvent.remove(false);
                    attractCycleEvent = null;
                }
                scene.scene.restart();
            };

            startButton.on('pointerdown', startGame);
            scene.input.keyboard.on('keydown-ENTER', startGame);

            // Top Ten container (initially hidden)
            topTenContainer = scene.add.container(0, 0);
            const topTitle = scene.add.text(centerX, 80, 'HIGH SCORES', {
                fontSize: '28px',
                fontFamily: 'Press Start 2P',
                fill: '#ffff00'
            }).setOrigin(0.5);
            topTenContainer.add(topTitle);

            // Empty list placeholder (show even if no scores)
            const emptyText = scene.add.text(centerX, 140, '--- NESSUN PUNTEGGIO ---', {
                fontSize: '14px',
                fontFamily: 'Press Start 2P',
                fill: '#00ffff'
            }).setOrigin(0.5);
            topTenContainer.add(emptyText);

            // Credits/footer for Top Ten
            const creditsFooter = scene.add.text(centerX, 520, 'CREDITI: 0', {
                fontSize: '14px',
                fontFamily: 'Press Start 2P',
                fill: '#00ffff'
            }).setOrigin(0.5);
            topTenContainer.add(creditsFooter);
            topTenCreditsFooter = creditsFooter;

            // Language selector UI (flag + arrows)
            // Read saved lang
            const saved = localStorage.getItem('bh_lang');
            if (saved) {
                const idx = LANGS.indexOf(saved);
                if (idx >= 0) currentLangIndex = idx;
            }

            // Flag image (we will crop to the selected flag)
            langFlagImage = scene.add.image(centerX, 480, 'flags');
            langFlagImage.setOrigin(0.5, 0.5);
            // small display
            langFlagImage.setDisplaySize(96, 24);
            attractContainer.add(langFlagImage);

            // Arrows
            const leftArrow = scene.add.text(centerX - 80, 480, '<', { fontSize: '24px', fontFamily: 'Press Start 2P', fill: '#00ffff' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
            const rightArrow = scene.add.text(centerX + 80, 480, '>', { fontSize: '24px', fontFamily: 'Press Start 2P', fill: '#00ffff' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
            attractContainer.add(leftArrow);
            attractContainer.add(rightArrow);

            leftArrow.on('pointerdown', () => changeLang(-1, scene));
            rightArrow.on('pointerdown', () => changeLang(1, scene));

            // Initial update of flag crop and dictionary
            scene.time.delayedCall(50, () => {
                updateFlagCrop(scene);
                loadDictionary(LANGS[currentLangIndex]);
            });

            // Initially hide both
            attractContainer.setAlpha(0);
            topTenContainer.setAlpha(0);
            attractContainer.setVisible(false);
            topTenContainer.setVisible(false);

            // Start alternation timer (but paused until attract shown)
            attractCycleEvent = null;
        }

        function showAttractUI(scene) {
            if (!attractContainer) initAttractUI(scene);
            if (attractVisible && attractContainer.visible) return;
            // Hide topTen first
            if (topTenContainer && topTenContainer.visible) {
                scene.tweens.add({ targets: topTenContainer, alpha: 0, duration: 500, onComplete: () => topTenContainer.setVisible(false) });
            }

            attractContainer.setVisible(true);
            scene.tweens.add({ targets: attractContainer, alpha: 1, duration: 600 });
            attractVisible = true;

            // (re)start alternation timer
            if (!attractCycleEvent) {
                attractCycleEvent = scene.time.addEvent({
                    delay: 10000,
                    loop: true,
                    callback: () => {
                        // toggle
                        if (attractVisible) showTopTenUI(scene);
                        else showAttractUI(scene);
                    }
                });
            }
        }

        function hideAttractUI(scene, immediate = false) {
            if (!attractContainer) return;
            if (immediate) {
                attractContainer.setVisible(false);
                attractContainer.setAlpha(0);
            } else {
                scene.tweens.add({ targets: attractContainer, alpha: 0, duration: 400, onComplete: () => attractContainer.setVisible(false) });
            }
            attractVisible = false;
        }

        function showTopTenUI(scene) {
            if (!topTenContainer) initAttractUI(scene);
            // Hide attract
            if (attractContainer && attractContainer.visible) {
                scene.tweens.add({ targets: attractContainer, alpha: 0, duration: 500, onComplete: () => attractContainer.setVisible(false) });
            }
            // Show topTen
            topTenContainer.setVisible(true);
            scene.tweens.add({ targets: topTenContainer, alpha: 1, duration: 600 });
            attractVisible = false;
        }

        // Tile sheet mapping (copy from index.html TAIL_SHEET_MAP)
        const tailCols = 4, tailRows = 4;
        let tailCellW = 0, tailCellH = 0;
        const TAIL_SHEET_MAP = {
            // row 0: wall variants
            wall1: { r: 0, c: 0 },
            wall2: { r: 0, c: 1 },
            wall3: { r: 0, c: 2 },
            wall4: { r: 0, c: 3 },
            // row 1: hole + sand variants
            hole: { r: 1, c: 0 },
            sand1: { r: 1, c: 1 },
            sand2: { r: 1, c: 2 },
            sand3: { r: 1, c: 3 },
            // row 2
            sand4: { r: 2, c: 0 },
            sand5: { r: 2, c: 1 },
            sandPile: { r: 2, c: 2 },
            sand6: { r: 2, c: 3 },
            // row 3
            sand7: { r: 3, c: 0 },
            sand8: { r: 3, c: 1 },
            sand9: { r: 3, c: 2 },
            sand10: { r: 3, c: 3 }
        };

        // Load a level JS (data/level/<name>.js) and draw it when ready
        function loadLevelByName(scene, name) {
            const id = 'level-script';
            const old = document.getElementById(id);
            if (old) old.remove();
            const script = document.createElement('script');
            script.id = id;
            script.src = 'data/level/' + name + '.js';
            script.onload = () => {
                if (window.LEVEL_MAP) {
                    // compute tail cell sizes from loaded texture
                    const tex = scene.textures.get('tileSheet');
                    if (tex && tex.source && tex.source[0]) {
                        const img = tex.source[0].image || tex.source[0].data;
                        tailCellW = img.width / tailCols;
                        tailCellH = img.height / tailRows;
                    }
                    drawLevel(scene, window.LEVEL_MAP);
                }
            };
            script.onerror = () => console.warn('Failed to load level', name);
            document.head.appendChild(script);
        }

        // Draw level map using tileSheet and TAIL_SHEET_MAP
        function drawLevel(scene, levelMap) {
            if (!levelMap || !levelMap.map) return;
            // remove existing floor container if any
            if (scene.floorContainer) {
                scene.floorContainer.destroy(true);
            }
            const cols = levelMap.cols || levelMap.map[0].length;
            const rows = levelMap.rows || levelMap.map.length;
            // choose tile size: optional tileSize in levelMap or based on tile sheet cell
            const tileSize = levelMap.tileSize || Math.max(8, Math.round(Math.min(tailCellW || 32, tailCellH || 32)));
            const originX = Math.round((scene.scale.width - cols * tileSize) / 2);
            const originY = Math.round((scene.scale.height - rows * tileSize) / 2);

            const container = scene.add.container(0, 0);
            scene.floorContainer = container;

            for (let r = 0; r < rows; r++) {
                const row = levelMap.map[r];
                for (let c = 0; c < cols; c++) {
                    const key = (row && row[c]) ? row[c] : null;
                    const mapEntry = TAIL_SHEET_MAP[key];
                    const x = originX + c * tileSize + tileSize / 2;
                    const y = originY + r * tileSize + tileSize / 2;
                    if (!mapEntry) {
                        // draw placeholder rect for empty/unknown tiles
                        const rect = scene.add.rectangle(x, y, tileSize, tileSize, 0xbfa57a).setOrigin(0.5);
                        container.add(rect);
                        continue;
                    }
                    // compute source rect
                    const sx = Math.round(mapEntry.c * tailCellW);
                    const sy = Math.round(mapEntry.r * tailCellH);
                    const sw = Math.max(4, Math.round(tailCellW));
                    const sh = Math.max(4, Math.round(tailCellH));
                    const img = scene.add.image(x, y, 'tileSheet').setOrigin(0.5);
                    // crop the source to the tile area
                    img.setCrop(sx, sy, sw, sh);
                    img.setDisplaySize(tileSize, tileSize);
                    container.add(img);
                }
            }
            // send container to back
            container.setDepth(-10);
        }

        // Language helper functions
        function changeLang(delta, scene) {
            currentLangIndex = (currentLangIndex + delta + LANGS.length) % LANGS.length;
            localStorage.setItem('bh_lang', LANGS[currentLangIndex]);
            updateFlagCrop(scene);
            loadDictionary(LANGS[currentLangIndex]);
        }

        function updateFlagCrop(scene) {
            if (!langFlagImage) return;
            const tex = scene.textures.get('flags');
            if (!tex || !tex.source || !tex.source[0]) return;
            const img = tex.source[0].image || tex.source[0].data;
            const totalW = img.width;
            const totalH = img.height;
            const sliceW = Math.floor(totalW / LANGS.length);
            const sx = sliceW * currentLangIndex;
            // Phaser Image#setCrop expects numbers
            langFlagImage.setCrop(sx, 0, sliceW, totalH);
            // adjust display size to keep flags visible
            langFlagImage.setDisplaySize(96, Math.round(96 * (totalH / sliceW)) );
        }

        function loadDictionary(lang) {
            // Avoid duplicates: remove existing script if any
            const id = 'dict-script';
            const old = document.getElementById(id);
            if (old) old.remove();

            const script = document.createElement('script');
            script.id = id;
            script.src = 'data/dic/' + lang + '.js';
            script.onload = () => {
                // apply translations if DICT available
                if (window.DICT) applyTranslations();
            };
            script.onerror = () => console.warn('Failed to load dictionary for', lang);
            document.head.appendChild(script);
        }

        function applyTranslations() {
            // Update attract texts if keys exist in DICT
            if (!window.DICT) return;
            try {
                if (window.DICT.title && langTitleText) langTitleText.setText(window.DICT.title);
                if (window.DICT.instructions && langInstructionsText) {
                    if (Array.isArray(window.DICT.instructions)) langInstructionsText.setText(window.DICT.instructions.join('\n'));
                    else langInstructionsText.setText(window.DICT.instructions);
                }
                // insert coin: try multiple keys
                const insertCoin = window.DICT.insert_coin || window.DICT.insert_coin_btn || (window.DICT.attractmode && window.DICT.attractmode.staticcredits);
                if (insertCoin && langStartText) langStartText.setText(insertCoin);
                const creditsLabel = window.DICT.credits_word || window.DICT.credits_label || 'CREDITI';
                if (topTenCreditsFooter) topTenCreditsFooter.setText((creditsLabel || 'CREDITI') + ': 0');
            } catch (e) {
                console.warn('applyTranslations error', e);
            }
        }

        function spawnTarget(scene) {
            const x = Phaser.Math.Between(50, 750);
            const y = Phaser.Math.Between(50, 450);
            target.setPosition(x, y);
            targetLifetime = 0;
            
            // Animazione pulsante target
            scene.tweens.add({
                targets: target,
                scaleX: { from: 1, to: 1.3 },
                scaleY: { from: 1, to: 1.3 },
                duration: 500,
                yoyo: true,
                repeat: -1
            });
        }

        function spawnBlock(scene) {
            let block;
            const spawnType = Math.random();
            
            // Level 1-2: blocchi spawn come funghi
            if (level <= 2) {
                const x = Phaser.Math.Between(40, 760);
                const y = Phaser.Math.Between(50, 500);
                block = scene.add.rectangle(x, y, 20, 20, 0xff00ff);
                scene.physics.add.existing(block);
                block.body.setVelocity(0, 0);
                block.setData('landed', true);
                block.setData('falling', false);
                
                // Animazione spawn
                block.setScale(0);
                scene.tweens.add({
                    targets: block,
                    scaleX: 1,
                    scaleY: 1,
                    duration: 300,
                    ease: 'Back.easeOut'
                });
            }
            // Level 3-4: funghi + caduta dall'alto
            else if (level <= 4) {
                if (spawnType < 0.5) {
                    // Fungo
                    const x = Phaser.Math.Between(40, 760);
                    const y = Phaser.Math.Between(50, 500);
                    block = scene.add.rectangle(x, y, 20, 20, 0xff00ff);
                    scene.physics.add.existing(block);
                    block.body.setVelocity(0, 0);
                    block.setData('landed', true);
                    block.setData('falling', false);
                    block.setScale(0);
                    scene.tweens.add({
                        targets: block,
                        scaleX: 1,
                        scaleY: 1,
                        duration: 300,
                        ease: 'Back.easeOut'
                    });
                } else {
                    // Caduta dall'alto
                    const x = Phaser.Math.Between(20, 780);
                    block = scene.add.rectangle(x, -20, 20, 20, 0xff00ff);
                    scene.physics.add.existing(block);
                    block.body.setVelocity(0, 100 + level * 20);
                    block.setData('landed', false);
                    block.setData('falling', true);
                }
            }
            // Level 5-6: funghi + alto + lati
            else if (level <= 6) {
                if (spawnType < 0.3) {
                    // Fungo
                    const x = Phaser.Math.Between(40, 760);
                    const y = Phaser.Math.Between(50, 500);
                    block = scene.add.rectangle(x, y, 20, 20, 0xff00ff);
                    scene.physics.add.existing(block);
                    block.body.setVelocity(0, 0);
                    block.setData('landed', true);
                    block.setData('falling', false);
                    block.setScale(0);
                    scene.tweens.add({
                        targets: block,
                        scaleX: 1,
                        scaleY: 1,
                        duration: 300,
                        ease: 'Back.easeOut'
                    });
                } else if (spawnType < 0.65) {
                    // Alto
                    const x = Phaser.Math.Between(20, 780);
                    block = scene.add.rectangle(x, -20, 20, 20, 0xff00ff);
                    scene.physics.add.existing(block);
                    block.body.setVelocity(0, 120 + level * 15);
                    block.setData('landed', false);
                    block.setData('falling', true);
                } else {
                    // Lati
                    const fromLeft = Math.random() < 0.5;
                    const y = Phaser.Math.Between(50, 550);
                    const x = fromLeft ? -20 : 820;
                    block = scene.add.rectangle(x, y, 20, 20, 0xff00ff);
                    scene.physics.add.existing(block);
                    block.body.setVelocity(fromLeft ? 150 + level * 10 : -(150 + level * 10), 0);
                    block.setData('landed', false);
                    block.setData('falling', false);
                }
            }
            // Level 7+: tutte le direzioni
            else {
                if (spawnType < 0.2) {
                    // Fungo
                    const x = Phaser.Math.Between(40, 760);
                    const y = Phaser.Math.Between(50, 500);
                    block = scene.add.rectangle(x, y, 20, 20, 0xff00ff);
                    scene.physics.add.existing(block);
                    block.body.setVelocity(0, 0);
                    block.setData('landed', true);
                    block.setData('falling', false);
                    block.setScale(0);
                    scene.tweens.add({
                        targets: block,
                        scaleX: 1,
                        scaleY: 1,
                        duration: 300,
                        ease: 'Back.easeOut'
                    });
                } else {
                    const direction = Phaser.Math.Between(0, 3);
                    const speed = 180 + level * 10;
                    
                    switch(direction) {
                        case 0: // Alto
                            block = scene.add.rectangle(Phaser.Math.Between(20, 780), -20, 20, 20, 0xff00ff);
                            scene.physics.add.existing(block);
                            block.body.setVelocity(0, speed);
                            block.setData('falling', true);
                            break;
                        case 1: // Destra
                            block = scene.add.rectangle(820, Phaser.Math.Between(50, 550), 20, 20, 0xff00ff);
                            scene.physics.add.existing(block);
                            block.body.setVelocity(-speed, 0);
                            break;
                        case 2: // Basso
                            block = scene.add.rectangle(Phaser.Math.Between(20, 780), 620, 20, 20, 0xff00ff);
                            scene.physics.add.existing(block);
                            block.body.setVelocity(0, -speed);
                            break;
                        case 3: // Sinistra
                            block = scene.add.rectangle(-20, Phaser.Math.Between(50, 550), 20, 20, 0xff00ff);
                            scene.physics.add.existing(block);
                            block.body.setVelocity(speed, 0);
                            break;
                    }
                    block.setData('landed', false);
                    block.setData('falling', false);
                }
            }
            
            block.setStrokeStyle(2, 0x00ffff);
            blocks.add(block);
        }

        function collectTarget(player, target) {
            score += 100 * level;
            scoreText.setText('SCORE: ' + score);
            
            // Effetto particelle
            createParticleExplosion(this, target.x, target.y, 0xffff00);
            
            spawnTarget(this);
            
            // Level up ogni 500 punti
            if (score > 0 && score % 500 === 0) {
                level++;
                levelText.setText('LEVEL: ' + level);
            }
        }

        function hitBlock(player, block) {
            if (block.getData('spawning')) return; // Non collidere durante spawn
            
            lives--;
            livesText.setText('LIVES: ' + lives);
            
            // Effetto particelle
            createParticleExplosion(this, player.x, player.y, 0xff0000);
            
            block.destroy();
            
            if (lives <= 0) {
                gameOver(this);
            }
        }

        function destroyBlock(bullet, block) {
            score += 10;
            scoreText.setText('SCORE: ' + score);
            
            // Effetto particelle
            createParticleExplosion(this, block.x, block.y, 0xff00ff);
            
            bullet.destroy();
            block.destroy();
        }

        function createParticleExplosion(scene, x, y, color) {
            for (let i = 0; i < 8; i++) {
                const particle = scene.add.rectangle(x, y, 4, 4, color);
                scene.physics.add.existing(particle);
                
                const angle = (Math.PI * 2 * i) / 8;
                const speed = 200;
                particle.body.setVelocity(
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed
                );
                
                scene.tweens.add({
                    targets: particle,
                    alpha: 0,
                    duration: 500,
                    onComplete: () => particle.destroy()
                });
            }
        }

        function shoot(scene) {
            const bullet = scene.add.rectangle(player.x, player.y - 15, 4, 10, 0x00ff00);
            scene.physics.add.existing(bullet);
            bullet.body.setVelocity(0, -400);
            bullets.add(bullet);
        }

        function gameOver(scene) {
            scene.physics.pause();
            
            const overlay = scene.add.rectangle(400, 300, 800, 600, 0x000000, 0.8);
            
            const gameOverText = scene.add.text(400, 200, 'GAME OVER', {
                fontSize: '48px',
                fontFamily: 'Press Start 2P',
                fill: '#ff0000',
                stroke: '#ffff00',
                strokeThickness: 3
            }).setOrigin(0.5);
            
            const finalScore = scene.add.text(400, 280, 'SCORE FINALE: ' + score, {
                fontSize: '16px',
                fontFamily: 'Press Start 2P',
                fill: '#00ffff'
            }).setOrigin(0.5);
            
            const finalLevel = scene.add.text(400, 320, 'LIVELLO RAGGIUNTO: ' + level, {
                fontSize: '16px',
                fontFamily: 'Press Start 2P',
                fill: '#00ffff'
            }).setOrigin(0.5);
            
            const restartButton = scene.add.rectangle(400, 420, 250, 60, 0xff00ff);
            const restartText = scene.add.text(400, 420, 'RIPROVA', {
                fontSize: '20px',
                fontFamily: 'Press Start 2P',
                fill: '#000000'
            }).setOrigin(0.5);
            
            restartButton.setInteractive({ useHandCursor: true });
            restartButton.on('pointerdown', () => {
                score = 0;
                level = 1;
                lives = 3;
                gameStarted = true;
                scene.scene.restart();
            });
        }

        function update() {
            if (!gameStarted) return;
            
            // Movimento player
            if (cursors.left.isDown) {
                player.x -= 5;
            } else if (cursors.right.isDown) {
                player.x += 5;
            }
            
            if (cursors.up.isDown) {
                player.y -= 5;
            } else if (cursors.down.isDown) {
                player.y += 5;
            }
            
            // Limiti player
            player.x = Phaser.Math.Clamp(player.x, 10, 790);
            player.y = Phaser.Math.Clamp(player.y, 10, 590);
            
            // Sparo
            if (Phaser.Input.Keyboard.JustDown(spaceKey)) {
                shoot(this);
            }
            
            // Target lifetime
            targetLifetime++;
            if (targetLifetime > 180) { // 3 secondi a 60fps
                spawnTarget(this);
            }
            
            // Spawn blocchi
            const spawnRate = Math.max(30 - level * 2, 10);
            blockSpawnTimer++;
            if (blockSpawnTimer >= spawnRate) {
                spawnBlock(this);
                blockSpawnTimer = 0;
            }
            
            // Update blocchi - gestione collisioni e stacking
            blocks.children.entries.forEach((block, index) => {
                if (block.getData('landed')) return;
                
                // Controlla collisione con altri blocchi
                blocks.children.entries.forEach((otherBlock, otherIndex) => {
                    if (index === otherIndex || !otherBlock.getData('landed')) return;
                    
                    const bounds1 = block.getBounds();
                    const bounds2 = otherBlock.getBounds();
                    
                    // Predici la posizione nel prossimo frame
                    const nextBounds = new Phaser.Geom.Rectangle(
                        bounds1.x + block.body.velocity.x / 60,
                        bounds1.y + block.body.velocity.y / 60,
                        bounds1.width,
                        bounds1.height
                    );
                    
                    if (Phaser.Geom.Intersects.RectangleToRectangle(nextBounds, bounds2)) {
                        // Ferma il blocco
                        block.setData('landed', true);
                        block.body.setVelocity(0, 0);
                        
                        // Posiziona correttamente
                        if (block.body.velocity.y > 0) {
                            block.y = otherBlock.y - 20;
                        } else if (block.body.velocity.y < 0) {
                            block.y = otherBlock.y + 20;
                        } else if (block.body.velocity.x > 0) {
                            block.x = otherBlock.x - 20;
                        } else if (block.body.velocity.x < 0) {
                            block.x = otherBlock.x + 20;
                        }
                    }
                });
                
                // Controlla bordi
                if (block.y >= 590 || block.y <= 10 || block.x <= 10 || block.x >= 790) {
                    block.setData('landed', true);
                    block.body.setVelocity(0, 0);
                    block.y = Phaser.Math.Clamp(block.y, 10, 590);
                    block.x = Phaser.Math.Clamp(block.x, 10, 790);
                }
            });
            
            // Rimuovi proiettili fuori schermo
            bullets.children.entries.forEach(bullet => {
                if (bullet.y < -20) {
                    bullet.destroy();
                }
            });
            
            // Rimuovi blocchi molto fuori schermo
            blocks.children.entries.forEach(block => {
                if (block.x < -100 || block.x > 900 || block.y < -100 || block.y > 700) {
                    if (!block.getData('landed')) {
                        block.destroy();
                    }
                }
            });
        }
    </script>
