<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK HUNTER</title>
    <!-- favicon: use the title image as favicon -->
    <link rel="icon" href="images/title.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <!-- Load local game configuration (defines window.GAME_CONFIG) -->
    <script src="js/game-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            /* make the game container cover the whole viewport so Phaser will scale the internal 800x600 canvas to fullscreen */
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
            /* remove the boxed riquadro; change to 4px if you want a border on fullscreen */
            box-shadow: none;
            border-radius: 0;
        }

        /* Local font: place your font files in assets/fonts/
           Example filenames expected by the project:
             - assets/fonts/PressStart2P.woff2
             - assets/fonts/PressStart2P.woff
           The @font-face below will prefer the local files and fall back to
           Google Fonts if the local files are missing. This avoids network
           dependency and adblock issues during development. */
        @font-face {
            font-family: 'Press Start 2P';
            /* prefer modern compressed formats first for performance */
            src: local('Press Start 2P'),
                url('assets/fonts/PressStart2P-Regular.woff2') format('woff2'),
                url('assets/fonts/PressStart2P-Regular.woff') format('woff'),
                url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <script type="module">
        import { typeWriter, fallLetters } from './js/helper.js';

        // Use a constant for the font family name (no extra quotes) and reuse it
        // across all Phaser Text styles.
        const GAME_FONT = '"Press Start 2P"';
        try { window.GAME_FONT = GAME_FONT; } catch (e) { }
        // Variabili globali
        let player;
        let player2 = null; // second player (if enabled)
        let target;
        let blocks;
        let bullets;
        let cursors;
        let spaceKey;
        let wasdKeys = null; // controls for player2 (WASD + F to shoot)
        // HUD & per-player stats
        let scoreText1, scoreText2;
        let levelText;
        let livesText1, livesText2;
        // per-player scores and lives
        let score1 = 0;
        let score2 = 0;
        let level = 1;
        let lives1 = 3;
        let lives2 = 3;
        // level up threshold tracker (combined points / 500)
        let _levelThreshold = 0;
        let gameStarted = false;
        let targetLifetime = 0;
        let blockSpawnTimer = 0;
        let particles;
        // Credits / player selection
        let credits = 0;
        let playersCount = 1;
        const CREDITS_PER_PLAYER = (window.GAME_CONFIG && window.GAME_CONFIG.CREDITS_PER_PLAYER) || 1;
        const UI = {
            background: {
                container: null,
                elements: {
                    bg: { pulse: 0, visible: true, content: null }
                }
            },
            attract: {
                container: null,
                elements: {
                    title: { pulse: 0.4, visible: true, content: null },
                    instructions: { pulse: 0, visible: true, content: null },
                    credits: { pulse: 0, visible: true, content: null },
                    player1: { visible: false, content: null },
                    player2: { visible: false, content: null },
                    selectCredits: { visible: false, content: null },
                    leftArrow: { visible: false, content: null },
                    rightArrow: { visible: false, content: null },
                    player1Box: { visible: false, content: null },
                    player1Icon: { visible: false, content: null },
                    player1Text: { visible: false, content: null },
                    player2Box: { visible: false, content: null },
                    player2Icon: { visible: false, content: null },
                    player2Text: { visible: false, content: null }
                }
            },
            topten: {
                container: null,
                elements: {
                    title: { visible: false, content: null },
                    list: { visible: false, content: null }
                }
            }
        };

        // Optional UI debug flag: set window.UI_DEBUG = true in console to enable
        const UI_DEBUG = !!(window && window.UI_DEBUG);

        // Helper to control UI parts centrally via the UI object
        // uiSetPartVisible can be called either as uiSetPartVisible(part, visible)
        // or as uiSetPartVisible(containerName, part, visible). We support both forms
        // for backward compatibility.
        function uiSetPartVisible(containerNameOrPart, partOrVisible, visibleMaybe) {
            let containerName = null;
            let part = null;
            let visible = null;
            try {
                if (typeof visibleMaybe === 'undefined') {
                    // called as uiSetPartVisible(part, visible)
                    part = containerNameOrPart;
                    visible = partOrVisible;
                } else {
                    // called as uiSetPartVisible(containerName, part, visible)
                    containerName = containerNameOrPart;
                    part = partOrVisible;
                    visible = visibleMaybe;
                }
                // Support both flat UI.* parts and the structured UI.<container>.elements.* layout.
                let target = null;

                // 1) If there is a flat registration like UI.somePart, prefer that.
                if (UI[part] && (typeof UI[part].visible !== 'undefined' || UI[part].content)) {
                    target = UI[part];
                } else {
                    // 2) Build a list of containers to search. The project now uses
                    //    UI.<container>.elements (for example UI.attract.elements).
                    const containersToSearch = [];
                    try {
                        // If caller passed a containerName, try to find the matching UI key
                        if (containerName) {
                            const requested = String(containerName).toLowerCase();
                            for (const k of Object.keys(UI)) {
                                if (!UI[k] || typeof UI[k] !== 'object') continue;
                                if (k.toLowerCase() === requested) {
                                    containersToSearch.push({ key: k, container: UI[k] });
                                    break;
                                }
                            }
                        } else {
                            // No container specified: search all top-level UI entries that have `.elements`.
                            for (const k of Object.keys(UI)) {
                                if (!UI[k] || typeof UI[k] !== 'object') continue;
                                if (UI[k].elements && typeof UI[k].elements === 'object') containersToSearch.push({ key: k, container: UI[k] });
                            }
                        }
                    } catch (e) { /* ignore */ }

                    for (const entry of containersToSearch) {
                        const container = entry && entry.container;
                        if (!container) continue;
                        const elems = container.elements || {};
                        if (!elems || typeof elems !== 'object') continue;
                        if (elems[part]) { target = elems[part]; }
                        if (target) break;
                    }
                }

                if (!target) {
                    if (UI_DEBUG) console.info('[UI] uiSetPartVisible: part not found', part, visible, 'containerName=', containerName);
                    return;
                }

                // set logical visibility flag on the metadata object (if present)
                try { if (target && typeof target.visible !== 'undefined') target.visible = !!visible; } catch (e) { /* ignore */ }

                // Determine the Phaser object to toggle: prefer `.content` when available.
                let obj = null;
                try {
                    if (target && target.content) obj = target.content;
                    else if (target && typeof target.setVisible === 'function') obj = target;
                    else {
                        // As fallback, some code registers container objects under UI.<container>.container
                        // so try to toggle a container if caller asked to show/hide an entire container name
                        if (containerName) {
                            const requested = String(containerName).toLowerCase();
                            for (const k of Object.keys(UI)) {
                                if (k.toLowerCase() === requested && UI[k].container && typeof UI[k].container.setVisible === 'function') {
                                    obj = UI[k].container;
                                    break;
                                }
                            }
                        }
                    }
                } catch (e) { /* ignore */ }

                // If this UI part produced per-character letter objects (fallLetters),
                // when hiding we destroy them (cleanup); when showing we recreate the effect
                // automatically using stored fullText/options on the text object.
                let _recreatedLetters = false;
                try {
                    const targetObj = (target && target.content) ? target.content : target;
                    // attempt to find a scene reference for recreating effect
                    const sceneForObj = (targetObj && (targetObj.scene || (targetObj.parentContainer && targetObj.parentContainer.scene))) ? (targetObj.scene || targetObj.parentContainer.scene) : null;

                    if (!visible) {
                        // destroy letters to free memory
                        if (targetObj && targetObj._letters && Array.isArray(targetObj._letters)) {
                            targetObj._letters.forEach(l => { try { l.destroy && l.destroy(); } catch (e) { } });
                            targetObj._letters = null;
                            try { targetObj._lettersDestroyed = true; } catch (e) { }
                        }
                    } else {
                        // show: if there are no live letters but we have a stored fullText, recreate effect
                        if (targetObj && (!targetObj._letters || targetObj._letters.length === 0) && targetObj._fallFullText && typeof fallLetters === 'function' && sceneForObj) {
                            try {
                                // recreate letters animation; fallLetters will hide the base textObj and create letters
                                fallLetters(sceneForObj, targetObj, targetObj._fallFullText, targetObj._fallOpts || {});
                                _recreatedLetters = true;
                            } catch (e) { /* ignore recreation errors */ }
                        }
                    }
                } catch (e) { /* ignore */ }

                if (!_recreatedLetters) {
                    if (obj && typeof obj.setVisible === 'function') obj.setVisible(!!visible);
                }
                if (UI_DEBUG) console.info('[UI] uiSetPartVisible', part, !!visible, 'container=', containerName, '->', obj || target);
            } catch (e) {
                console.warn('uiSetPartVisible error for part', part, e);
            }
        }

        function uiIsPartVisible(part) {
            try {
                if (UI[part] && typeof UI[part].visible !== 'undefined') {
                    if (UI_DEBUG) console.info('[UI] uiIsPartVisible', part, !!UI[part].visible);
                    return !!UI[part].visible;
                }
                // search all top-level UI entries for a matching .elements metadata
                for (const k of Object.keys(UI)) {
                    try {
                        const entry = UI[k];
                        if (!entry || typeof entry !== 'object') continue;
                        const elems = entry.elements;
                        if (!elems || typeof elems !== 'object') continue;
                        if (elems[part]) return !!elems[part].visible;
                    } catch (e) { /* ignore */ }
                }
                if (UI_DEBUG) console.info('[UI] uiIsPartVisible not found', part);
                return false;
            } catch (e) { return false; }
        }

        // Legacy aliases mapping: if new UI mapping missing, try to auto-register common legacy variables
        const LEGACY_UI_ALIASES = {
            credits: 'bottomCreditsText',
            selectCredits: 'selectCreditsText',
            topTenFooter: 'topTenCreditsFooter',
            langFlagLeft: 'langFlagLeft',
            langFlagCenter: 'langFlagCenter',
            langFlagRight: 'langFlagRight',
            player1: 'playerIndicator1',
            player2: 'playerIndicator2',
            title: 'title',
            instructions: 'instructions'
        };

        // Register a UI part into the central UI mapping. Accepts either a Phaser GameObject or a small wrapper { content: GO }
        function uiRegisterPart(part, contentObj) {
            try {
                if (!part) return false;
                if (!UI[part]) UI[part] = { visible: true, content: null };
                if (contentObj && contentObj.content) UI[part].content = contentObj.content;
                else UI[part].content = contentObj;
                if (UI_DEBUG) console.info('[UI] registered part', part, UI[part].content);
                return true;
            } catch (e) { return false; }
        }

        // Returns the Phaser GameObject registered for a UI part, or null.
        function uiGetContent(part) {
            try {
                if (UI[part] && UI[part].content) {
                    if (UI_DEBUG) console.info('[UI] uiGetContent found flat', part, UI[part].content);
                    return UI[part].content;
                }
                // Search all top-level UI entries that expose `.elements` (new structure)
                for (const k of Object.keys(UI)) {
                    try {
                        const entry = UI[k];
                        if (!entry || typeof entry !== 'object') continue;
                        const elems = entry.elements;
                        if (!elems || typeof elems !== 'object') continue;
                        if (elems[part] && elems[part].content) {
                            if (UI_DEBUG) console.info('[UI] uiGetContent found in UI.' + k + '.elements', part, elems[part].content);
                            return elems[part].content;
                        }
                    } catch (e) { /* ignore per-entry errors */ }
                }

                // Try to auto-register common legacy variables if present in current scope.
                try {
                    const alias = LEGACY_UI_ALIASES[part];
                    if (alias) {
                        // use eval to access local variables declared in this script's scope
                        try {
                            const legacyVal = eval(alias);
                            if (legacyVal) {
                                uiRegisterPart(part, legacyVal);
                                if (UI_DEBUG) console.info('[UI] uiGetContent auto-registered legacy', part, 'from', alias, legacyVal);
                                return legacyVal;
                            }
                        } catch (e) { /* ignore eval errors */ }
                    }
                } catch (e) { /* ignore */ }
                if (UI_DEBUG) console.info('[UI] uiGetContent not found', part);
            } catch (e) { /* ignore */ }
            return null;
        }

        // Level/Player select overlay (Phaser objects)
        let selectContainer = null;
        let selectCreditsText = null;
        let selectHintText = null;
        let selectBtn1Text = null;
        let selectBtn2Text = null;
        let selectCancelText = null;
        // Attract / TopTen UI state
        let attractCycleEvent = null;
        let attractVisible = false;

        // Legacy aliases removed: use UI.container.attract and UI.container.topTen directly

        let topTenTitle = null;
        let topTenListContainer = null;
        // Language selector
        const LANGS = ['it', 'fr', 'de', 'en', 'us', 'ja', 'es', 'zh'];
        let currentLangIndex = 0;
        // Carousel flags: left / center / right.
        let langFlagLeft = null;
        let langFlagCenter = null;
        let langFlagRight = null;
        // interactive arrow/keyboard references and handlers (attached only during attract)
        let langLeftArrow = null;
        let langRightArrow = null;
        let langKeyboardHandler = null;
        let langFlagLeftHandler = null;
        let langFlagRightHandler = null;
        let langLeftArrowHandler = null;
        let langRightArrowHandler = null;
        // prevent concurrent carousel animations
        let langCarouselAnimating = false;
        // legacy localized text refs removed; use UI.title.content and UI.instructions.content
        let langSelectorBox = null;
        let langLabelText = null;
        let topTenCreditsFooter = null;
        let bottomCreditsText = null;
        // persistent overlay (sprites thumbnails + player indicators) that stays visible
        let uiOverlay = null;
        let spriteThumbsContainer = null;
        let playerIndicator1 = null;
        let playerIndicator2 = null;

        // Configurazione Phaser
        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            // use Phaser Scale Manager so the internal resolution remains 800x600
            // but the canvas is scaled to fill the container (which now is full viewport)
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: window.GAME_CONFIG.DIMENSIONS.width || 800,
                height: window.GAME_CONFIG.DIMENSIONS.height || 600
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            },
            backgroundColor: '#0a0e27',
        };

        // Show a level/player select overlay similar to index.html
        function showLevelPlayerSelect(scene, preselect) {
            if (!scene) return;
            if (selectContainer) {
                selectContainer.setVisible(true);
                return;
            }
            const sw = scene.scale.width || 800;
            const sh = scene.scale.height || 600;
            selectContainer = scene.add.container(0, 0).setDepth(2000);
            const bg = scene.add.rectangle(sw / 2, sh / 2, sw, sh, 0x000000, 0.6).setOrigin(0.5).setInteractive();
            selectContainer.add(bg);

            const title = scene.add.text(sw / 2, 120, (window.DICT && window.DICT.select_title) || 'SELEZIONA', { fontSize: '32px', fontFamily: GAME_FONT, fill: '#ffffff' }).setOrigin(0.5);
            selectContainer.add(title);

            selectCreditsText = scene.add.text(sw / 2, 180, (credits && credits > 0) ? `CREDITI: ${credits}` : ((window.DICT && window.DICT.insert_coin) || 'INSERISCI MONETA'), { fontSize: '18px', fontFamily: GAME_FONT, fill: '#00ffff' }).setOrigin(0.5);
            selectContainer.add(selectCreditsText);
            // register select overlay credits under UI
            UI.selectCredits.content = selectCreditsText;

            selectHintText = scene.add.text(sw / 2, 220, (window.DICT && window.DICT.select_hint) || 'Scegli numero giocatori:', { fontSize: '16px', fontFamily: GAME_FONT, fill: '#00ffff' }).setOrigin(0.5);
            selectContainer.add(selectHintText);

            // Buttons for 1 and 2 players (text-only, larger)
            selectBtn1Text = scene.add.text(sw / 2 - 140, 320, (window.DICT && window.DICT.one_player_label) || `1 PLAYER\n(${CREDITS_PER_PLAYER} crediti)`, { fontSize: '20px', fontFamily: GAME_FONT, fill: '#ffff00', stroke: '#000000', strokeThickness: 3, align: 'center', lineSpacing: 6 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
            selectContainer.add(selectBtn1Text);
            selectBtn2Text = scene.add.text(sw / 2 + 140, 320, (window.DICT && window.DICT.two_players_label) || `2 PLAYERS\n(${CREDITS_PER_PLAYER * 2} crediti)`, { fontSize: '20px', fontFamily: GAME_FONT, fill: '#ffff00', stroke: '#000000', strokeThickness: 3, align: 'center', lineSpacing: 6 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
            selectContainer.add(selectBtn2Text);

            selectCancelText = scene.add.text(sw / 2, 420, (window.DICT && window.DICT.cancel) || 'INDIETRO', { fontSize: '14px', fontFamily: GAME_FONT, fill: '#00ffff' }).setOrigin(0.5).setInteractive({ useHandCursor: true });
            selectContainer.add(selectCancelText);

            selectBtn1Text.on('pointerdown', () => { tryStartWithPlayers(1, scene); });
            selectBtn2Text.on('pointerdown', () => { tryStartWithPlayers(2, scene); });
            // hover feedback for text-only buttons
            try {
                selectBtn1Text.on('pointerover', () => selectBtn1Text.setStyle({ fill: '#ffffff' }));
                selectBtn1Text.on('pointerout', () => selectBtn1Text.setStyle({ fill: '#ffff00' }));
                selectBtn2Text.on('pointerover', () => selectBtn2Text.setStyle({ fill: '#ffffff' }));
                selectBtn2Text.on('pointerout', () => selectBtn2Text.setStyle({ fill: '#ffff00' }));
                try { if (typeof selectBtn1Text.setShadow === 'function') selectBtn1Text.setShadow(2, 2, '#000000', 4); } catch (e) { }
                try { if (typeof selectBtn2Text.setShadow === 'function') selectBtn2Text.setShadow(2, 2, '#000000', 4); } catch (e) { }
            } catch (e) { }
            selectCancelText.on('pointerdown', () => { try { selectContainer.destroy(true); selectContainer = null; } catch (e) { } });

            // keyboard shortcuts while overlay open
            const keyHandler = (ev) => {
                if (!selectContainer) { window.removeEventListener('keydown', keyHandler); return; }
                if (ev.key === '1') { ev.preventDefault(); tryStartWithPlayers(1, scene); }
                else if (ev.key === '2') { ev.preventDefault(); tryStartWithPlayers(2, scene); }
                else if (ev.key === 'Escape') { ev.preventDefault(); try { selectContainer.destroy(true); selectContainer = null; } catch (e) { } }
            };
            window.addEventListener('keydown', keyHandler);
        }

        // create the Phaser.Game only after the font is available so canvas texts render correctly
        function launchGame() {
            // use global var if other code expects `game`
            window.game = new Phaser.Game(config);
            // After a short delay, force updated fontFamily on any created Text objects.
            // This helps when the font finishes loading slightly after the initial draw.
            setTimeout(() => {
                try {
                    if (!window.game || !window.game.scene) return;
                    const activeScenes = window.game.scene.getScenes(true);
                    activeScenes.forEach(s => {
                        if (!s || !s.children) return;
                        s.children.list.forEach(child => {
                            // Phaser Text objects have type 'Text'
                            if (child && child.type === 'Text') {
                                try {
                                    child.setStyle({ fontFamily: GAME_FONT });
                                    // trigger redraw
                                    child.setText(child.text);
                                } catch (e) { /* ignore per-child errors */ }
                            }
                        });
                    });
                } catch (e) {
                    console.warn('Error applying GAME_FONT to text objects', e);
                }
            }, 300);
        }


        // Helper: try to detect which font source is usable and log it for debugging.
        // This uses FontFace loading (for local files) and a width-measurement heuristic
        // to decide if the 'Press Start 2P' family is active.
        function detectAndLogFontSource() {
            return new Promise(async (resolve) => {
                const testString = 'mmmmmmmmmlllliiiWWW';
                function measureWidth(fontFamily) {
                    try {
                        const span = document.createElement('span');
                        span.style.position = 'absolute';
                        span.style.left = '-9999px';
                        span.style.top = '-9999px';
                        span.style.fontSize = '32px';
                        span.style.fontFamily = fontFamily;
                        span.textContent = testString;
                        document.body.appendChild(span);
                        const w = span.getBoundingClientRect().width;
                        document.body.removeChild(span);
                        return w;
                    } catch (e) { return null; }
                }

                const baseline = measureWidth('monospace');
                const ps2pNow = (document.fonts && document.fonts.check) ? document.fonts.check('16px "Press Start 2P"') : false;

                const localCandidates = [
                    { url: 'assets/fonts/PressStart2P.woff2', label: 'local-woff2' },
                    { url: 'assets/fonts/PressStart2P.woff', label: 'local-woff' },
                    { url: 'assets/fonts/PressStart2P.ttf', label: 'local-ttf' }
                ];

                const avail = [];
                if (window.FontFace) {
                    for (const c of localCandidates) {
                        try {
                            const ff = new FontFace('PS2P-detect-' + c.label, `url("${c.url}")`);
                            // eslint-disable-next-line no-await-in-loop
                            const loaded = await ff.load().catch(() => null);
                            if (loaded) {
                                try { document.fonts.add(loaded); } catch (e) { /* ignore */ }
                                avail.push({ ok: true, label: c.label, url: c.url });
                                break;
                            }
                        } catch (e) { /* ignore per-candidate errors */ }
                    }
                }

                const gfPresent = !!document.getElementById('bh-google-font-fallback');
                const ps2pWidth = measureWidth('"Press Start 2P", monospace');

                let decided = 'unknown';
                if (ps2pNow || (ps2pWidth && baseline && Math.abs(ps2pWidth - baseline) > 2)) {
                    if (avail.length) decided = avail[0].label;
                    else if (gfPresent) decided = 'google-fallback';
                    else decided = 'press-start-2p (unknown source, maybe local())';
                } else {
                    if (avail.length) decided = avail[0].label + ' (loaded but not applied yet)';
                    else if (gfPresent) decided = 'google-fallback (not yet applied)';
                    else decided = 'not-available';
                }

                console.info('[FONT-DETECT] baseline monospace width:', baseline, 'ps2p width:', ps2pWidth, 'font-family check:', ps2pNow);
                console.info('[FONT-DETECT] local candidates result:', avail);
                console.info('[FONT-DETECT] google fallback present:', gfPresent);
                console.info('[FONT-DETECT] decided source:', decided);
                resolve(decided);
            });
        }

        // Helper: safely set text on a Phaser Text object with optional retry when font/texture not ready.
        function safeSetTextWithRetry(obj, text, scene, maxRetries = 3, delay = 150) {
            if (!obj || typeof obj.setText !== 'function') return false;
            try {
                obj.setText(text);
                return true;
            } catch (e) {
                // schedule retry if possible
                try {
                    obj._setTextRetries = (obj._setTextRetries || 0) + 1;
                    if (scene && scene.time && obj._setTextRetries <= maxRetries) {
                        scene.time.delayedCall(delay, () => {
                            try {
                                obj.setText(text);
                            } catch (e2) {
                                // nothing — if retries fail we'll log once
                                console.warn('safeSetTextWithRetry: retry failed for', text, e2);
                            }
                        });
                    } else {
                        console.warn('safeSetTextWithRetry: cannot retry setText for', text, e);
                    }
                } catch (e2) { /* ignore scheduling errors */ }
                return false;
            }
        }

        // typeWriter and fallLetters moved to js/helper.js

        // Use Font Loading API when available to ensure 'Press Start 2P' is ready
        // Diagnostic: fetch local font files and log HTTP status + headers to help debug network errors
        function fetchFontDiagnostics() {
            const candidates = [
                'assets/fonts/PressStart2P.woff2',
                'assets/fonts/PressStart2P.woff',
                'assets/fonts/PressStart2P.ttf'
            ];
            const results = [];
            return Promise.all(candidates.map(async (url) => {
                const out = { url };
                try {
                    // Try HEAD first to avoid downloading the file
                    const head = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
                    out.status = head.status;
                    out.ok = head.ok;
                    out.headers = {
                        'content-type': head.headers.get('content-type'),
                        'content-length': head.headers.get('content-length')
                    };
                    // Some static servers may not support HEAD; if status is 405, try GET with range
                    if (head.status === 405) {
                        const rng = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-1' }, cache: 'no-cache' });
                        out.status = rng.status;
                        out.ok = rng.ok;
                        out.headers = {
                            'content-type': rng.headers.get('content-type'),
                            'content-length': rng.headers.get('content-length')
                        };
                    }
                } catch (e) {
                    // fallback: try a GET to capture network errors
                    try {
                        const get = await fetch(url, { method: 'GET', cache: 'no-cache' });
                        out.status = get.status;
                        out.ok = get.ok;
                        out.headers = {
                            'content-type': get.headers.get('content-type'),
                            'content-length': get.headers.get('content-length')
                        };
                    } catch (e2) {
                        out.error = (e2 && e2.message) ? e2.message : String(e2);
                    }
                }
                results.push(out);
                return out;
            })).then(() => results);
        }

        // Run diagnostic once to help debugging in console (non-blocking)
        try {
            fetchFontDiagnostics().then(r => console.info('[FONT-DIAG] local font fetch results:', r)).catch(e => console.warn('[FONT-DIAG] error', e));
        } catch (e) { /* ignore */ }

        if (document.fonts && document.fonts.load) {
            // try to load the font at a reasonable size
            document.fonts.load('16px "Press Start 2P"').then(() => {
                detectAndLogFontSource().finally(() => launchGame());
            }).catch((err) => {
                // If local font file failed to decode (corrupt file or wrong MIME),
                // attempt a graceful fallback: inject Google Fonts stylesheet and retry.
                console.warn('Font load failed, attempting Google Fonts fallback', err);
                try {
                    if (!document.getElementById('bh-google-font-fallback')) {
                        const gf = document.createElement('link');
                        gf.id = 'bh-google-font-fallback';
                        gf.rel = 'stylesheet';
                        gf.href = 'https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap';
                        document.head.appendChild(gf);
                    }
                } catch (e) { console.warn('Failed to inject Google Fonts link', e); }

                // Retry loading the font from the injected stylesheet, timeout if it still fails
                setTimeout(() => {
                    document.fonts.load('16px "Press Start 2P"').then(() => {
                        detectAndLogFontSource().finally(() => launchGame());
                    }).catch((err2) => {
                        console.warn('Fallback font load failed, launching game anyway', err2);
                        detectAndLogFontSource().finally(() => setTimeout(launchGame, 100));
                    });
                }, 300);
            });
        } else {
            // older browsers: try detection if possible, then launch
            if (window.FontFace || (document && document.body)) {
                detectAndLogFontSource().finally(() => setTimeout(launchGame, 0));
            } else {
                setTimeout(launchGame, 0);
            }
        }

        function create() {
            this.cameras.main.setBackgroundColor('#0a0e27');

            // compute sprite cell sizes (if spriteSheet loaded)
            try {
                const st = this.textures.get('spriteSheet');
                if (st && st.source && st.source[0]) {
                    const img = st.source[0].image || st.source[0].data;
                    if (img && img.width && img.height) {
                        spriteCellW = img.width / SHEET_COLS;
                        spriteCellH = img.height / SHEET_ROWS;
                        spriteSheetPad = Math.max(0, Math.round(Math.min(spriteCellW, spriteCellH) * 0.03));
                    }
                }
            } catch (e) { /* ignore */ }

            // Create Phaser animations for the player spritesheet (if not already created)
            try {
                const anims = this.anims;
                // mapping: frame 0 = down (front), 1 = right (side), 2 = up (diag), 3 = helmet off (alt)
                if (!anims.exists('p_idle_down')) anims.create({ key: 'p_idle_down', frames: [{ key: 'player', frame: 0 }], frameRate: 1, repeat: -1 });
                if (!anims.exists('p_idle_right')) anims.create({ key: 'p_idle_right', frames: [{ key: 'player', frame: 1 }], frameRate: 1, repeat: -1 });
                if (!anims.exists('p_idle_up')) anims.create({ key: 'p_idle_up', frames: [{ key: 'player', frame: 2 }], frameRate: 1, repeat: -1 });

                if (!anims.exists('p_run_down')) anims.create({ key: 'p_run_down', frames: [{ key: 'player', frame: 0 }, { key: 'player', frame: 3 }], frameRate: 10, repeat: -1 });
                if (!anims.exists('p_run_right')) anims.create({ key: 'p_run_right', frames: [{ key: 'player', frame: 1 }, { key: 'player', frame: 3 }], frameRate: 10, repeat: -1 });
                if (!anims.exists('p_run_up')) anims.create({ key: 'p_run_up', frames: [{ key: 'player', frame: 2 }, { key: 'player', frame: 3 }], frameRate: 10, repeat: -1 });
                // left reuses right frames but we'll flipX when playing
                if (!anims.exists('p_run_left')) anims.create({ key: 'p_run_left', frames: [{ key: 'player', frame: 1 }, { key: 'player', frame: 3 }], frameRate: 10, repeat: -1 });
                if (!anims.exists('p_idle_left')) anims.create({ key: 'p_idle_left', frames: [{ key: 'player', frame: 1 }], frameRate: 1, repeat: -1 });
            } catch (e) { /* ignore animation creation errors */ }

            // Schermata Attract (riutilizzabile)
            if (!gameStarted) {
                initAttractUI(this);
                showAttractUI(this);
                return;
            }

            // Player (primary)
            // place players slightly apart to avoid instant overlap
            // Player sprite (primary)
            try {
                // prefer the standalone 2x2 player sprite sheet when available
                player = this.physics.add.sprite(300, 550, 'player');
                const displaySize = 20;
                player.setDisplaySize(displaySize, displaySize);
                player.body.setCollideWorldBounds(true);
                // default to idle facing down
                try { player.anims.play('p_idle_down'); player.setFlipX(false); } catch (e) { }
            } catch (e) {
                // fallback to rectangle if sprite APIs fail
                player = this.add.rectangle(300, 550, 20, 20, 0x00ff00);
                this.physics.add.existing(player);
                player.body.setCollideWorldBounds(true);
            }

            // Optionally create a second player when playersCount >= 2
            if ((playersCount || 1) >= 2) {
                try {
                    player2 = this.physics.add.sprite(500, 550, 'player');
                    const displaySize2 = 20;
                    player2.setDisplaySize(displaySize2, displaySize2);
                    player2.body.setCollideWorldBounds(true);
                    try { player2.anims.play('p_idle_down'); player2.setFlipX(false); } catch (e) { }
                } catch (e) {
                    player2 = this.add.rectangle(500, 550, 20, 20, 0x0000ff);
                    this.physics.add.existing(player2);
                    player2.body.setCollideWorldBounds(true);
                }

                // WASD controls for second player, F to shoot
                try {
                    wasdKeys = this.input.keyboard.addKeys({
                        up: Phaser.Input.Keyboard.KeyCodes.W,
                        left: Phaser.Input.Keyboard.KeyCodes.A,
                        down: Phaser.Input.Keyboard.KeyCodes.S,
                        right: Phaser.Input.Keyboard.KeyCodes.D,
                        shoot: Phaser.Input.Keyboard.KeyCodes.F
                    });
                } catch (e) {
                    // fallback for older Phaser input.addKeys signatures
                    const raw = this.input.keyboard.addKeys('W,A,S,D,F');
                    // normalize fallback to the same shape { up,left,down,right,shoot }
                    wasdKeys = {
                        up: raw.W || raw.w,
                        left: raw.A || raw.a,
                        down: raw.S || raw.s,
                        right: raw.D || raw.d,
                        shoot: raw.F || raw.f
                    };
                }
            }

            // Target
            // Target (collectable) — prefer sprite
            try {
                target = this.physics.add.image(0, 0, 'spriteSheet');
                const tSize = 15;
                if (applySpriteCrop(this, target, 'target')) {
                    target.setDisplaySize(tSize, tSize);
                } else {
                    target.setDisplaySize(tSize, tSize);
                    target.setTint(0xffff00);
                }
                spawnTarget(this);
            } catch (e) {
                target = this.add.rectangle(0, 0, 15, 15, 0xffff00);
                this.physics.add.existing(target);
                spawnTarget(this);
            }

            // Gruppi
            blocks = this.physics.add.group();
            bullets = this.physics.add.group();
            // Particles will be represented by small sprite fragments when possible
            particles = this.add.particles(0, 0);

            // Input
            cursors = this.input.keyboard.createCursorKeys();
            spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

            // HUD - per-player
            scoreText1 = this.add.text(16, 16, 'P1: 0', {
                fontSize: '14px',
                fontFamily: GAME_FONT,
                fill: '#00ffff'
            }).setDepth(100);

            livesText1 = this.add.text(16, 36, 'LIVES: ' + lives1, {
                fontSize: '12px',
                fontFamily: GAME_FONT,
                fill: '#00ffff'
            }).setDepth(100);

            // right-side HUD for player 2

                fontSize: '14px',
                fontFamily: GAME_FONT,
                fill: '#00ffff'
            }).setOrigin(1, 0).setDepth(100);

            livesText2 = this.add.text(this.scale.width - 16, 36, 'LIVES: ' + lives2, {
                fontSize: '12px',
                fontFamily: GAME_FONT,
                fill: '#00ffff'
            }).setOrigin(1, 0).setDepth(100);

            // Level indicator centered
            levelText = this.add.text(this.scale.width / 2, 16, 'LEVEL: ' + level, {
                fontSize: '14px',
                fontFamily: GAME_FONT,
                fill: '#00ffff'
            }).setOrigin(0.5, 0).setDepth(100);

            // Collisioni - both players should interact with targets/blocks
            this.physics.add.overlap(player, target, collectTarget, null, this);
            this.physics.add.overlap(player, blocks, hitBlock, null, this);
            if (player2) {
                this.physics.add.overlap(player2, target, collectTarget, null, this);
                this.physics.add.overlap(player2, blocks, hitBlock, null, this);
            }
            this.physics.add.overlap(bullets, blocks, destroyBlock, null, this);

            // Apply translations for HUD/select texts if dictionary loaded
            try { applyTranslations(); } catch (e) { /* ignore */ }
        }

            UI.attract.container.setVisible(true);
            scene.tweens.add({ targets: UI.attract.container, alpha: 1, duration: 600 });

            try { enableLangSelectors(scene); } catch (e) { console.warn('showAttractUI: enableLangSelectors failed', e); }

            if (!attractCycleEvent) {
                attractCycleEvent = scene.time.addEvent({

                    loop: true,
                    callback: () => {

                        if (UI.attract.elements.title.visible) showTopTenUI(scene);

        // Draw level map using tileSheet and TAIL_SHEET_MAP
        function drawLevel(scene, levelMap, _attempt = 0) {
            if (!levelMap || !levelMap.map) return;
            // If tile sheet cell sizes are not yet known and levelMap doesn't specify tileSize,
            // try to compute them from the loaded texture. If texture not yet available,
            // retry shortly (up to a few attempts) to avoid drawing with incorrect sizes.
            if ((!tailCellW || !tailCellH) && !levelMap.tileSize) {
                try {
                    const tex = scene.textures.get('tileSheet');
                    if (tex && tex.source && tex.source[0]) {
                        const img = tex.source[0].image || tex.source[0].data;
                        if (img && img.width && img.height) {
                            tailCellW = img.width / tailCols;
                            tailCellH = img.height / tailRows;
                        }
                    }
                } catch (e) { /* ignore */ }
                if ((!tailCellW || !tailCellH) && _attempt < 6) {
                    // schedule a retry after a short delay
                    try {
                        scene.time.delayedCall(80, () => drawLevel(scene, levelMap, _attempt + 1));
                        return;
                    } catch (e) { /* if no timer available, fall through */ }
                }
            }

            // remove existing floor container if any
            if (scene.floorContainer) {
                try { scene.floorContainer.destroy(true); } catch (e) { /* ignore */ }
            }
            const cols = levelMap.cols || (levelMap.map && levelMap.map[0] ? levelMap.map[0].length : 0);
            const rows = levelMap.rows || (levelMap.map ? levelMap.map.length : 0);
            if (!cols || !rows) return;

            // choose tile size: optional tileSize in levelMap or based on tile sheet cell
            let tileSize = levelMap.tileSize || Math.max(8, Math.round(Math.min(tailCellW || 32, tailCellH || 32)));
            // Clamp tileSize so tiles fit inside the scene and do not overlap
            const maxTileW = Math.max(4, Math.floor(scene.scale.width / cols));
            const maxTileH = Math.max(4, Math.floor(scene.scale.height / rows));
            tileSize = Math.min(tileSize, maxTileW, maxTileH);

            const originX = Math.round((scene.scale.width - cols * tileSize) / 2);
            const originY = Math.round((scene.scale.height - rows * tileSize) / 2);

            const container = scene.add.container(0, 0);
            scene.floorContainer = container;

            for (let r = 0; r < rows; r++) {
                const row = levelMap.map[r] || [];
                for (let c = 0; c < cols; c++) {
                    const key = (row && row[c]) ? row[c] : null;
                    const mapEntry = TAIL_SHEET_MAP[key];
                    const x = Math.round(originX + c * tileSize + tileSize / 2);
                    const y = Math.round(originY + r * tileSize + tileSize / 2);
                    if (!mapEntry) {
                        // draw placeholder rect for empty/unknown tiles
                        const rect = scene.add.rectangle(x, y, tileSize, tileSize, 0xbfa57a).setOrigin(0.5);
                        container.add(rect);
                        continue;
                    }
                    // compute source rect
                    const sx = Math.round(mapEntry.c * (tailCellW || tileSize));
                    const sy = Math.round(mapEntry.r * (tailCellH || tileSize));
                    const sw = Math.max(4, Math.round(tailCellW || tileSize));
                    const sh = Math.max(4, Math.round(tailCellH || tileSize));
                    const img = scene.add.image(x, y, 'tileSheet').setOrigin(0.5);
                    // crop the source to the tile area (if available)
                    try { img.setCrop(sx, sy, sw, sh); } catch (e) { /* ignore crop errors */ }
                    img.setDisplaySize(tileSize, tileSize);
                    container.add(img);
                }
            }
            // send container to back
            try { container.setDepth(-10); } catch (e) { /* ignore */ }
        }

        function updateFlagCrop(scene) {

        function loadDictionary(lang) {
            // 1) If the user provided an in-memory dictionary map (window.BH_DICS), use it.
            if (window.BH_DICS && window.BH_DICS[lang]) {
                try {
                    const raw = window.BH_DICS[lang];
                    const normalized = adaptDictionary(raw || {});
                    window.DICT = normalized;
                    console.info('[DICT] loaded from in-memory BH_DICS for', lang, normalized);
                    const missing = findMissingKeys(normalized);
                    if (missing.length && lang !== 'en') {
                        loadReferenceDict('en').then(ref => { try { const refNorm = adaptDictionary(ref || {}); fillMissingFromReference(window.DICT, refNorm); } catch (e) { }; applyTranslations(); }).catch(() => { applyTranslations(); });
                    } else {
                        applyTranslations();
                    }
                } catch (e) { console.warn('Error processing in-memory dictionary for', lang, e); }
                return;
            }

            // 2) Try fetching a JSON file (data/dic/<lang>.json) — useful if static .js is blocked
            const jsonUrl = 'data/dic/' + lang + '.json';

                if (!r.ok) throw new Error('json not found');
                return r.json();

                    console.info('[DICT] loaded JSON for', lang, normalized);
                    const missing = findMissingKeys(normalized);
                    if (missing.length && lang !== 'en') {
                        loadReferenceDict('en').then(ref => { try { const refNorm = adaptDictionary(ref || {}); fillMissingFromReference(window.DICT, refNorm); } catch (e) { }; applyTranslations(); }).catch(() => { applyTranslations(); });
                    } else {
                        applyTranslations();
                    }
                } catch (e) { console.warn('Error processing json dictionary for', lang, e); applyTranslations(); }
            }).catch(() => {
                // 3) Fallback: try loading the legacy script file `data/dic/<lang>.js` (kept for compatibility)

                const old = document.getElementById(id);
                if (old) old.remove();
                const script = document.createElement('script');
                script.id = id;
                script.src = 'data/dic/' + lang + '.js';
                script.onload = () => {
                    try {
                        const raw = window.DICT || {};
                        const normalized = adaptDictionary(raw);
                        window.DICT = normalized;
                        console.info('[DICT] loaded legacy script for', lang, normalized);
                        const missing = findMissingKeys(normalized);
                        if (missing.length && lang !== 'en') {

                        } else {

        // Helper: load reference dictionary via script tag and return a Promise resolving to its window.DICT
        function loadReferenceDict(refLang) {

                    return;
                }
                // Try fetching JSON first
                const jsonUrl = 'data/dic/' + refLang + '.json';
                fetch(jsonUrl, { cache: 'no-cache' }).then(r => {

        // Canonical keys and common aliases mapping. The adapter will search aliases in the raw dict
        // and populate canonical keys used by the game.
        const DICT_ALIASES = {
            title: ['title', 'game_title', 'attract_title'],
            instructions: ['instructions', 'howto', 'attract_instructions'],
            insert_coin: ['insert_coin', 'insert_coin_btn', 'attractmode.staticcredits', 'coin_text'],
            credits_word: ['credits_word', 'credits_label', 'credits'],

        // Utility: get nested value by path 'a.b.c'
        function getNested(obj, path) {
            if (!obj || !path) return undefined;
            const parts = path.split('.');
            let cur = obj;
            for (let p of parts) {
                if (cur == null) return undefined;
                cur = cur[p];
            }
            return cur;
        }

        // Find missing canonical keys (returns array of keys where normalized[key] is undefined/null)
        function findMissingKeys(norm) {
            const miss = [];
            for (const k of Object.keys(DICT_ALIASES)) {
                if (norm[k] === undefined || norm[k] === null) miss.push(k);
            }
            return miss;
        }

        // Fill missing keys in target from reference normalized dict
        function fillMissingFromReference(target, reference) {
            for (const k of Object.keys(DICT_ALIASES)) {
                if ((target[k] === undefined || target[k] === null) && reference[k] !== undefined) {
                    target[k] = reference[k];
                }
            }
        }

        // Adapt a raw dictionary (possibly with variant key names) to canonical keys
        function adaptDictionary(raw) {
            const out = {};
            // allow raw to be null
            const src = raw || {};
            for (const canon of Object.keys(DICT_ALIASES)) {
                const aliases = DICT_ALIASES[canon] || [canon];
                let found = undefined;
                for (const a of aliases) {
                    // support nested paths in alias
                    const val = getNested(src, a);
                    if (val !== undefined && val !== null) { found = val; break; }
                }
                // if not found, but raw had the canonical key directly, use it
                if ((found === undefined || found === null) && (src[canon] !== undefined)) found = src[canon];
                out[canon] = found;
            }
            // also copy any other keys from raw that are not aliases (keep extras)
            for (const k of Object.keys(src)) {
                if (!out.hasOwnProperty(k)) out[k] = src[k];
            }
            return out;
        }

        // Highscore storage helpers (persist to localStorage)

                localStorage.setItem('bh_highscores', JSON.stringify(top));

            } catch (e) { console.warn('saveHighscore error', e); return getHighscores(); }

        function renderTopTen(scene) {

                topTenListContainer.removeAll(true);

        // Prompt player names and save highscores (called from gameOver)

                    // for Image objects (no stroke API) apply a subtle tint to keep visual cue
                    // keep existing tint if any; apply an additive tint overlay by briefly flashing
                    // but to avoid extra rendering we just ensure a minimal tint is present
                    // (no-op if tint already set)
                    // leave as-is; developer can customize further if needed
                }
            } catch (e) { /* ignore stroke errors for non-rectangle objects */ }
            blocks.add(block);
        }

        function collectTarget(playerHit, target) {
            // award points to the player who collected the target
            if (playerHit === player) {
                score1 += 100 * level;
                if (scoreText1) scoreText1.setText('P1: ' + score1);
            } else if (playerHit === player2) {
                score2 += 100 * level;
                if (scoreText2) scoreText2.setText('P2: ' + score2);
            }

            // Effetto particelle
            createParticleExplosion(this, target.x, target.y, 0xffff00);

            spawnTarget(this);

            // Level up based on combined score every 500 points
            const combined = (score1 || 0) + (score2 || 0);
            const newThreshold = Math.floor(combined / 500);
            if (newThreshold > _levelThreshold) {
                level += (newThreshold - _levelThreshold);
                _levelThreshold = newThreshold;
                if (levelText) levelText.setText('LEVEL: ' + level);
            }
        }

        function hitBlock(playerHit, block) {
            if (block.getData('spawning')) return; // Non collidere durante spawn

            // decrement correct player's lives
            if (playerHit === player) {
                lives1--;
                if (livesText1) livesText1.setText('LIVES: ' + lives1);
            } else if (playerHit === player2) {
                lives2--;
                if (livesText2) livesText2.setText('LIVES: ' + lives2);
            }

            // Effetto particelle
            createParticleExplosion(this, playerHit.x, playerHit.y, 0xff0000);

            block.destroy();
            // if a player's lives reached zero, hide/disable them and schedule respawn
            if (playerHit === player && lives1 <= 0) {
                try { if (player.body) player.body.enable = false; if (player.setVisible) player.setVisible(false); } catch (e) { }
                scheduleRespawn('p1', this);
            }
            if (playerHit === player2 && lives2 <= 0) {
                try { if (player2.body) player2.body.enable = false; if (player2.setVisible) player2.setVisible(false); } catch (e) { }
                scheduleRespawn('p2', this);
            }

            // if both players have no lives left, trigger game over
            if ((lives1 <= 0) && (lives2 <= 0)) {
                gameOver(this);
            }
        }

        function destroyBlock(bullet, block) {
            // award points to shooter
            const owner = bullet && bullet.getData ? bullet.getData('owner') : null;
            if (owner === 'p1') {
                score1 += 10;
                if (scoreText1) scoreText1.setText('P1: ' + score1);
            } else if (owner === 'p2') {
                score2 += 10;
                if (scoreText2) scoreText2.setText('P2: ' + score2);
            } else {
                // fallback to player1
                score1 += 10;
                if (scoreText1) scoreText1.setText('P1: ' + score1);
            }

            // Effetto particelle
            createParticleExplosion(this, block.x, block.y, 0xff00ff);

            if (bullet && bullet.destroy) bullet.destroy();
            if (block && block.destroy) block.destroy();

            // check level up from combined score
            const combined = (score1 || 0) + (score2 || 0);
            const newThreshold = Math.floor(combined / 500);
            if (newThreshold > _levelThreshold) {
                level += (newThreshold - _levelThreshold);
                _levelThreshold = newThreshold;
                if (levelText) levelText.setText('LEVEL: ' + level);
            }
        }

        function createParticleExplosion(scene, x, y, color) {
            for (let i = 0; i < 8; i++) {
                // prefer a small shard sprite when available
                let particle = null;
                try {
                    particle = scene.physics.add.image(x, y, 'spriteSheet');
                    if (applySpriteCrop(scene, particle, 'shards')) particle.setDisplaySize(6, 6);
                    else {
                        particle.destroy();
                        particle = null;
                    }
                } catch (e) { particle = null; }

                if (!particle) {
                    particle = scene.add.rectangle(x, y, 4, 4, color);
                    scene.physics.add.existing(particle);
                }

                const angle = (Math.PI * 2 * i) / 8;
                const speed = 200;
                try { particle.body.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed); } catch (e) { }

                scene.tweens.add({ targets: particle, alpha: 0, duration: 500, onComplete: () => particle.destroy() });
            }
        }

        // Schedule a respawn for a specific player id ('p1' or 'p2') after a short delay.
        // If the other player is still alive, respawn will grant 1 life and restore the sprite.
        function scheduleRespawn(playerId, scene) {
            const delayMs = 2000;
            // visual feedback (flash)
            try {
                const centerX = scene.scale.width / 2 || 400;
                const centerY = scene.scale.height / 2 || 300;
                const info = scene.add.text(centerX, centerY + (playerId === 'p1' ? -40 : 40), (playerId === 'p1' ? 'P1 DEAD' : 'P2 DEAD') + '\nRESPAWN...', { fontSize: '12px', fontFamily: GAME_FONT, fill: '#ff8888', align: 'center' }).setOrigin(0.5);
                scene.tweens.add({ targets: info, alpha: { from: 1, to: 0 }, duration: delayMs, onComplete: () => info.destroy() });
            } catch (e) { }

            scene.time.delayedCall(delayMs, () => {
                // if both players dead, let gameOver handle it
                if ((lives1 <= 0) && (lives2 <= 0)) return;

                if (playerId === 'p1') {
                    // respawn only if player object exists or was not present
                    try {
                        if (!player) {
                            try {
                                player = scene.physics.add.sprite(300, 550, 'player');
                                player.setDisplaySize(20, 20);
                                try { player.anims.play('p_idle_down'); player.setFlipX(false); } catch (e) { }
                            } catch (e) {
                                player = scene.add.rectangle(300, 550, 20, 20, 0x00ff00);
                                scene.physics.add.existing(player);
                            }
                        }
                        // ensure body exists and enable it
                        if (player.body) player.body.enable = true;
                        player.setVisible(true);
                        // give one life on respawn
                        lives1 = Math.max(1, lives1);
                        if (livesText1) livesText1.setText('LIVES: ' + lives1);
                        // place near bottom center
                        player.x = 300; player.y = 550;
                        // re-add overlaps
                        try { scene.physics.add.overlap(player, target, collectTarget, null, scene); scene.physics.add.overlap(player, blocks, hitBlock, null, scene); } catch (e) { }
                    } catch (e) { console.warn('respawn p1 error', e); }
                }
                if (playerId === 'p2') {
                    try {
                        if (!player2) {
                            try {
                                player2 = scene.physics.add.sprite(500, 550, 'player');
                                player2.setDisplaySize(20, 20);
                                try { player2.anims.play('p_idle_down'); player2.setFlipX(false); } catch (e) { }
                            } catch (e) {
                                player2 = scene.add.rectangle(500, 550, 20, 20, 0x0000ff);
                                scene.physics.add.existing(player2);
                            }
                        }
                        if (player2.body) player2.body.enable = true;
                        player2.setVisible(true);
                        lives2 = Math.max(1, lives2);
                        if (livesText2) livesText2.setText('LIVES: ' + lives2);
                        player2.x = 500; player2.y = 550;
                        try { scene.physics.add.overlap(player2, target, collectTarget, null, scene); scene.physics.add.overlap(player2, blocks, hitBlock, null, scene); } catch (e) { }
                    } catch (e) { console.warn('respawn p2 error', e); }
                }
            });
        }

        // shoot from a shooter (player or player2). If shooter omitted, default to player
        function shoot(scene, shooter) {
            const src = shooter || player;
            if (!src) return;
            // color bullets differently based on shooter
            // prefer small sprite shard for bullets; fallback to rectangle
            let bullet = null;
            try {
                bullet = scene.physics.add.image(src.x, src.y - 15, 'spriteSheet');
                if (applySpriteCrop(scene, bullet, 'shards')) bullet.setDisplaySize(6, 10);
                else { bullet.destroy(); bullet = null; }
            } catch (e) { bullet = null; }
            if (!bullet) {
                const color = (src === player2) ? 0x0000ff : 0x00ff00;
                bullet = scene.add.rectangle(src.x, src.y - 15, 4, 10, color);
                scene.physics.add.existing(bullet);
            }
            try { if (bullet.body) bullet.body.setVelocity(0, -400); } catch (e) { }
            // mark owner for scoring
            try { bullet.setData('owner', (src === player2) ? 'p2' : 'p1'); } catch (e) { }
            bullets.add(bullet);
        }

        function gameOver(scene) {
            scene.physics.pause();

            // ask for names and save highscores for both players (if applicable)
            try { submitScoresAndSave(scene); } catch (e) { console.warn('submit scores failed', e); }

            const overlay = scene.add.rectangle(400, 300, 800, 600, 0x000000, 0.8);

            const goText = (window.DICT && window.DICT.game_over) || 'GAME OVER';
            const gameOverText = scene.add.text(400, 200, goText, {
                fontSize: '48px',
                fontFamily: GAME_FONT,
                fill: '#ff0000',
                stroke: '#ffff00',
                strokeThickness: 3
            }).setOrigin(0.5);
            const p1label = (window.DICT && window.DICT.p1_label) || 'P1';
            const p2label = (window.DICT && window.DICT.p2_label) || 'P2';
            const finalScore = scene.add.text(400, 260, `${p1label}: ${score1}   ${p2label}: ${score2}`, {
                fontSize: '16px',
                fontFamily: GAME_FONT,
                fill: '#00ffff'
            }).setOrigin(0.5);
            const levelLabel = (window.DICT && (window.DICT.level || window.DICT.level_label)) || 'LIVELLO RAGGIUNTO';
            const finalLevel = scene.add.text(400, 300, levelLabel + ': ' + level, {
                fontSize: '16px',
                fontFamily: GAME_FONT,
                fill: '#00ffff'
            }).setOrigin(0.5);

            const restartButton = scene.add.rectangle(400, 420, 250, 60, 0xff00ff);
            const retryLabel = (window.DICT && window.DICT.retry) || ((window.DICT && window.DICT.retry_label) || 'RIPROVA');
            const restartText = scene.add.text(400, 420, retryLabel, {
                fontSize: '20px',
                fontFamily: GAME_FONT,
                fill: '#000000'
            }).setOrigin(0.5);

            restartButton.setInteractive({ useHandCursor: true });
            restartButton.on('pointerdown', () => {
                // reset per-player stats
                score1 = 0; score2 = 0;
                lives1 = 3; lives2 = 3;
                _levelThreshold = 0;
                level = 1;
                gameStarted = true;
                // ensure players exist again for restart path
                try { player = null; player2 = null; } catch (e) { }
                scene.scene.restart();
            });
        }

        function update() {
            if (!gameStarted) return;

            // Movimento player (player 1 - cursors)
            if (player) {
                if (cursors.left.isDown) {
                    player.x -= 5;
                } else if (cursors.right.isDown) {
                    player.x += 5;
                }

                if (cursors.up.isDown) {
                    player.y -= 5;
                } else if (cursors.down.isDown) {
                    player.y += 5;
                }

                // Limiti player 1
                player.x = Phaser.Math.Clamp(player.x, 10, 790);
                player.y = Phaser.Math.Clamp(player.y, 10, 590);

                // Sparo player 1 (SPACE)
                if (Phaser.Input.Keyboard.JustDown(spaceKey)) {
                    shoot(this, player);
                }
            }

            // Player animation state (player 1) using Phaser anims
            try {
                if (player && player.anims) {
                    const dx = (cursors.right.isDown ? 1 : 0) - (cursors.left.isDown ? 1 : 0);
                    const dy = (cursors.down.isDown ? 1 : 0) - (cursors.up.isDown ? 1 : 0);
                    const moving = Math.abs(dx) + Math.abs(dy) > 0;
                    let dir = (player._lastDir || 'down');
                    if (moving) {
                        if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
                        else if (Math.abs(dy) > 0) dir = dy > 0 ? 'down' : 'up';
                        player._lastDir = dir;
                        const key = 'p_run_' + (dir === 'left' ? 'left' : (dir === 'right' ? 'right' : (dir === 'up' ? 'up' : 'down')));
                        if (!player.anims.isPlaying || player.anims.currentAnim.key !== key) {
                            player.anims.play(key, true);
                        }
                        try { player.setFlipX(dir === 'left'); } catch (e) { }
                    } else {
                        const key = 'p_idle_' + (dir === 'left' ? 'left' : (dir === 'right' ? 'right' : (dir === 'up' ? 'up' : 'down')));
                        if (!player.anims.isPlaying || player.anims.currentAnim.key !== key) {
                            player.anims.play(key, true);
                        }
                        try { player.setFlipX(dir === 'left'); } catch (e) { }
                    }
                }
            } catch (e) { /* non-critical */ }

            // Player 2 (WASD + F to shoot)
            if (player2 && wasdKeys) {
                try {
                    if (wasdKeys.left && wasdKeys.left.isDown) player2.x -= 5;
                    else if (wasdKeys.right && wasdKeys.right.isDown) player2.x += 5;

                    if (wasdKeys.up && wasdKeys.up.isDown) player2.y -= 5;
                    else if (wasdKeys.down && wasdKeys.down.isDown) player2.y += 5;

                    // Limits for player 2
                    player2.x = Phaser.Math.Clamp(player2.x, 10, 790);
                    player2.y = Phaser.Math.Clamp(player2.y, 10, 590);

                    const p2ShootKey = wasdKeys.shoot || wasdKeys.F || wasdKeys.f;
                    if (p2ShootKey && Phaser.Input.Keyboard.JustDown(p2ShootKey)) {
                        shoot(this, player2);
                    }
                } catch (e) {
                    // swallow any input mapping errors
                }
            }

            // Player animation state (player 2) using Phaser anims
            try {
                if (player2 && player2.anims && wasdKeys) {
                    const dx2 = (wasdKeys.right && wasdKeys.right.isDown ? 1 : 0) - (wasdKeys.left && wasdKeys.left.isDown ? 1 : 0);
                    const dy2 = (wasdKeys.down && wasdKeys.down.isDown ? 1 : 0) - (wasdKeys.up && wasdKeys.up.isDown ? 1 : 0);
                    const moving2 = Math.abs(dx2) + Math.abs(dy2) > 0;
                    let dir2 = (player2._lastDir || 'down');
                    if (moving2) {
                        if (Math.abs(dx2) > Math.abs(dy2)) dir2 = dx2 > 0 ? 'right' : 'left';
                        else if (Math.abs(dy2) > 0) dir2 = dy2 > 0 ? 'down' : 'up';
                        player2._lastDir = dir2;
                        const key2 = 'p_run_' + (dir2 === 'left' ? 'left' : (dir2 === 'right' ? 'right' : (dir2 === 'up' ? 'up' : 'down')));
                        if (!player2.anims.isPlaying || player2.anims.currentAnim.key !== key2) {
                            player2.anims.play(key2, true);
                        }
                        try { player2.setFlipX(dir2 === 'left'); } catch (e) { }
                    } else {
                        const key2 = 'p_idle_' + (dir2 === 'left' ? 'left' : (dir2 === 'right' ? 'right' : (dir2 === 'up' ? 'up' : 'down')));
                        if (!player2.anims.isPlaying || player2.anims.currentAnim.key !== key2) {
                            player2.anims.play(key2, true);
                        }
                        try { player2.setFlipX(dir2 === 'left'); } catch (e) { }
                    }
                }
            } catch (e) { /* ignore */ }

            // Target lifetime
            targetLifetime++;
            if (targetLifetime > 180) { // 3 secondi a 60fps
                spawnTarget(this);
            }

            // Spawn blocchi
            const spawnRate = Math.max(30 - level * 2, 10);
            blockSpawnTimer++;
            if (blockSpawnTimer >= spawnRate) {
                spawnBlock(this);
                blockSpawnTimer = 0;
            }

            // Update blocchi - gestione collisioni e stacking
            blocks.children.entries.forEach((block, index) => {
                if (block.getData('landed')) return;

                // Controlla collisione con altri blocchi
                blocks.children.entries.forEach((otherBlock, otherIndex) => {
                    if (index === otherIndex || !otherBlock.getData('landed')) return;

                    const bounds1 = block.getBounds();
                    const bounds2 = otherBlock.getBounds();

                    // Predici la posizione nel prossimo frame
                    const nextBounds = new Phaser.Geom.Rectangle(
                        bounds1.x + block.body.velocity.x / 60,
                        bounds1.y + block.body.velocity.y / 60,
                        bounds1.width,
                        bounds1.height
                    );

                    if (Phaser.Geom.Intersects.RectangleToRectangle(nextBounds, bounds2)) {
                        // Ferma il blocco
                        block.setData('landed', true);
                        block.body.setVelocity(0, 0);

                        // Posiziona correttamente
                        if (block.body.velocity.y > 0) {
                            block.y = otherBlock.y - 20;
                        } else if (block.body.velocity.y < 0) {
                            block.y = otherBlock.y + 20;
                        } else if (block.body.velocity.x > 0) {
                            block.x = otherBlock.x - 20;
                        } else if (block.body.velocity.x < 0) {
                            block.x = otherBlock.x + 20;
                        }
                    }
                });

                // Controlla bordi
                if (block.y >= 590 || block.y <= 10 || block.x <= 10 || block.x >= 790) {
                    block.setData('landed', true);
                    block.body.setVelocity(0, 0);
                    block.y = Phaser.Math.Clamp(block.y, 10, 590);
                    block.x = Phaser.Math.Clamp(block.x, 10, 790);
                }
            });

            // Rimuovi proiettili fuori schermo
            bullets.children.entries.forEach(bullet => {
                if (bullet.y < -20) {
                    bullet.destroy();
                }
            });

            // Rimuovi blocchi molto fuori schermo
            blocks.children.entries.forEach(block => {
                if (block.x < -100 || block.x > 900 || block.y < -100 || block.y > 700) {
                    if (!block.getData('landed')) {
                        block.destroy();
                    }
                }
            });
        }

        // Global keyboard handling for coin insert and quick player select while in attract
        // Attach once
        if (!window._bh_phaser_keys_initialized) {
            window._bh_phaser_keys_initialized = true;
            window.addEventListener('keydown', (e) => {
                // when attract visible (game not started)
                if (gameStarted) return;
                // Insert coin with '5'
                if (e.key === '5') {
                    e.preventDefault();
                    insertCoin(1, null);
                    return;
                }
                // Quick player start with '1' or '2'
                if (e.key === '1' || e.key === '2') {
                    e.preventDefault();
                    const n = parseInt(e.key, 10);
                    // try start using the active scene if possible
                    const scenes = (window.game && window.game.scene) ? window.game.scene.getScenes(true) : [];
                    const active = scenes && scenes.length ? scenes[0] : null;
                    const ok = tryStartWithPlayers(n, active);
                    if (!ok) {
                        // show required credit hint (simple console for now)
                        console.warn('Not enough credits for', n, 'players. Credits:', credits);
                    }
                    return;
                }
                // Enter behavior: open level/player select overlay (like index.html)
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const scenes = (window.game && window.game.scene) ? window.game.scene.getScenes(true) : [];
                    const active = scenes && scenes.length ? scenes[0] : null;
                    // open selection overlay (it will show credit status and buttons)
                    showLevelPlayerSelect(active, null);
                    return;
                }
            });
        }
    </script>
</body>
