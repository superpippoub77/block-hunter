<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK HUNTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        #gameContainer {
            position: relative;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1229 100%);
            border: 4px solid #00ffff;
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.5),
                0 0 40px rgba(0, 255, 255, 0.3),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #attractScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1f3a 0%, #0a0e27 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {

            0%,
            100% {
                background-position: 0 0;
            }

            50% {
                background-position: 0 100%;
            }
        }

        #attractScreen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(4px);
            }
        }

        .title {
            font-size: 48px;
            color: #ff00ff;
            text-shadow:
                3px 3px 0 #00ffff,
                -2px -2px 0 #ffff00,
                0 0 20px #ff00ff,
                0 0 40px #ff00ff;
            margin-bottom: 40px;
            animation: glow 2s ease-in-out infinite alternate, float 3s ease-in-out infinite;
            letter-spacing: 4px;
        }

        @keyframes glow {
            from {
                text-shadow:
                    3px 3px 0 #00ffff,
                    -2px -2px 0 #ffff00,
                    0 0 20px #ff00ff,
                    0 0 40px #ff00ff;
            }

            to {
                text-shadow:
                    3px 3px 0 #00ffff,
                    -2px -2px 0 #ffff00,
                    0 0 40px #ff00ff,
                    0 0 80px #ff00ff;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .instructions {
            font-size: 14px;
            color: #00ffff;
            text-align: center;
            line-height: 2;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
        }

        .startButton {
            padding: 15px 40px;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: 3px solid #ffff00;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
            transition: all 0.3s;
        }

        .startButton:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.9);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: #00ffff;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
            z-index: 5;
            line-height: 1.8;
        }

        .gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 15;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 4px solid #ff00ff;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
        }

        .gameOver h2 {
            font-size: 36px;
            color: #ff0000;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #ffff00;
        }

        .gameOver p {
            font-size: 16px;
            color: #00ffff;
            margin-bottom: 30px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="attractScreen">
            <div class="title">BLOCK HUNTER</div>
            <div class="instructions">
                FRECCE - MOVIMENTO<br>
                SPAZIO - SPARA<br>
                RECUPERA L'OGGETTO<br>
                SCHIVA I BLOCCHI
            </div>
            <button class="startButton" id="startButton">INSERISCI MONETA</button>
        </div>

        <div class="hud hidden" id="hud">
            <div>SCORE: <span id="score">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
            <div>LIVES: <span id="lives">3</span></div>
            <div>GEMS: <span id="gems">0</span>/<span id="gemsReq">20</span></div>
            <div>KEYS: <span id="keys">0</span></div>
            <div>OUTSIDE: <span id="outside">NO</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameState = 'attract'; // attract, playing, gameOver
        let score = 0;
        // level kept for compatibility (combined stage = (gameLevel-1)*5 + subLevel)
        let level = 1;
        // New structured levels: gameLevel (1..5) and subLevel (1..5)
        let gameLevel = 1;
        let subLevel = 1;
        let stageConfig = {};
        // Gems and transitions
        const GEMS_PER_STAGE = 20;
        let gemsCollected = 0;
        let inTransition = false;
        let transitionTimer = 0;
        const TRANSITION_FRAMES = 150; // ~2.5s at 60fps
        let transitionText = '';

        // Floating texts (score, key, door messages)
        let floatingTexts = [];

        function addFloatingText(x, y, text, color = '#ffffff') {
            floatingTexts.push({ x: x, y: y, text: text, color: color, life: 60, vy: -0.5 });
        }
        let lives = 3;
        let frameCount = 0;

        // Player
        const PLAYER_INITIAL_SPEED = 5;
        const PLAYER_MIN_SPEED = 1;
        const player = {
            x: 400,
            y: 550,
            width: 20,
            height: 20,
            speed: PLAYER_INITIAL_SPEED,
            color: '#00ff00',
            direction: 'up', // 'up', 'down', 'left', 'right', 'up-left', ...
            angle: 0 // radians for rendering rotation
        };

        // Movement helper (declared to avoid ReferenceError)
        let playerIsMoving = false;
        // Whether the player is outside (walking the outer border)
        let isOutside = false;
        const OUTER_BAND = 80; // how wide the outside path is along the edges (tuned)

        // Target object
        const target = {
            x: 0,
            y: 0,
            width: 15,
            height: 15,
            color: '#ffff00',
            lifetime: 300, // frames before moving
            currentLife: 0
        };

        // Game objects
        let blocks = [];
        // Inizializza le porte ai bordi del canvas
        function setupDoors() {
            doors = [
                { x: 32, y: canvas.height / 2, open: false }, // sinistra
                { x: canvas.width - 32, y: canvas.height / 2, open: false }, // destra
                { x: canvas.width / 2, y: 32, open: false }, // alto
                { x: canvas.width / 2, y: canvas.height - 32, open: false } // basso
            ];
        }
        let bullets = [];
        let particles = [];
        let bulletsBlock = [];
        const DOOR_ICON = '\u{1F6AA}'; // 🚪
        const KEY_ICON = '\u{1F511}'; // 🔑
        let doors = [];
        let levelKeys = [];
        let playerKeys = 0;
        let doorCloseTimer = 0;

        // Input
        const keys = {};

        // Top ten array
        let topTen = [];
        let scoreMultiplier = 1;
        let selectedDifficulty = 'Beginner';

        // Emoji per player e blocchi
        const PLAYER_ICON = '\u{1F47B}'; // 👻
        const BLOCK_ICON = '\u{1F4A3}'; // 💣
        const BLOCK_PULSE_ICON = '\u{1F525}'; // 🔥
        const TARGET_ICON = '\u{1F4A1}'; // 💡

        // Initialize target position
        function spawnTarget() {
            target.x = Math.random() * (canvas.width - target.width);
            target.y = Math.random() * (canvas.height - 100 - target.height) + 50;
            target.currentLife = 0;
        }

        // Return combined numeric level used for scoring/legacy behavior
        function getCombinedLevel() {
            return (gameLevel - 1) * 5 + subLevel;
        }

        // Configure stage parameters based on gameLevel and subLevel
        function configureStage() {
            // default
            stageConfig = {
                doorsCount: 0,
                spawnTypes: ['random'], // 'random', 'top', 'bottom', 'left', 'right'
                blockSpeed: 1,
                pulseChance: 0,
                pulseSizes: [],
                shards: false,
                shardSpeed: 0,
                shardFireChance: 0.01,
                spawnRate: 20
            };

            const g = gameLevel;
            const s = subLevel;

            // Map according to spec
            if (g === 1) {
                // Level 1: only random; doors on sublevel 4-5
                stageConfig.spawnTypes = ['random'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s >= 4) ? 2 : 0;
            } else if (g === 2) {
                // Level 2: random + top/bottom; doors on sublevel 3-5
                stageConfig.spawnTypes = ['random', 'top', 'bottom'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s >= 3) ? 2 : 0;
            } else if (g === 3) {
                // Level 3: random + all four directions
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s <= 2) ? 4 : 6;
            } else if (g === 4) {
                // Level 4: like 3 but with pulse rocks; doors vary 6/8
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s <= 2) ? 6 : 8;
                stageConfig.pulseChance = 0.25; // some rocks pulse
                stageConfig.pulseSizes = ['small', 'big'];
            } else if (g === 5) {
                // Level 5: like 4 but pulse rocks shoot shards
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = 8;
                stageConfig.pulseChance = 0.3;
                stageConfig.pulseSizes = ['small', 'big'];
                stageConfig.shards = true;
                stageConfig.shardSpeed = s; // shards speed equals sublevel
                stageConfig.shardFireChance = 0.02 + s * 0.005; // increase with sublevel
            }

            // spawnRate inversely proportional to difficulty
            stageConfig.spawnRate = Math.max(24 - getCombinedLevel(), 6);

            // Update global legacy level var
            level = getCombinedLevel();

            // Setup doors according to new config
            setupDoorsForStage(stageConfig.doorsCount || 0);
        }

        // Clean fields and advance after transition
        function finishAdvanceAfterTransition() {
            // Clear playfield
            blocks = [];
            bullets = [];
            bulletsBlock = [];
            particles = [];
            levelKeys = [];
            floatingTexts = [];
            doors = [];
            gemsCollected = 0;
            // Reset player position
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 50;

            inTransition = false;
            // Advance to next sublevel (this will configure stage and set doors)
            advanceSublevel();

            // Start fresh
            spawnTarget();
            updateHUD();
        }

        // Setup doors array with a given number of doors distributed on edges
        function setupDoorsForStage(count) {
            doors = [];
            if (!count || count <= 0) return;
            const positions = [];
            // We'll distribute doors around the edges: left, top, right, bottom, repeating
            const edges = ['left', 'top', 'right', 'bottom'];
            for (let i = 0; i < count; i++) {
                const edge = edges[i % edges.length];
                const idx = Math.floor(i / edges.length);
                // spread along the edge
                const t = 0.2 + (idx + (i % edges.length) / Math.max(1, Math.floor((count + edges.length - 1) / edges.length))) * 0.6;
                let x = canvas.width / 2, y = canvas.height / 2;
                switch (edge) {
                    case 'left': x = 32; y = Math.round(canvas.height * t); break;
                    case 'right': x = canvas.width - 32; y = Math.round(canvas.height * t); break;
                    case 'top': y = 32; x = Math.round(canvas.width * t); break;
                    case 'bottom': y = canvas.height - 32; x = Math.round(canvas.width * t); break;
                }
                doors.push({ x: x, y: y, open: false });
            }
        }

        // Advance sublevel/level when player progresses
        function advanceSublevel() {
            if (gameLevel === 5 && subLevel === 5) {
                // End game - reached final
                endGame();
                return;
            }
            subLevel++;
            if (subLevel > 5) {
                subLevel = 1;
                gameLevel = Math.min(5, gameLevel + 1);
            }
            configureStage();
            updateHUD();
        }

        // Spawn a key occasionally for doors (only one active at a time)
        function spawnKey() {
            // If there is already an uncollected key, do nothing
            const active = levelKeys.find(k => !k.collected);
            if (active) return;

            // Small random chance to spawn a key, scaled by level
            const baseChance = 0.001; // per frame
            const chance = baseChance + Math.min(level * 0.0005, 0.01);
            if (Math.random() < chance) {
                const key = {
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: Math.random() * (canvas.height - 120) + 60,
                    collected: false
                };
                levelKeys.push(key);
            }
        }

        // Block spawning based on level
        function spawnBlock() {
            const baseSize = 20;
            const bs = stageConfig.blockSpeed || 1;
            const baseWidth = baseSize;
            const baseHeight = baseSize;
            const pulse = Math.random() < (stageConfig.pulseChance || 0);
            const pulsePhase = Math.random() * Math.PI * 2;

            const block = {
                width: baseWidth,
                height: baseHeight,
                color: '#ff00ff',
                hit: false,
                vx: 0,
                vy: 0,
                falling: false,
                landed: true,
                spawnAnimation: 0,
                maxSpawnAnimation: 20,
                pulse: pulse,
                pulsePhase: pulsePhase
            };

            // Choose spawn type based on stageConfig
            const spawnTypes = stageConfig.spawnTypes || ['random'];
            const spawnType = spawnTypes[Math.floor(Math.random() * spawnTypes.length)];

            switch (spawnType) {
                case 'random':
                    block.x = Math.random() * (canvas.width - block.width - 40) + 20;
                    block.y = Math.random() * (canvas.height - block.height - 100) + 50;
                    block.landed = true;
                    break;
                case 'top':
                    block.x = Math.random() * (canvas.width - block.width);
                    block.y = -block.height;
                    block.vy = 1 + bs;
                    block.falling = true;
                    block.landed = false;
                    break;
                case 'bottom':
                    block.x = Math.random() * (canvas.width - block.width);
                    block.y = canvas.height + block.height;
                    block.vy = -(1 + bs);
                    block.landed = false;
                    break;
                case 'left':
                    block.x = -block.width;
                    block.y = Math.random() * (canvas.height - block.height - 40) + 20;
                    block.vx = 1 + bs;
                    block.landed = false;
                    break;
                case 'right':
                    block.x = canvas.width + block.width;
                    block.y = Math.random() * (canvas.height - block.height - 40) + 20;
                    block.vx = -(1 + bs);
                    block.landed = false;
                    break;
                default:
                    block.x = Math.random() * (canvas.width - block.width - 40) + 20;
                    block.y = Math.random() * (canvas.height - block.height - 100) + 50;
                    block.landed = true;
            }

            blocks.push(block);
        }

        // Create particle effect
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color: color
                });
            }
        }

        // Collision detection
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                obj1.x + obj1.width > obj2.x &&
                obj1.y < obj2.y + obj2.height &&
                obj1.y + obj1.height > obj2.y;
        }

        // Schermata selezione livello
        function showLevelSelect() {
            const selectDiv = document.createElement('div');
            selectDiv.id = 'levelSelect';
            selectDiv.style.position = 'absolute';
            selectDiv.style.top = '0';
            selectDiv.style.left = '0';
            selectDiv.style.width = '100%';
            selectDiv.style.height = '100%';
            selectDiv.style.background = 'rgba(10,14,39,0.95)';
            selectDiv.style.display = 'flex';
            selectDiv.style.flexDirection = 'column';
            selectDiv.style.justifyContent = 'center';
            selectDiv.style.alignItems = 'center';
            selectDiv.style.zIndex = '20';
            selectDiv.innerHTML = `
                <div class="title" style="margin-bottom:40px;">SELEZIONA LIVELLO</div>
                <button class="levelButton" data-diff="Beginner">BEGINNER</button>
                <button class="levelButton" data-diff="Medium">MEDIUM</button>
                <button class="levelButton" data-diff="Expert">EXPERT</button>
            `;
            document.getElementById('gameContainer').appendChild(selectDiv);
            // Stile pulsanti senza bordo
            const style = document.createElement('style');
            style.innerHTML = `.levelButton {
                padding: 15px 40px;
                font-family: 'Press Start 2P', monospace;
                font-size: 16px;
                background: linear-gradient(45deg, #ff00ff, #00ffff);
                color: #000;
                cursor: pointer;
                text-transform: uppercase;
                animation: pulse 1.5s ease-in-out infinite;
                box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
                transition: all 0.3s;
                margin: 10px;
                border: none !important;
                outline: none !important;
            }
            .levelButton:hover {
                transform: scale(1.1);
                box-shadow: 0 0 40px rgba(255, 0, 255, 0.9);
            }`;
            document.head.appendChild(style);
            selectDiv.querySelectorAll('button').forEach(btn => {
                btn.onclick = function () {
                    selectedDifficulty = btn.getAttribute('data-diff');
                    switch (selectedDifficulty) {
                        case 'Beginner': gameLevel = 1; subLevel = 1; scoreMultiplier = 1; break;
                        case 'Medium': gameLevel = 2; subLevel = 1; scoreMultiplier = 2; break;
                        case 'Expert': gameLevel = 3; subLevel = 1; scoreMultiplier = 3; break;
                    }
                    configureStage();
                    selectDiv.remove();
                    style.remove();
                    startGame();
                };
            });
        }

        // Start game
        function startGame() {
            console.log('Starting game...');
            gameState = 'playing';
            score = 0;
            // level viene impostato dalla selezione
            lives = 3;
            blocks = [];
            bullets = [];
            bulletsBlock = [];
            particles = [];
            frameCount = 0;
            player.x = 400;
            player.y = 550;
            player.speed = PLAYER_INITIAL_SPEED;
            playerKeys = 0;
            gemsCollected = 0;
            inTransition = false;
            // configure initial stage (sets doors according to difficulty)
            configureStage();
            levelKeys = [];
            doorCloseTimer = 0;

            // Rimuovi il div gameOver se presente
            const oldGameOver = document.querySelector('.gameOver');
            if (oldGameOver) {
                oldGameOver.remove();
            }

            document.getElementById('attractScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            spawnTarget();
            updateHUD();
            gameLoop();
        }

        // Game loop
        function gameLoop() {
            if (gameState !== 'playing') return;
            frameCount++;

            // If we're in a stage transition, draw an overlay message and count down
            if (inTransition) {
                // Draw background (cleared above)
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.font = '40px Arial';
                ctx.fillText(transitionText, canvas.width / 2, canvas.height / 2);
                transitionTimer--;
                if (transitionTimer <= 0) {
                    finishAdvanceAfterTransition();
                }
                requestAnimationFrame(gameLoop);
                return;
            }

            // Clear canvas
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid background
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Update player movement
            playerIsMoving = false;
            // Movement with 8 directions and angle rotation
            let inputX = 0;
            let inputY = 0;
            if (keys['ArrowLeft']) inputX -= 1;
            if (keys['ArrowRight']) inputX += 1;
            if (keys['ArrowUp']) inputY -= 1;
            if (keys['ArrowDown']) inputY += 1;

            if (inputX !== 0 || inputY !== 0) {
                // normalize diagonal speed
                const invMag = 1 / Math.hypot(inputX, inputY);
                const vx = inputX * invMag * player.speed;
                const vy = inputY * invMag * player.speed;

                player.x += vx;
                player.y += vy;
                playerIsMoving = true;

                // Clamp inside area when inside
                if (!isOutside) {
                    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
                    player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
                }

                // Determine direction string and angle
                if (inputY < 0 && inputX === 0) player.direction = 'up';
                else if (inputY > 0 && inputX === 0) player.direction = 'down';
                else if (inputX < 0 && inputY === 0) player.direction = 'left';
                else if (inputX > 0 && inputY === 0) player.direction = 'right';
                else if (inputY < 0 && inputX < 0) player.direction = 'up-left';
                else if (inputY < 0 && inputX > 0) player.direction = 'up-right';
                else if (inputY > 0 && inputX < 0) player.direction = 'down-left';
                else if (inputY > 0 && inputX > 0) player.direction = 'down-right';

                // Angle: 0 radians = right, rotate clockwise
                player.angle = Math.atan2(vy, vx);
            }

            // If outside, keep player constrained to the outer band (snap to nearest edge band)
            if (isOutside) {
                const band = OUTER_BAND;
                // keep within canvas but prefer the band distance from edges
                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
                player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

                // Snap to nearest edge band if close to it
                const distLeft = player.x;
                const distRight = canvas.width - (player.x + player.width);
                const distTop = player.y;
                const distBottom = canvas.height - (player.y + player.height);
                const minDist = Math.min(distLeft, distRight, distTop, distBottom);
                if (minDist === distLeft) {
                    player.x = Math.min(band - player.width / 2, player.x);
                } else if (minDist === distRight) {
                    player.x = Math.max(canvas.width - band, player.x);
                } else if (minDist === distTop) {
                    player.y = Math.min(band - player.height / 2, player.y);
                } else {
                    player.y = Math.max(canvas.height - band, player.y);
                }
            }

            // Draw player with rotation based on movement angle
            ctx.font = '32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = player.color;
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            const centerX = player.x + player.width / 2;
            const centerY = player.y + player.height / 2;
            ctx.save();
            ctx.translate(centerX, centerY);
            // If angle is NaN (no movement yet), default to 0
            const angle = isFinite(player.angle) ? player.angle : 0;
            ctx.rotate(angle);
            ctx.fillText(PLAYER_ICON, 0, 0);
            ctx.strokeText(PLAYER_ICON, 0, 0);
            ctx.restore();

            // Update and draw target
            target.currentLife++;
            if (target.currentLife >= target.lifetime) {
                spawnTarget();
            }

            // Pulsating target
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = target.color;
            ctx.fillText(TARGET_ICON, target.x + target.width / 2, target.y + target.height / 2);
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.strokeText(TARGET_ICON, target.x + target.width / 2, target.y + target.height / 2);

            // Check target (gem) collection
            if (!inTransition && checkCollision(player, target)) {
                const points = 100 * getCombinedLevel() * scoreMultiplier;
                score += points;
                gemsCollected++;
                createParticles(target.x + target.width / 2, target.y + target.height / 2, '#ffff00');
                addFloatingText(target.x + target.width / 2, target.y + target.height / 2, `+${points}`, '#ffff00');
                spawnTarget();
                updateHUD();

                // If collected enough gems, trigger transition to next sublevel
                if (gemsCollected >= GEMS_PER_STAGE) {
                    inTransition = true;
                    transitionTimer = TRANSITION_FRAMES;
                    transitionText = `LEVEL ${gameLevel}.${subLevel} COMPLETE`;
                }
            }

            // During transition we don't spawn new blocks
            if (!inTransition) {
                const spawnRate = stageConfig.spawnRate || Math.max(30 - getCombinedLevel() * 1.2, 10);
                if (frameCount % spawnRate === 0) {
                    spawnBlock();
                }
            }

            // Update and draw blocks
            for (let i = blocks.length - 1; i >= 0; i--) {
                const block = blocks[i];

                // Spawn animation for mushroom blocks
                if (block.spawnAnimation < block.maxSpawnAnimation) {
                    block.spawnAnimation++;
                }

                if (!block.landed) {
                    block.x += block.vx;
                    block.y += block.vy;

                    // Check if falling/moving block hits another block
                    for (let j = 0; j < blocks.length; j++) {
                        if (i !== j && blocks[j].landed) {
                            // Check collision with landed blocks
                            const nextX = block.x + block.vx;
                            const nextY = block.y + block.vy;

                            // Predict collision
                            const willCollide =
                                nextX < blocks[j].x + blocks[j].width &&
                                nextX + block.width > blocks[j].x &&
                                nextY < blocks[j].y + blocks[j].height &&
                                nextY + block.height > blocks[j].y;

                            if (willCollide) {
                                block.landed = true;
                                block.falling = false;

                                // Position block based on collision direction
                                if (block.vy > 0) {
                                    // Falling from top - land on top of other block
                                    block.y = blocks[j].y - block.height;
                                } else if (block.vy < 0) {
                                    // Coming from bottom
                                    block.y = blocks[j].y + blocks[j].height;
                                } else if (block.vx > 0) {
                                    // Coming from left
                                    block.x = blocks[j].x - block.width;
                                } else if (block.vx < 0) {
                                    // Coming from right
                                    block.x = blocks[j].x + blocks[j].width;
                                }

                                block.vx = 0;
                                block.vy = 0;
                                break;
                            }
                        }
                    }

                    // Check if hit ground
                    if (block.y + block.height >= canvas.height) {
                        block.landed = true;
                        block.falling = false;
                        block.vy = 0;
                        block.y = canvas.height - block.height;
                    }

                    // Check if hit ceiling
                    if (block.y <= 0) {
                        block.landed = true;
                        block.vy = 0;
                        block.y = 0;
                    }

                    // Check if hit walls
                    if (block.x <= 0) {
                        block.landed = true;
                        block.vx = 0;
                        block.x = 0;
                    }
                    if (block.x + block.width >= canvas.width) {
                        block.landed = true;
                        block.vx = 0;
                        block.x = canvas.width - block.width;
                    }
                }

                // Draw block with spawn animation
                const scale = block.spawnAnimation / block.maxSpawnAnimation;
                let drawWidth = block.width * scale;
                let drawHeight = block.height * scale;
                let drawX = block.x + (block.width - drawWidth) / 2;
                let drawY = block.y + (block.height - drawHeight) / 2;

                // Effetto impulso solo se pulse=true
                if (block.pulse) {
                    // Oscilla tra 80% e 140% della dimensione base
                    const pulseScale = 1 + 0.3 * Math.sin(frameCount * 0.15 + block.pulsePhase);
                    drawWidth = block.width * scale * pulseScale;
                    drawHeight = block.height * scale * pulseScale;
                    drawX = block.x + (block.width - drawWidth) / 2;
                    drawY = block.y + (block.height - drawHeight) / 2;
                }
                let blockIcon = block.pulse ? BLOCK_PULSE_ICON : BLOCK_ICON;
                ctx.font = `${Math.round(drawWidth)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = block.color;
                ctx.fillText(blockIcon, drawX + drawWidth / 2, drawY + drawHeight / 2);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.strokeText(blockIcon, drawX + drawWidth / 2, drawY + drawHeight / 2);

                // Check collision with player (only if fully spawned)
                if (block.spawnAnimation >= block.maxSpawnAnimation && checkCollision(player, block)) {
                    lives--;
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                    blocks.splice(i, 1);

                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                    updateHUD();
                    continue;
                }

                // Remove off-screen blocks (only moving blocks)
                if (!block.landed && (block.x < -block.width * 2 || block.x > canvas.width + block.width ||
                    block.y < -block.height * 2 || block.y > canvas.height + block.height)) {
                    blocks.splice(i, 1);
                }
            }

            // Update and draw bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;

                ctx.fillStyle = '#00ff00';
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

                // Check collision with blocks
                for (let j = blocks.length - 1; j >= 0; j--) {
                    if (checkCollision(bullet, blocks[j])) {
                        score += 10 * scoreMultiplier;
                        const bx = blocks[j].x + blocks[j].width / 2;
                        const by = blocks[j].y + blocks[j].height / 2;
                        createParticles(bx, by, '#ff00ff');
                        addFloatingText(bx, by, `+${10 * scoreMultiplier}`, '#ff88ff');
                        blocks.splice(j, 1);
                        bullets.splice(i, 1);
                        updateHUD();
                        break;
                    }
                }

                // Check collision with player (auto-hit)
                if (checkCollision(bullet, player)) {
                    bullets.splice(i, 1);
                    player.speed = Math.max(PLAYER_MIN_SPEED, player.speed - 1);
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#00ff00');
                    if (player.speed <= PLAYER_MIN_SPEED) {
                        lives--;
                        player.speed = PLAYER_INITIAL_SPEED;
                        updateHUD();
                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                    }
                    continue;
                }

                // Rimbalzo sui bordi
                let bounced = false;
                if (bullet.x <= 0 || bullet.x + bullet.width >= canvas.width) {
                    bullet.dx = -bullet.dx;
                    bounced = true;
                }
                if (bullet.y <= 0 || bullet.y + bullet.height >= canvas.height) {
                    bullet.dy = -bullet.dy;
                    bounced = true;
                }
                // Se ha rimbalzato, cambia direzione randomica (ma non opposta a quella da cui arriva)
                if (bounced) {
                    const dirs = [];
                    if (Math.abs(bullet.dx) > 0) {
                        dirs.push({ dx: 0, dy: -8 }); // up
                        dirs.push({ dx: 0, dy: 8 });  // down
                    } else {
                        dirs.push({ dx: -8, dy: 0 }); // left
                        dirs.push({ dx: 8, dy: 0 });  // right
                    }
                    if (Math.random() < 0.5) {
                        const newDir = dirs[Math.floor(Math.random() * dirs.length)];
                        bullet.dx = newDir.dx;
                        bullet.dy = newDir.dy;
                    }
                }

                // Rimuovi proiettili "impazziti" che escono troppo
                if (
                    bullet.x < -50 || bullet.x > canvas.width + 50 ||
                    bullet.y < -50 || bullet.y > canvas.height + 50
                ) {
                    bullets.splice(i, 1);
                }
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Floating texts (score, key, door messages)
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.x += 0;
                ft.y += ft.vy;
                ft.life--;
                ctx.globalAlpha = Math.max(0, ft.life / 60);
                ctx.fillStyle = ft.color;
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // Check for extra life every 1000 points
            if (score > 0 && score % 1000 === 0) {
                lives++;
                updateHUD();
            }

            // Pulsi/pulse blocks may shoot shards when stage enables it (level 5)
            if (stageConfig.shards) {
                for (let block of blocks) {
                    if (block.pulse && block.landed && Math.random() < (stageConfig.shardFireChance || 0.01)) {
                        const speed = 6 + (stageConfig.shardSpeed || 1) * 2; // base speed scaled
                        const dirs = [
                            { dx: speed, dy: 0 },
                            { dx: -speed, dy: 0 },
                            { dx: 0, dy: speed },
                            { dx: 0, dy: -speed }
                        ];
                        const dir = dirs[Math.floor(Math.random() * dirs.length)];
                        bulletsBlock.push({
                            x: block.x + block.width / 2 - 4,
                            y: block.y + block.height / 2 - 4,
                            width: 8,
                            height: 8,
                            dx: dir.dx,
                            dy: dir.dy
                        });
                    }
                }
            }

            // Gestione proiettili dei blocchi pulsanti
            for (let i = bulletsBlock.length - 1; i >= 0; i--) {
                const bullet = bulletsBlock[i];
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                // Rimbalzo sui bordi
                if (bullet.x <= 0 || bullet.x + bullet.width >= canvas.width) {
                    bullet.dx = -bullet.dx;
                }
                if (bullet.y <= 0 || bullet.y + bullet.height >= canvas.height) {
                    bullet.dy = -bullet.dy;
                }
                // Se colpisce un blocco, si ferma
                let hitBlock = false;
                for (let j = 0; j < blocks.length; j++) {
                    if (checkCollision(bullet, blocks[j])) {
                        hitBlock = true;
                        break;
                    }
                }
                if (hitBlock) {
                    bulletsBlock.splice(i, 1);
                    continue;
                }
                // Rimuovi proiettili fuori area
                if (
                    bullet.x < -50 || bullet.x > canvas.width + 50 ||
                    bullet.y < -50 || bullet.y > canvas.height + 50
                ) {
                    bulletsBlock.splice(i, 1);
                }
            }

            // Gestione porte
            if (frameCount % 600 === 0) { // ogni tot tempo
                doors.forEach(d => d.open = false);
            }

            // Disegna porte (con glow per porte aperte)
            ctx.font = '32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            doors.forEach(door => {
                const cx = door.x;
                const cy = door.y;
                // If open, draw a pulsing glow behind the door
                if (door.open) {
                    // decrement door timer if present
                    if (typeof door.timer === 'number') {
                        door.timer--;
                        if (door.timer <= 0) {
                            // close the door and if player is near penalize
                            door.open = false;
                            // If player overlapping door when it closes, lose a life
                            if (checkCollision(player, { x: door.x - 16, y: door.y - 16, width: 32, height: 32 })) {
                                lives--;
                                createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                                addFloatingText(door.x, door.y, '-1 LIFE', '#ff4444');
                                updateHUD();
                            }
                        }
                    }
                    const pulse = 12 + Math.sin(frameCount * 0.15) * 6; // blur radius
                    ctx.save();
                    // soft glowing circle
                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(0,255,0,0.12)';
                    ctx.arc(cx, cy, 22 + Math.abs(Math.sin(frameCount * 0.12)) * 6, 0, Math.PI * 2);
                    ctx.fill();
                    // shadowed glow for stronger effect
                    ctx.shadowColor = 'rgba(0,255,0,0.9)';
                    ctx.shadowBlur = pulse;
                    ctx.fillStyle = 'rgba(0,255,0,0.02)';
                    ctx.fillRect(cx - 1, cy - 1, 2, 2);
                    ctx.restore();
                }

                ctx.fillStyle = door.open ? '#00ff00' : '#ff0000';
                ctx.fillText(DOOR_ICON, cx, cy);
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 2;
                ctx.strokeText(DOOR_ICON, cx, cy);
            });
            // Disegna chiavi
            levelKeys.forEach(key => {
                if (!key.collected) {
                    ctx.font = '28px Arial';
                    ctx.fillStyle = '#ffff00';
                    ctx.fillText(KEY_ICON, key.x, key.y);
                    ctx.strokeStyle = '#ff00ff';
                    ctx.lineWidth = 2;
                    ctx.strokeText(KEY_ICON, key.x, key.y);
                }
            });
            // Raccogli chiave
            levelKeys.forEach(key => {
                if (!key.collected && checkCollision(player, { x: key.x - 14, y: key.y - 14, width: 28, height: 28 })) {
                    key.collected = true;
                    playerKeys++;
                    addFloatingText(key.x, key.y, 'KEY!', '#ffff00');
                    updateHUD();
                }
            });
            // Spawn chiave se necessario
            spawnKey();

            // Door interactions: open, exit to outside and re-enter
            for (let door of doors) {
                const doorBox = { x: door.x - 16, y: door.y - 16, width: 32, height: 32 };
                if (!isOutside) {
                    // Player is inside and touching a door
                    if (checkCollision(player, doorBox)) {
                        // If door is closed and player has a key, open it (consume key)
                        if (!door.open && playerKeys > 0) {
                            door.open = true;
                            // set a timer for this opened door (frames)
                            door.timer = Math.max(300, 600 - getCombinedLevel() * 20); // shorter timer at higher levels
                            playerKeys--;
                            addFloatingText(door.x, door.y - 20, 'DOOR OPEN', '#88ff88');
                            updateHUD();
                        }
                        // If door is open and player is inside, step outside without consuming an extra key
                        else if (door.open && !isOutside) {
                            isOutside = true;
                            // Place player along the outer band just next to the door (use OUTER_BAND for feel)
                            const bandHalf = Math.max(10, Math.floor(OUTER_BAND / 2));
                            // left
                            if (door.x <= 64) {
                                player.x = Math.max(5, bandHalf - player.width / 2);
                                player.y = Math.max(5, Math.min(canvas.height - player.height - 5, door.y - player.height / 2));
                            }
                            // right
                            else if (door.x >= canvas.width - 64) {
                                player.x = Math.min(canvas.width - player.width - 5, canvas.width - bandHalf - player.width / 2);
                                player.y = Math.max(5, Math.min(canvas.height - player.height - 5, door.y - player.height / 2));
                            }
                            // top
                            else if (door.y <= 64) {
                                player.y = Math.max(5, bandHalf - player.height / 2);
                                player.x = Math.max(5, Math.min(canvas.width - player.width - 5, door.x - player.width / 2));
                            }
                            // bottom
                            else {
                                player.y = Math.min(canvas.height - player.height - 5, canvas.height - bandHalf - player.height / 2);
                                player.x = Math.max(5, Math.min(canvas.width - player.width - 5, door.x - player.width / 2));
                            }
                            // leave the door open so player can re-enter
                            updateHUD();
                        }
                    }
                } else {
                    // Player is outside: can re-enter through an open door without a key
                    if (door.open && checkCollision(player, doorBox)) {
                        isOutside = false;
                        // Place player just inside the door
                        player.x = door.x - player.width / 2;
                        player.y = door.y - player.height / 2;
                        updateHUD();
                    }
                }
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Check for extra life every 1000 points
            if (score > 0 && score % 1000 === 0) {
                lives++;
                updateHUD();
            }

            // Pulsi/pulse blocks may shoot shards when stage enables it (level 5)
            if (stageConfig.shards) {
                for (let block of blocks) {
                    if (block.pulse && block.landed && Math.random() < (stageConfig.shardFireChance || 0.01)) {
                        const speed = 6 + (stageConfig.shardSpeed || 1) * 2;
                        const dirs = [
                            { dx: speed, dy: 0 },
                            { dx: -speed, dy: 0 },
                            { dx: 0, dy: speed },
                            { dx: 0, dy: -speed }
                        ];
                        const dir = dirs[Math.floor(Math.random() * dirs.length)];
                        bulletsBlock.push({
                            x: block.x + block.width / 2 - 4,
                            y: block.y + block.height / 2 - 4,
                            width: 8,
                            height: 8,
                            dx: dir.dx,
                            dy: dir.dy
                        });
                    }
                }
            }

            // Gestione proiettili dei blocchi pulsanti
            for (let i = bulletsBlock.length - 1; i >= 0; i--) {
                const bullet = bulletsBlock[i];
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                // Rimbalzo sui bordi
                if (bullet.x <= 0 || bullet.x + bullet.width >= canvas.width) {
                    bullet.dx = -bullet.dx;
                }
                if (bullet.y <= 0 || bullet.y + bullet.height >= canvas.height) {
                    bullet.dy = -bullet.dy;
                }
                // Se colpisce un blocco, si ferma
                let hitBlock = false;
                for (let j = 0; j < blocks.length; j++) {
                    if (checkCollision(bullet, blocks[j])) {
                        hitBlock = true;
                        break;
                    }
                }
                if (hitBlock) {
                    bulletsBlock.splice(i, 1);
                    continue;
                }
                // Rimuovi proiettili fuori area
                if (
                    bullet.x < -50 || bullet.x > canvas.width + 50 ||
                    bullet.y < -50 || bullet.y > canvas.height + 50
                ) {
                    bulletsBlock.splice(i, 1);
                }
            }

            // Richiama sempre gameLoop se lo stato è ancora 'playing'
            if (gameState === 'playing') {
                requestAnimationFrame(gameLoop);
            }
        }

        // Update HUD
        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = `${gameLevel}.${subLevel}`;
            document.getElementById('lives').textContent = lives;
            // Update keys and outside indicators
            const keysEl = document.getElementById('keys');
            if (keysEl) keysEl.textContent = playerKeys;
            const outsideEl = document.getElementById('outside');
            if (outsideEl) outsideEl.textContent = isOutside ? 'YES' : 'NO';
            const gemsEl = document.getElementById('gems');
            if (gemsEl) gemsEl.textContent = gemsCollected;
            const gemsReqEl = document.getElementById('gemsReq');
            if (gemsReqEl) gemsReqEl.textContent = GEMS_PER_STAGE;
        }

        // End game
        function endGame() {
            gameState = 'gameOver';

            // Nascondi l'HUD e mostra la schermata di attrazione
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('attractScreen').classList.remove('hidden');

            // Rimuovi eventuale gameOver precedente
            const oldGameOver = document.querySelector('.gameOver');
            if (oldGameOver) {
                oldGameOver.remove();
            }

            // Verifica se entra in top ten
            let isTopTen = topTen.length < 10 || score > Math.min(...topTen.map(e => e.score));
            if (isTopTen && score > 0) {
                showTopTenEntry(score);
            } else {
                const gameOverDiv = document.createElement('div');
                gameOverDiv.className = 'gameOver';
                gameOverDiv.innerHTML = `
                    <h2>GAME OVER</h2>
                    <p>SCORE FINALE: ${score}</p>
                    <p>LIVELLO RAGGIUNTO: ${level}</p>
                    <button class="startButton" onclick="location.reload()">RIPROVA</button>
                `;
                document.getElementById('gameContainer').appendChild(gameOverDiv);
            }
        }

        // Mostra schermata top ten a fine gara
        function showTopTenEntry(finalScore) {
            const gameOverDiv = document.querySelector('.gameOver');
            if (gameOverDiv) gameOverDiv.remove();
            const entryDiv = document.createElement('div');
            entryDiv.className = 'gameOver';
            entryDiv.innerHTML = `
                <h2>TOP TEN!</h2>
                <p>Inserisci le tue iniziali (3 lettere):</p>
                <input type="text" id="initialsInput" maxlength="3" style="text-transform:uppercase; font-size:32px; text-align:center; width:80px;">
                <button class="startButton" id="saveScoreBtn">SALVA</button>
            `;
            document.getElementById('gameContainer').appendChild(entryDiv);
            document.getElementById('saveScoreBtn').onclick = function () {
                let initials = document.getElementById('initialsInput').value.toUpperCase().slice(0, 3);
                if (!initials) initials = '???';
                topTen.push({ name: initials, score: finalScore, diff: selectedDifficulty });
                topTen.sort((a, b) => b.score - a.score);
                if (topTen.length > 10) topTen.length = 10;
                showTopTen();
            };
        }
        function showTopTen() {
            const topDiv = document.createElement('div');
            topDiv.className = 'gameOver';
            let html = `<h2>TOP TEN</h2><table style="margin:auto; color:#fff; font-size:18px;">`;
            html += `<tr><th>#</th><th>INIZIALI</th><th>PUNTI</th><th>DIFFICOLTÀ</th></tr>`;
            topTen.forEach((entry, idx) => {
                html += `<tr><td>${idx + 1}</td><td>${entry.name}</td><td>${entry.score}</td><td>${entry.diff}</td></tr>`;
            });
            html += `</table><button class="startButton" onclick="location.reload()">RITORNA</button>`;
            topDiv.innerHTML = html;
            document.getElementById('gameContainer').appendChild(topDiv);
        }

        // Input handlers
        document.addEventListener('keydown', (e) => {
            // Start game from attract screen with Enter
            if (e.key === 'Enter' && gameState === 'attract') {
                e.preventDefault();
                startGame();
                return;
            }
            keys[e.key] = true;
            // Shoot bullet
            if (e.key === ' ' && gameState === 'playing') {
                e.preventDefault();
                // Determina la direzione
                let dx = 0, dy = 0, width = 8, height = 8, offsetX = 0, offsetY = 0;
                switch (player.direction) {
                    case 'left': dx = -8; width = 10; height = 4; offsetX = -player.width / 2 - width / 2; break;
                    case 'right': dx = 8; width = 10; height = 4; offsetX = player.width / 2 + width / 2; break;
                    case 'up': dy = -8; width = 4; height = 10; offsetY = -player.height / 2 - height / 2; break;
                    case 'down': dy = 8; width = 4; height = 10; offsetY = player.height / 2 + height / 2; break;
                }
                bullets.push({
                    x: player.x + player.width / 2 - width / 2 + offsetX,
                    y: player.y + player.height / 2 - height / 2 + offsetY,
                    width: width,
                    height: height,
                    dx: dx,
                    dy: dy
                });
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Add click handler for start button
        document.getElementById('startButton').addEventListener('click', function () {
            console.log('Button clicked');
            startGame();
        });

        // Attract mode animation
        function attractAnimation() {
            if (gameState !== 'attract') return;

            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Animated background
            ctx.strokeStyle = `rgba(0, 255, 255, ${0.2 + Math.sin(Date.now() * 0.001) * 0.1})`;
            ctx.lineWidth = 2;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.arc(
                    canvas.width / 2 + Math.sin(Date.now() * 0.001 + i) * 200,
                    canvas.height / 2 + Math.cos(Date.now() * 0.001 + i) * 200,
                    50 + i * 30,
                    0,
                    Math.PI * 2
                );
                ctx.stroke();
            }

            requestAnimationFrame(attractAnimation);
        }

        // Alternanza schermata iniziale/top ten
        let attractInterval = null;
        function showAttractScreen() {
            const attractDiv = document.createElement('div');
            attractDiv.id = 'attractScreenCustom';
            attractDiv.style.position = 'absolute';
            attractDiv.style.top = '0';
            attractDiv.style.left = '0';
            attractDiv.style.width = '100%';
            attractDiv.style.height = '100%';
            attractDiv.style.background = 'radial-gradient(circle, #1a1f3a 0%, #0a0e27 100%)';
            attractDiv.style.display = 'flex';
            attractDiv.style.flexDirection = 'column';
            attractDiv.style.justifyContent = 'center';
            attractDiv.style.alignItems = 'center';
            attractDiv.style.zIndex = '30';
            attractDiv.innerHTML = `
        <div class="title">BLOCK HUNTER</div>
        <div style="font-size:32px; color:#ffff00; margin:30px;">INSERT COIN</div>
        <button class="startButton" id="insertCoinBtn">INSERISCI MONETA</button>
    `;
            document.getElementById('gameContainer').appendChild(attractDiv);
            document.getElementById('insertCoinBtn').onclick = function () {
                clearInterval(attractInterval);
                const topDiv = document.querySelector('.gameOver');
                if (topDiv) topDiv.remove();
                attractDiv.remove();
                showLevelSelect();
            };
        }
        function showAttractOrTopTen() {
            let showTop = false;
            attractInterval = setInterval(() => {
                const attractDiv = document.getElementById('attractScreenCustom');
                if (attractDiv) attractDiv.remove();
                const topDiv = document.querySelector('.gameOver');
                if (topDiv) topDiv.remove();
                if (showTop && topTen.length > 0) {
                    showTopTen();
                } else {
                    showAttractScreen();
                }
                showTop = !showTop;
            }, 3500);
            showAttractScreen();
        }

        window.onload = function () {
            showAttractOrTopTen();
        };

        attractAnimation();
    </script>
</body>

</html>
