                        showLevelSelect();
                    } else {
                        addFloatingText(canvas.width / 2, canvas.height / 2 + 80, (window.DICT && window.DICT.insert_coin_short) || 'INSERT COIN', '#ffcc00');
                        if (soundEnabled) playTransitionSound();
                    }
                });
            }

            // --- demo implementation: simple autonomous visual demo on a small canvas ---
            function startAttractDemo(canvas, container) {
                const ctx = canvas.getContext('2d');
                let raf = null;
                // demo state (isolated from real game state)
                const demo = {
                    w: canvas.width,
                    h: canvas.height,
                    player: { x: 40, y: 140, vx: 1.3, vy: 0, size: 12, cooldown: 0 },
                    bullets: [],
                    pickups: [],
                    tick: 0
                };

                function spawnPickup() {
                    demo.pickups.push({ x: 20 + Math.random() * (demo.w - 40), y: 20 + Math.random() * (demo.h - 60), size: 8, life: 600 });
                }

                // simple AI: move horizontally, bounce, occasionally jump vertically and shoot
                function step() {
                    demo.tick++;
                    // spawn occasionally
                    if (demo.tick % 180 === 0 && demo.pickups.length < 4) spawnPickup();
                    // move player
                    const p = demo.player;
                    p.x += p.vx;
                    if (p.x < 12 || p.x > demo.w - 12) p.vx *= -1;
                    // small vertical bob
                    p.y = 120 + Math.sin(demo.tick / 16) * 8;
                    // shooting
                    if (p.cooldown > 0) p.cooldown--;
                    if (Math.random() < 0.02 && p.cooldown === 0) {
                        demo.bullets.push({ x: p.x + 6 * Math.sign(p.vx || 1), y: p.y, vx: 2 * Math.sign(p.vx || 1), life: 80 });
                        p.cooldown = 30 + Math.floor(Math.random() * 30);
                    }
                    // update bullets
                    for (let i = demo.bullets.length - 1; i >= 0; i--) {
                        const b = demo.bullets[i]; b.x += b.vx; b.life--; if (b.life <= 0) demo.bullets.splice(i, 1);
                    }
                    // pickup collisions
                    for (let i = demo.pickups.length - 1; i >= 0; i--) {
                        const pk = demo.pickups[i]; pk.life--;
                        const dx = pk.x - p.x, dy = pk.y - p.y; if (dx * dx + dy * dy < (pk.size + p.size) * (pk.size + p.size)) {
                            // collect: remove and create small effect
                            demo.pickups.splice(i, 1);
                            // small burst of particles - represented as quick bullets in opposite direction
                            for (let j = 0; j < 6; j++) demo.bullets.push({ x: pk.x, y: pk.y, vx: (Math.random() - 0.5) * 3, life: 30 + Math.random() * 30 });
                        }
                        if (pk.life <= 0) demo.pickups.splice(i, 1);
                    }
                }

                function draw() {
                    // background
                    ctx.fillStyle = '#00102a'; ctx.fillRect(0, 0, demo.w, demo.h);
                    // arena border
                    ctx.strokeStyle = '#004466'; ctx.lineWidth = 2; ctx.strokeRect(6, 6, demo.w - 12, demo.h - 12);
                    // pickups
                    for (const pk of demo.pickups) {
                        ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(pk.x, pk.y, pk.size / 2, 0, Math.PI * 2); ctx.fill();
                    }
                    // player
                    const p = demo.player;
                    ctx.fillStyle = '#66ff66'; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                    // bullets/particles
                    for (const b of demo.bullets) { ctx.fillStyle = '#ff9966'; ctx.fillRect(b.x - 2, b.y - 2, 4, 4); }
                    // HUD small
                    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace'; ctx.fillText('DEMO', 8, 14);
                }

                function loop() {
                    step(); draw(); raf = requestAnimationFrame(loop);
                }

                // start
                raf = requestAnimationFrame(loop);

                // expose stop function on container so caller can cancel
                container.demoStop = function () {
                    try { if (raf) cancelAnimationFrame(raf); } catch (e) { }
                    container.demoStop = null;
                };
            }
            // wire HUD sound toggle if present
            const hudBtn = document.getElementById('hudSoundToggle');
            if (hudBtn) {
                hudBtn.addEventListener('click', function () {
                    soundEnabled = !soundEnabled;
                    hudBtn.textContent = `${soundEnabled ? (window.DICT && window.DICT.sound_on) || 'SOUND: ON' : (window.DICT && window.DICT.sound_off) || 'SOUND: OFF'}`;
                });
            }
            attractAnimation();
        };
    </script>
