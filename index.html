<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK HUNTER - by SpikeCode (AI)</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="gameContainer">
        <div id="attractScreen">
            <div class="title" i18n="title">BLOCK HUNTER</div>
            <div class="instructions" id="attractInstructions" i18n="instructions">
                <!-- populated by applyTranslations() -->
                FRECCE - MOVIMENTO<br>
                SPAZIO - SPARA<br>
                RECUPERA L'OGGETTO<br>
                SCHIVA I BLOCCHI
            </div>
            <!-- Coin description placed under the rules (will be populated dynamically) -->
            <div id="attractCoinInfo"></div>
            <!-- Sprite gallery: canvases showing each discovered sprite (sprite-sheet + tail) -->
            <div id="spriteGallery"></div>
            <!-- language selector on the static attract screen (pixel flags) -->
            <div class="lang-selector" id="staticLangSelector">
                <div class="lang-flag" data-lang="en"><canvas id="flag_static_en" width="32" height="22"></canvas>
                    <div class="lang-label">EN</div>
                </div>
                <div class="lang-flag" data-lang="it"><canvas id="flag_static_it" width="32" height="22"></canvas>
                    <div class="lang-label">IT</div>
                </div>
                <div class="lang-flag" data-lang="fr"><canvas id="flag_static_fr" width="32" height="22"></canvas>
                    <div class="lang-label">FR</div>
                </div>
            </div>
            <!-- Footer/hints/byline moved outside attractScreen so they remain visible during Top Ten -->
        </div>

        <div class="hud hidden" id="hud">
            <div><span i18n="score_label">SCORE</span>: <span id="score">0</span></div>
            <div><span i18n="level_label">LEVEL</span>: <span id="level">1</span></div>
            <div><span i18n="lives_label">LIVES</span>: <span id="lives">3</span></div>
            <div><span i18n="gems_label">GEMS</span>: <span id="gems">0</span>/<span id="gemsReq">20</span></div>
            <div><span i18n="keys_label">KEYS</span>: <span id="keys">0</span></div>
            <div><span i18n="outside_label">OUTSIDE</span>: <span id="outside">NO</span></div>
            <div><span i18n="dynamite_label">DYNAMITE</span>: <span id="dynamiteCount">0</span>
                <div id="dynamiteBar">
                    <div id="dynamiteFill"></div>
                </div>
            </div>
            <div><span i18n="invul_label">INVUL</span>: <span id="invul">NO</span></div>
            <div><span i18n="credits_word">CREDITS</span>: <span id="credits">0</span></div>
            <div><button id="hudSoundToggle" i18n="sound_on">SOUND: ON</button></div>
        </div>

        <!-- Persistent Top Ten container (moved inside gameContainer instead of creating popup) -->
        <div id="topTen" class="gameOver hidden"></div>

        <!-- Shared footer, player hints and byline: placed outside #attractScreen so they are visible
         both on the attract screen and when #topTen is shown. z-index raised to ensure visibility. -->
        <div class="credit-footer">
            <span id="attractStaticCredits" i18n="attractmode.staticcredits">INSERT COIN</span>
        </div>
        <!-- Player hints: show which player options are available depending on credits -->
        <div id="attractPlayerHints">
            <div id="attractHint1" class="player-hint" i18n="players_1">1 PLAYER</div>
            <div id="attractHint2" class="player-hint unavailable" i18n="players_2">2 PLAYERS</div>
        </div>
        <div class="byline" i18n="byline">by SpikeCode</div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script src="js/game-config.js"></script>
    <script src="js/game-state.js"></script>
    <script>
        // Language loader and helper
        // Prefer a persisted user choice in localStorage (key: 'bh_lang'), fall back to GAME_CONFIG/default
        const _persistedLang = (function () { try { return localStorage.getItem('bh_lang'); } catch (e) { return null; } })();
        const DEFAULT_LANG = _persistedLang || (window.GAME_CONFIG && window.GAME_CONFIG.DEFAULT_LANG) || 'en';
        // whether language selection is currently enabled (can be disabled while user is in player/level selection)
        window.langSelectionEnabled = true;
        function loadDictionary(lang, cb) {
            // If already loaded and same lang, call cb
            if (window.DICT && window.DICT.lang === lang) {
                if (cb) cb();
                return;
            }
            const existing = document.querySelector(`script[data-dic]`);
            if (existing) existing.remove();
            const script = document.createElement('script');
            script.src = `data/dic/${lang}.js`;
            script.setAttribute('data-dic', lang);
            script.onload = function () {
                try { if (window.DICT && window.DICT.lang) console.log('Loaded DICT', window.DICT.lang); } catch (e) { }
                if (cb) cb();
            };
            script.onerror = function () {
                console.warn('Failed to load dictionary', lang, 'falling back to en');
                if (lang !== 'en') loadDictionary('en', cb);
                else if (cb) cb();
            };
            document.head.appendChild(script);
        }

        // Initialize static language flags (on the static attract screen)
        (function initStaticFlags() {
            try {
                const LANGS = ['en', 'it', 'fr'];
                function drawFlagStatic(canvas, lang) {
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
                    const W = canvas.width, H = canvas.height; ctx.clearRect(0, 0, W, H);
                    if (lang === 'it') {
                        const w3 = Math.floor(W / 3);
                        ctx.fillStyle = '#088A29'; ctx.fillRect(0, 0, w3, H);
                        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(w3, 0, w3, H);
                        ctx.fillStyle = '#CE2B37'; ctx.fillRect(w3 * 2, 0, W - w3 * 2, H);
                    } else if (lang === 'fr') {
                        const w3 = Math.floor(W / 3);
                        ctx.fillStyle = '#0055A4'; ctx.fillRect(0, 0, w3, H);
                        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(w3, 0, w3, H);
                        ctx.fillStyle = '#EF4135'; ctx.fillRect(w3 * 2, 0, W - w3 * 2, H);
                    } else {
                        ctx.fillStyle = '#012169'; ctx.fillRect(0, 0, W, H);
                        ctx.lineCap = 'square'; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = Math.max(1, Math.floor(Math.min(W, H) * 0.28));
                        ctx.beginPath(); ctx.moveTo(-W, -W); ctx.lineTo(W * 2, W * 2); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(W * 2, -W); ctx.lineTo(-W, W * 2); ctx.stroke();
                        ctx.strokeStyle = '#C8102E'; ctx.lineWidth = Math.max(1, Math.floor(Math.min(W, H) * 0.12));
                        ctx.beginPath(); ctx.moveTo(-W, -W); ctx.lineTo(W * 2, W * 2); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(W * 2, -W); ctx.lineTo(-W, W * 2); ctx.stroke();
                        const whiteCross = Math.max(1, Math.floor(Math.min(W, H) * 0.26)); ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(Math.floor(W / 2 - whiteCross / 2), 0, whiteCross, H); ctx.fillRect(0, Math.floor(H / 2 - whiteCross / 2), W, whiteCross);
                        const redCross = Math.max(1, Math.floor(Math.min(W, H) * 0.12)); ctx.fillStyle = '#C8102E';
                        ctx.fillRect(Math.floor(W / 2 - redCross / 2), 0, redCross, H); ctx.fillRect(0, Math.floor(H / 2 - redCross / 2), W, redCross);
                    }
                }
                let selectedIndex = Math.max(0, LANGS.indexOf((window.DICT && window.DICT.lang) || DEFAULT_LANG));
                function refreshStaticSelection() {
                    LANGS.forEach((l, idx) => {
                        const c = document.getElementById('flag_static_' + l);
                        if (c) drawFlagStatic(c, l);
                        const box = c && c.parentElement;
                        if (!box) return;
                        box.style.cursor = 'pointer';
                        if (idx === selectedIndex) box.classList.add('selected'); else box.classList.remove('selected');
                    });
                }

                LANGS.forEach((l, idx) => {
                    const box = document.querySelector(`#staticLangSelector .lang-flag[data-lang="${l}"]`);
                    if (!box) return;
                    box.addEventListener('click', function () {
                        if (!window.langSelectionEnabled) return;
                        selectedIndex = idx;
                        try { localStorage.setItem('bh_lang', l); } catch (e) { }
                        refreshStaticSelection();
                        loadDictionary(l, function () { applyTranslations(); });
                    });
                });

                // keyboard support: left/right to change selection, Enter to apply
                document.addEventListener('keydown', function staticLangKeyHandler(ev) {
                    const staticRoot = document.getElementById('staticLangSelector');
                    // only if static selector is visible
                    if (!window.langSelectionEnabled || !staticRoot || staticRoot.classList.contains('hidden')) return;
                    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
                        ev.preventDefault();
                        if (ev.key === 'ArrowLeft') selectedIndex = (selectedIndex - 1 + LANGS.length) % LANGS.length;
                        else selectedIndex = (selectedIndex + 1) % LANGS.length;
                        refreshStaticSelection();
                        // auto-apply language as soon as selection moves
                        const lang = LANGS[selectedIndex];
                        try { localStorage.setItem('bh_lang', lang); } catch (e) { }
                        loadDictionary(lang, function () { applyTranslations(); });
                    } else if (ev.key === 'Enter') {
                        // keep Enter as a fallback (applies language too)
                        const lang = LANGS[selectedIndex];
                        try { localStorage.setItem('bh_lang', lang); } catch (e) { }
                        loadDictionary(lang, function () { applyTranslations(); });
                    }
                });

                refreshStaticSelection();
            } catch (e) { /* ignore */ }
        })();

        // update the player hints area on the static attract screen according to credits
        // keep track of previous player availability to detect unlock transitions
        let lastTwoAvailable = false;
        let lastOneAvailable = false;
        function refreshAttractPlayerHints() {
            const D = window.DICT || {};
            const hint1 = document.getElementById('attractHint1');
            const hint2 = document.getElementById('attractHint2');
            if (!hint1 || !hint2) return;
            // use translations if present
            hint1.textContent = D.players_1 || '1 PLAYER';
            hint2.textContent = D.players_2 || '2 PLAYERS';
            // compute availability based on per-player cost
            const per = (window.GAME_CONFIG && window.GAME_CONFIG.CREDITS_PER_PLAYER) || 1;
            const c = (credits || 0);
            const needForOne = per;
            const needForTwo = per * 2;
            if (c < needForOne) {
                // none available
                hint1.classList.remove('available'); hint1.classList.add('unavailable');
                hint2.classList.remove('available'); hint2.classList.add('unavailable');
                lastTwoAvailable = false;
                lastOneAvailable = false;
            } else if (c >= needForOne && c < needForTwo) {
                // only one available
                hint1.classList.add('available'); hint1.classList.remove('unavailable');
                hint2.classList.remove('available'); hint2.classList.add('unavailable');
                // trigger an unlock effect when 1-player becomes available (match 2-player behavior)
                if (!lastOneAvailable) {
                    try { hint1.classList.add('unlock'); setTimeout(() => { hint1.classList.remove('unlock'); }, 700); } catch (e) { }
                }
                lastTwoAvailable = false;
                lastOneAvailable = true;
            } else {
                // both available
                hint1.classList.add('available'); hint1.classList.remove('unavailable');
                const nowTwo = true;
                hint2.classList.add('available'); hint2.classList.remove('unavailable');
                // animate unlock for both hints if either became newly available
                if (!lastOneAvailable) {
                    try { hint1.classList.add('unlock'); setTimeout(() => { hint1.classList.remove('unlock'); }, 700); } catch (e) { }
                }
                if (!lastTwoAvailable) {
                    try { hint2.classList.add('unlock'); setTimeout(() => { hint2.classList.remove('unlock'); }, 700); } catch (e) { }
                }
                lastTwoAvailable = nowTwo;
                lastOneAvailable = true;
            }
        }

        // ensure hints are initialized on load
        try { refreshAttractPlayerHints(); } catch (e) { }

        // Build a simple sprite gallery under the attract instructions for testing/preview
        function initSpriteGallery() {
            try {
                const gallery = document.getElementById('spriteGallery');
                if (!gallery) return;
                gallery.innerHTML = '';
                // gather keys from sprite sheet map, tail map, and programmatic SPRITES
                const keys = [];
                Object.keys(SPRITE_SHEET_MAP).forEach(k => { if (!keys.includes(k)) keys.push(k); });
                Object.keys(TAIL_SHEET_MAP).forEach(k => { if (!keys.includes(k)) keys.push(k); });
                Object.keys(SPRITES).forEach(k => { if (!keys.includes(k)) keys.push(k); });

                keys.forEach(k => {
                    const item = document.createElement('div'); item.className = 'sprite-item';
                    const c = document.createElement('canvas'); c.width = 64; c.height = 64; c.setAttribute('data-sprite', k);
                    const lbl = document.createElement('div'); lbl.className = 'label'; lbl.textContent = k;
                    item.appendChild(c); item.appendChild(lbl); gallery.appendChild(item);
                    const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, c.width, c.height);
                    // decide how to draw: prefer sprite sheet, then tail, then programmatic
                    const size = Math.min(c.width, c.height) - 8;
                    if (spriteReady && SPRITE_SHEET_MAP[k]) {
                        drawFromSheet(ctx, k, c.width / 2, c.height / 2, size);
                    } else if (tailReady && TAIL_SHEET_MAP[k]) {
                        drawFromTail(ctx, k, c.width / 2, c.height / 2, size);
                    } else {
                        // programmatic patterns: map some common names
                        if (k === 'player') drawPlayerSpriteAt(ctx, c.width / 2, c.height / 2, size, '#00ff00');
                        else if (k === 'block') drawBlockSpriteAt(ctx, c.width / 2, c.height / 2, size, false, 0);
                        else if (k === 'key') drawKeySpriteAt(ctx, c.width / 2, c.height / 2, size);
                        else if (k === 'door') drawDoorSpriteAt(ctx, c.width / 2, c.height / 2, size, false);
                        else if (k === 'target') drawTargetSpriteAt(ctx, c.width / 2, c.height / 2, size);
                        else if (k === 'dynamite' || k === 'dynamite2') drawDynamiteSpriteAt(ctx, c.width / 2, c.height / 2, size);
                        else if (k === 'doblon') drawCoinSpriteAt(ctx, c.width / 2, c.height / 2, size);
                        else {
                            // fallback: draw cell placeholder
                            ctx.fillStyle = '#666'; ctx.fillRect(8, 8, size, size);
                        }
                    }
                });
            } catch (e) { /* ignore gallery errors */ }
        }

        // ensure gallery is built when sheets load
        try { initSpriteGallery(); } catch (e) { }

        function applyTranslations() {
            const D = window.DICT || {};
            // Helper: resolve nested keys like 'attractmode.staticcredits' from the DICT object
            function resolveDictKey(obj, key) {
                if (!obj || !key) return undefined;
                const parts = key.split('.');
                let cur = obj;
                for (let i = 0; i < parts.length; i++) {
                    if (cur && Object.prototype.hasOwnProperty.call(cur, parts[i])) cur = cur[parts[i]];
                    else return undefined;
                }
                return cur;
            }

            // Apply inline i18n attributes first: any element with [i18n] will get
            // the dictionary value for that key if present; otherwise its existing
            // inner content is left untouched. Also collect missing keys for debugging.
            const _missingI18nKeys = new Set();
            try {
                const nodes = document.querySelectorAll('[i18n]');
                nodes.forEach(n => {
                    try {
                        const k = n.getAttribute('i18n');
                        if (!k) return;
                        const v = resolveDictKey(D, k);
                        if (v !== undefined && v !== null) {
                            // If the dictionary value is an array (multiline), join with <br>
                            if (Array.isArray(v)) {
                                n.innerHTML = v.join('<br>');
                            } else if (typeof v === 'string') {
                                // Preserve HTML when the dictionary value contains markup
                                n.innerHTML = v;
                            } else {
                                n.textContent = String(v);
                            }
                        } else {
                            _missingI18nKeys.add(k);
                        }
                    } catch (e) { /* ignore individual element errors */ }
                });
            } catch (e) { /* ignore scanning errors */ }
            // If in developer console mode, log any missing translation keys once
            try {
                if (_missingI18nKeys.size > 0) {
                    console.warn('Missing i18n keys (add to data/dic/*.js):', Array.from(_missingI18nKeys).sort());
                }
            } catch (e) { }
            // HUD
            const hud = document.getElementById('hud');
            if (hud) {
                hud.innerHTML = `
                    <div>${D.score_label || 'SCORE'}: <span id="score">0</span></div>
                    <div>${D.level_label || 'LEVEL'}: <span id="level">1</span></div>
                    <div>${D.lives_label || 'LIVES'}: <span id="lives">3</span></div>
                    <div>GEMS: <span id="gems">0</span>/<span id="gemsReq">20</span></div>
                    <div>KEYS: <span id="keys">0</span></div>
                    <div>OUTSIDE: <span id="outside">NO</span></div>
                    <div>DYNAMITE: <span id="dynamiteCount">0</span>
                                <div id="dynamiteBar">
                                    <div id="dynamiteFill"></div>
                                </div>
                    </div>
                    <div>INVUL: <span id="invul">NO</span></div>
                    <div>${D.credits_word || 'CREDITS'}: <span id="credits">0</span></div>
                    <div><button id="hudSoundToggle">${window.soundEnabled ? (D.sound_on || 'SOUND: ON') : (D.sound_off || 'SOUND: OFF')}</button></div>
                `;
            }
            // Update any visible credit footers now
            const asc = document.getElementById('attractStaticCredits'); if (asc) asc.textContent = (credits && credits > 0) ? `${D.credits_word || 'CREDITS'}: ${credits}` : (D.insert_coin || 'INSERT COIN');
            const ac = document.getElementById('attractCredits'); if (ac) ac.textContent = (credits && credits > 0) ? `${D.credits_word || 'CREDITS'}: ${credits}` : (D.insert_coin || 'INSERT COIN');
            // mark static language selector
            try {
                const lang = (D && D.lang) || DEFAULT_LANG;
                const boxes = document.querySelectorAll('#staticLangSelector .lang-flag');
                boxes.forEach(b => { if (b.getAttribute('data-lang') === lang) b.classList.add('selected'); else b.classList.remove('selected'); });
            } catch (e) { }
            // refresh player hints (1/2 player availability)
            try { refreshAttractPlayerHints(); } catch (e) { }
            // Update attract-screen instructions if present
            const instrDiv = document.getElementById('attractInstructions');
            if (instrDiv) {
                const lines = (D.instructions && Array.isArray(D.instructions)) ? D.instructions : null;
                if (lines && lines.length) instrDiv.innerHTML = lines.join('<br>');
            }
            // Update coin description under the rules (dynamic based on configured cost)
            try {
                const per = (window.GAME_CONFIG && window.GAME_CONFIG.CREDITS_PER_PLAYER) || 1;
                const infoEl = document.getElementById('attractCoinInfo');
                if (infoEl) {
                    // prefer a dictionary override if present
                    if (D.coin_info) {
                        // allow templates: {per}, {two}, {perPlural}
                        const lang = (D && D.lang) || DEFAULT_LANG;
                        const perPlural = (lang === 'it') ? (per > 1 ? 'e' : '') : (per > 1 ? 's' : '');
                        infoEl.textContent = D.coin_info.replace('{per}', per).replace('{two}', per * 2).replace('{perPlural}', perPlural);
                    } else infoEl.textContent = `1 player: ${per} coin${per > 1 ? 's' : ''} — 2 players: ${per * 2} coins`;
                }
            } catch (e) { }

            // Optional: draw dashed border around the inner bounds to visualize the playable room
            try {
                if (window._showInnerBoundsBorder) {
                    const ibb = _ib_draw; // inner bounds used for drawing walls
                    ctx.save();
                    ctx.setLineDash([8, 4]);
                    ctx.strokeStyle = 'rgba(255,200,0,0.95)';
                    ctx.lineWidth = Math.max(2, Math.round(scale(4)));
                    ctx.strokeRect(ibb.minX + 0.5, ibb.minY + 0.5, Math.max(0, ibb.maxX - ibb.minX - 1), Math.max(0, ibb.maxY - ibb.minY - 1));
                    ctx.setLineDash([]);
                    // label the border with width x height in tiles (approx)
                    try {
                        const approxW = Math.round((ibb.maxX - ibb.minX) / (spriteReady && spriteCellW ? Math.max(8, Math.round(Math.min(spriteCellW, spriteCellH) * (SIZE_SCALE || 1))) : Math.round(scale(32))));
                        const approxH = Math.round((ibb.maxY - ibb.minY) / (spriteReady && spriteCellH ? Math.max(8, Math.round(Math.min(spriteCellW, spriteCellH) * (SIZE_SCALE || 1))) : Math.round(scale(32))));
                        ctx.fillStyle = 'rgba(255,200,0,0.95)';
                        ctx.font = '14px monospace';
                        ctx.fillText(`${approxW}x${approxH}`, ibb.minX + 8, Math.max(ibb.minY + 18, ibb.maxY - 8));
                    } catch (e) { }
                    ctx.restore();
                }
            } catch (e) { }
        }

        // Load a level map defined as JS to avoid CORS (expects files under data/level/levelXY.js)
        // The level file should set window.LEVEL_MAP = { cols, rows, map: [[tileKey,...],...], tileSize?: number }
        function loadLevelMap(level, sublevel, cb) {
            try { window.LEVEL_MAP = null; } catch (e) { }
            const name = `level${level}${sublevel}`; // e.g. level10 for level=1 sublevel=0
            const existing = document.querySelector(`script[data-level]`);
            if (existing) existing.remove();
            const script = document.createElement('script');
            script.src = `data/level/${name}.js`;
            script.setAttribute('data-level', name);
            script.onload = function () {
                // LEVEL_MAP should be set by the loaded file
                setTimeout(() => { // small delay to ensure script executed
                    if (window.LEVEL_MAP && window.LEVEL_MAP.map) {
                        cb(window.LEVEL_MAP);
                    } else {
                        cb(null);
                    }
                }, 4);
            };
            script.onerror = function () { cb(null); };
            document.head.appendChild(script);
        }
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // Global size scale for all in-game objects (increase to make everything larger)
        const SIZE_SCALE = (window.GAME_CONFIG && window.GAME_CONFIG.SIZE_SCALE) || 1.5;
        function scale(n) { return Math.max(1, Math.round(n * SIZE_SCALE)); }

        // Runtime game state is initialized in `js/game-state.js` (loaded before this script)
        // Here we only keep derived or config-backed constants.
        const CONTINUE_FRAMES = (window.GAME_CONFIG && window.GAME_CONFIG.CONTINUE_FRAMES) || 600; // 10s at ~60fps
        const GEMS_PER_STAGE = (window.GAME_CONFIG && window.GAME_CONFIG.GEMS_PER_STAGE) || 20;
        const TRANSITION_FRAMES = (window.GAME_CONFIG && window.GAME_CONFIG.TRANSITION_FRAMES) || 150; // ~2.5s at 60fps

        // Floating texts helper (runtime array `floatingTexts` is defined in js/game-state.js)
        function addFloatingText(x, y, text, color = '#ffffff') {
            floatingTexts.push({ x: x, y: y, text: text, color: color, life: 60, vy: -0.5 });
        }

        // Player
        const PLAYER_INITIAL_SPEED = (window.GAME_CONFIG && window.GAME_CONFIG.PLAYER_INITIAL_SPEED) || 5;
        const PLAYER_MIN_SPEED = (window.GAME_CONFIG && window.GAME_CONFIG.PLAYER_MIN_SPEED) || 1;
        const player = {
            x: 400,
            y: 550,
            width: scale(20),
            height: scale(20),
            speed: PLAYER_INITIAL_SPEED,
            color: '#00ff00',
            direction: 'up', // 'up', 'down', 'left', 'right', 'up-left', ...
            angle: 0 // radians for rendering rotation
        };

        // Movement helper (declared to avoid ReferenceError)
        let playerIsMoving = false;
        // Whether the player is outside (walking the outer border)
        let isOutside = false;
        const OUTER_BAND = (window.GAME_CONFIG && window.GAME_CONFIG.OUTER_BAND) || 80; // how wide the outside path is along the edges (tuned)

        // Inner playable area bounds (main walled area). The outer band around it is the escape path.
        function getInnerBounds() {
            return {
                minX: OUTER_BAND,
                minY: OUTER_BAND,
                maxX: Math.max(OUTER_BAND, canvas.width - OUTER_BAND),
                maxY: Math.max(OUTER_BAND, canvas.height - OUTER_BAND)
            };
        }

        // Target object
        const target = {
            x: 0,
            y: 0,
            width: scale(28),
            height: scale(28),
            color: '#ffff00',
            lifetime: 300, // frames before moving
            currentLife: 0
        };

        // Game objects
        let blocks = [];
        let dynamiteBoxes = [];
        let doblonBoxes = [];
        // Explosion visuals
        let explosions = [];
        // Screen shake state for strong explosions

        // Compute tight bounding boxes for each tail sheet entry (callable from console)
        function computeTailBBoxes() {
            if (!tailReady) return false;
            try {
                // draw the full tail sheet into a temporary canvas
                const tmp = document.createElement('canvas');
                tmp.width = tailSheet.width;
                tmp.height = tailSheet.height;
                const tctx = tmp.getContext('2d');
                tctx.imageSmoothingEnabled = false;
                tctx.clearRect(0, 0, tmp.width, tmp.height);
                tctx.drawImage(tailSheet, 0, 0);
                Object.keys(TAIL_SHEET_MAP).forEach(key => {
                    const e = TAIL_SHEET_MAP[key];
                    const cx = Math.round(e.c * tailCellW);
                    const cy = Math.round(e.r * tailCellH);
                    const cw = Math.max(1, Math.round(tailCellW));
                    const ch = Math.max(1, Math.round(tailCellH));
                    let imgData;
                    try { imgData = tctx.getImageData(cx, cy, cw, ch); } catch (err) { imgData = null; }
                    if (!imgData) {
                        const pad = Math.max(1, Math.round(Math.min(tailCellW, tailCellH) * 0.02));
                        TAIL_SHEET_BBOX[key] = { sx: Math.round(cx + pad), sy: Math.round(cy + pad), sw: Math.max(4, Math.round(cw - pad * 2)), sh: Math.max(4, Math.round(ch - pad * 2)) };
                        return;
                    }
                    const data = imgData.data;
                    let minX = cw, minY = ch, maxX = -1, maxY = -1;
                    for (let y = 0; y < ch; y++) {
                        for (let x = 0; x < cw; x++) {
                            const idx = (y * cw + x) * 4 + 3;
                            const a = data[idx];
                            if (a > 8) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                            }
                        }
                    }
                    if (maxX < 0) {
                        const pad = Math.max(1, Math.round(Math.min(tailCellW, tailCellH) * 0.02));
                        TAIL_SHEET_BBOX[key] = { sx: Math.round(cx + pad), sy: Math.round(cy + pad), sw: Math.max(4, Math.round(cw - pad * 2)), sh: Math.max(4, Math.round(ch - pad * 2)) };
                    } else {
                        const pad = 1;
                        const sx = Math.max(0, cx + minX - pad);
                        const sy = Math.max(0, cy + minY - pad);
                        const sw = Math.min(tailSheet.width - sx, (maxX - minX + 1) + pad * 2);
                        const sh = Math.min(tailSheet.height - sy, (maxY - minY + 1) + pad * 2);
                        TAIL_SHEET_BBOX[key] = { sx: sx, sy: sy, sw: Math.max(4, Math.round(sw)), sh: Math.max(4, Math.round(sh)) };
                    }
                });
                console.log('Computed TAIL_SHEET_BBOX for', Object.keys(TAIL_SHEET_BBOX).length, 'entries');
                return true;
            } catch (e) {
                console.warn('Failed to compute tail bboxes', e);
                return false;
            }
        }
        const TAIL_SHEET_MAP = {

        function drawFromTail(ctx, keyName, cx, cy, size, rotate = 0) {
            if (!tailReady) return false;

            // prefer tight bounding boxes if we computed them on load
            let sx, sy, sw, sh;
            const bbox = TAIL_SHEET_BBOX[keyName];
            if (bbox) {
                sx = bbox.sx; sy = bbox.sy; sw = bbox.sw; sh = bbox.sh;

                const pad = Math.max(1, Math.round(Math.min(tailCellW, tailCellH) * 0.02));

                    dh = Math.max(1, Math.round(size / aspect));

                    dh = size;
                    dw = Math.max(1, Math.round(size * aspect));

                ctx.drawImage(tailSheet, sx, sy, sw, sh, -dw / 2, -dh / 2, dw, dh);

            ctx.restore();
            return true;

        function drawFromSheet(ctx, keyName, cx, cy, size, rotate = 0) {

        function drawSpritePattern(ctx, pattern, centerX, centerY, size, palette) {
            const rows = pattern.length;
            const cols = pattern[0].length;
            const px = size / Math.max(rows, cols);
            const offsetX = -cols * px / 2;
            const offsetY = -rows * px / 2;
            for (let r = 0; r < rows; r++) {
                const row = pattern[r];
                for (let c = 0; c < cols; c++) {
                    const ch = row[c];
                    if (ch === '1') {
                        ctx.fillStyle = palette[0];
                        ctx.fillRect(Math.round(centerX + offsetX + c * px), Math.round(centerY + offsetY + r * px), Math.ceil(px), Math.ceil(px));
                    }
                }
            }
        }

        function drawPlayerSpriteAt(ctx, cx, cy, size, color) {
            // prefer sprite sheet if available (player sprite used for player)

        // Return combined numeric level used for scoring/legacy behavior
        function getCombinedLevel() {

        // Configure stage parameters based on gameLevel and subLevel
        function configureStage() {
            // default
            stageConfig = {
                doorsCount: 0,
                spawnTypes: ['random'], // 'random', 'top', 'bottom', 'left', 'right'
                blockSpeed: 1,
                pulseChance: 0,
                pulseSizes: [],
                shards: false,
                shardSpeed: 0,
                shardFireChance: 0.01,
                spawnRate: 20
            };

            const g = gameLevel;
            const s = subLevel;

            // Map according to spec
            if (g === 1) {
                // Level 1: only random; doors on sublevel 4-5
                stageConfig.spawnTypes = ['random'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s >= 4) ? 2 : 0;
            } else if (g === 2) {
                // Level 2: random + top/bottom; doors on sublevel 3-5
                stageConfig.spawnTypes = ['random', 'top', 'bottom'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s >= 3) ? 2 : 0;
            } else if (g === 3) {
                // Level 3: random + all four directions
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s <= 2) ? 4 : 6;
            } else if (g === 4) {
                // Level 4: like 3 but with pulse rocks; doors vary 6/8
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s <= 2) ? 6 : 8;
                stageConfig.pulseChance = 0.25; // some rocks pulse
                stageConfig.pulseSizes = ['small', 'big'];
            } else if (g === 5) {
                // Level 5: like 4 but pulse rocks shoot shards
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = 8;
                stageConfig.pulseChance = 0.3;
                stageConfig.pulseSizes = ['small', 'big'];
                stageConfig.shards = true;
                stageConfig.shardSpeed = s; // shards speed equals sublevel
                stageConfig.shardFireChance = 0.02 + s * 0.005; // increase with sublevel
            }

            // spawnRate inversely proportional to difficulty (larger = slower spawns)
            // Use integer spawn rates (round) and a sensible minimum so modulo checks work
            stageConfig.spawnRate = Math.max(Math.round(48 - getCombinedLevel() * 1.2), 14);

            // Update global legacy level var
            level = getCombinedLevel();

            // Setup doors according to new config
            setupDoorsForStage(stageConfig.doorsCount || 0);
            // Setup doblons for this gameLevel
            let doblonCount = 1;
            if (gameLevel <= 2) doblonCount = 1;
            else if (gameLevel === 3) doblonCount = 2;
            else if (gameLevel >= 4) doblonCount = 4;
            setupDoblonsForStage(doblonCount);
        }

        // Clean fields and advance after transition
        function finishAdvanceAfterTransition() {
            // Clear playfield
            blocks = [];
            bullets = [];
            bulletsBlock = [];
            particles = [];
            levelKeys = [];
            floatingTexts = [];
            doors = [];
            gemsCollected = 0;
            // Reset player position
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 50;

            inTransition = false;
            // Advance to next sublevel (this will configure stage and set doors)
            advanceSublevel();

            // Start fresh
            spawnTarget();
            updateHUD();
        }

        // Setup doors array with a given number of doors distributed on edges
        function setupDoorsForStage(count) {
            doors = [];
            if (!count || count <= 0) return;
            const positions = [];
            // We'll distribute doors around the edges: left, top, right, bottom, repeating
            const edges = ['left', 'top', 'right', 'bottom'];
            for (let i = 0; i < count; i++) {
                const edge = edges[i % edges.length];
                const idx = Math.floor(i / edges.length);
                // spread along the edge
                const t = 0.2 + (idx + (i % edges.length) / Math.max(1, Math.floor((count + edges.length - 1) / edges.length))) * 0.6;
                let x = canvas.width / 2, y = canvas.height / 2;
                switch (edge) {
                    case 'left': x = scale(32); y = Math.round(canvas.height * t); break;
                    case 'right': x = canvas.width - scale(32); y = Math.round(canvas.height * t); break;
                    case 'top': y = scale(32); x = Math.round(canvas.width * t); break;
                    case 'bottom': y = canvas.height - scale(32); x = Math.round(canvas.width * t); break;
                }
                doors.push({ x: x, y: y, open: false });
            }
        }

        // Place doblons (gold coins) for this stage
        function setupDoblonsForStage(count) {
            doblonBoxes = [];
            if (!count || count <= 0) return;
            for (let i = 0; i < count; i++) {
                const box = {
                    x: Math.random() * (canvas.width - scale(120)) + scale(60),
                    y: Math.random() * (canvas.height - scale(240)) + scale(120),
                    width: scale(32),
                    height: scale(32),
                    collected: false
                };
                doblonBoxes.push(box);
            }
        }

        // Advance sublevel/level when player progresses
        function advanceSublevel() {
            if (gameLevel === 5 && subLevel === 5) {
                // End game - reached final
                endGame();
                return;
            }
            subLevel++;
            if (subLevel > 5) {
                subLevel = 1;
                gameLevel = Math.min(5, gameLevel + 1);
            }
            configureStage();
            updateHUD();
        }

        // Spawn a key occasionally for doors (only one active at a time)
        function spawnKey() {
            // If there is already an uncollected key, do nothing
            const active = levelKeys.find(k => !k.collected);
            if (active) return;

            // Small random chance to spawn a key, scaled by level
            const baseChance = 0.001; // per frame
            const chance = baseChance + Math.min(level * 0.0005, 0.01);
            if (Math.random() < chance) {
                const key = {
                    x: Math.random() * (canvas.width - scale(60)) + scale(30),
                    y: Math.random() * (canvas.height - scale(120)) + scale(60),
                    collected: false
                };
                levelKeys.push(key);
            }
        }

        // Spawn dynamite box occasionally which replenishes player's dynamite
        function spawnDynamiteBox() {
            // limit number of boxes active
            const active = dynamiteBoxes.find(b => !b.collected);
            if (active) return;
            // chance scaled by level
            const baseChance = 0.0008;
            const chance = baseChance + Math.min(level * 0.0008, 0.01);
            if (Math.random() < chance) {
                const box = {
                    x: Math.random() * (canvas.width - scale(80)) + scale(40),
                    y: Math.random() * (canvas.height - scale(160)) + scale(80),
                    width: scale(34),
                    height: scale(26),
                    amount: 10,
                    collected: false,
                    life: 600 // frames before it disappears (~10s)
                };
                dynamiteBoxes.push(box);
            }
        }

        // Block spawning based on level
        function spawnBlock() {
            // increase base size so blocks are visually larger (apply global scale)
            const baseSize = scale(36);
            const bs = stageConfig.blockSpeed || 1;
            const baseWidth = baseSize;
            const baseHeight = baseSize;
            const pulse = Math.random() < (stageConfig.pulseChance || 0);
            const pulsePhase = Math.random() * Math.PI * 2;
            // varianza dimensionale: small/medium/large (usa BLOCK_SIZE_CONFIG per permettere tuning da runtime)
            const defaultW = scale(34);
            const defaultH = scale(26);
            const roll = Math.random();
            const dist = (window.BLOCK_SIZE_CONFIG && window.BLOCK_SIZE_CONFIG.distribution) || { small: 0.35, medium: 0.5, large: 0.15 };
            const mults = (window.BLOCK_SIZE_CONFIG && window.BLOCK_SIZE_CONFIG.multipliers) || { small: 0.7, medium: 1.0, large: 1.5 };
            let sizeCategory = 'medium';
            let sizeMult = mults.medium;
            if (roll < dist.small) { sizeCategory = 'small'; sizeMult = mults.small; }
            else if (roll < dist.small + dist.medium) { sizeCategory = 'medium'; sizeMult = mults.medium; }
            else { sizeCategory = 'large'; sizeMult = mults.large; }

            const w = Math.max(8, Math.round(defaultW * sizeMult));
            const h = Math.max(6, Math.round(defaultH * sizeMult));

            const block = {
                x: Math.random() * (canvas.width - scale(80)) + scale(40),
                y: Math.random() * (canvas.height - scale(160)) + scale(80),
                width: w,
                height: h,
                sizeCategory: sizeCategory,
                vx: 0,
                vy: 0,
                falling: false,
                landed: true,
                spawnAnimation: 0,
                maxSpawnAnimation: 20,
                pulse: pulse,
                pulsePhase: pulsePhase
                ,
                // angolo iniziale casuale (radianti)
                angle: Math.random() * Math.PI * 2,
                // velocità angolare iniziale (radians per frame)
                angularVel: (Math.random() - 0.5) * 0.12,
                // alcuni blocchi si 'allineano' a multipli di 90° all'atterraggio (stile pixel-art)
                snapTo90: Math.random() < 0.45,
                // bounce visivo al momento dell'atterraggio (px)
                bounce: 0,
                // valore ausiliario per animare il bounce
                bounceVel: 0
            };

            // Choose spawn type based on stageConfig
            const spawnTypes = stageConfig.spawnTypes || ['random'];
            const spawnType = spawnTypes[Math.floor(Math.random() * spawnTypes.length)];

            switch (spawnType) {
                case 'random':
                    // spawn inside the inner walled area
                    const _ib = getInnerBounds();
                    block.x = Math.random() * (Math.max(0, _ib.maxX - _ib.minX - block.width - scale(40))) + _ib.minX + scale(20);
                    block.y = Math.random() * (Math.max(0, _ib.maxY - _ib.minY - block.height - scale(100))) + _ib.minY + scale(50);
                    block.landed = true;
                    break;
                case 'top':
                    const _ib_t = getInnerBounds();
                    block.x = Math.random() * Math.max(0, (_ib_t.maxX - _ib_t.minX - block.width)) + _ib_t.minX;
                    block.y = -block.height;
                    block.vy = 1 + bs;
                    block.falling = true;
                    block.landed = false;
                    break;
                case 'bottom':
                    const _ib_b = getInnerBounds();
                    block.x = Math.random() * Math.max(0, (_ib_b.maxX - _ib_b.minX - block.width)) + _ib_b.minX;
                    block.y = canvas.height + block.height;
                    block.vy = -(1 + bs);
                    block.landed = false;
                    break;
                case 'left':
                    block.x = -block.width;
                    // spawn Y within inner area band vertically
                    const _ib_l = getInnerBounds();
                    block.y = Math.random() * (Math.max(0, _ib_l.maxY - _ib_l.minY - block.height - scale(40))) + _ib_l.minY + scale(20);
                    block.vx = 1 + bs;
                    block.landed = false;
                    break;
                case 'right':
                    block.x = canvas.width + block.width;
                    const _ib_r = getInnerBounds();
                    block.y = Math.random() * (Math.max(0, _ib_r.maxY - _ib_r.minY - block.height - scale(40))) + _ib_r.minY + scale(20);
                    block.vx = -(1 + bs);
                    block.landed = false;
                    break;
                default:
                    const _ib_d = getInnerBounds();
                    block.x = Math.random() * (Math.max(0, _ib_d.maxX - _ib_d.minX - block.width - scale(40))) + _ib_d.minX + scale(20);
                    block.y = Math.random() * (Math.max(0, _ib_d.maxY - _ib_d.minY - block.height - scale(100))) + _ib_d.minY + scale(50);
                    block.landed = true;
            }

            blocks.push(block);
        }

        // Create particle effect
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color: color
                });
            }
        }

        // Collision detection
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                obj1.x + obj1.width > obj2.x &&
                obj1.y < obj2.y + obj2.height &&
                obj1.y + obj1.height > obj2.y;
        }

        // Schermata selezione livello
        // showLevelSelect(preselectPlayers)
        // Se viene passato preselectPlayers (1 o 2), dopo che il giocatore sceglie la difficoltà
        // verrà pre-selezionato automaticamente il numero di giocatori corrispondente.
        function showLevelSelect(preselectPlayers) {
            // stop attract/top-ten alternation while selection UI is active
            try { clearInterval(attractInterval); } catch (e) { }
            // disable language selection while player/level selection is active
            try { window.langSelectionEnabled = false; } catch (e) { }
            try { const staticRoot = document.getElementById('staticLangSelector'); if (staticRoot) staticRoot.classList.add('disabled'); } catch (e) { }
            const selectDiv = document.createElement('div');
            selectDiv.id = 'levelSelect';

            const D = window.DICT || {};
            // Use a centered semi-transparent panel so the attract screen remains visible behind

                <div class="levelPanel">

            `;
            document.getElementById('gameContainer').appendChild(selectDiv);
            // Stile pulsanti senza bordo (keep styling but do not hide static attract children)
            const style = document.createElement('style');
            style.innerHTML = `
.levelPanel {

                background: rgba(10,14,39,0.5);

.levelButton {

            `;
            document.head.appendChild(style);
            // Keyboard navigation for difficulty selection (Up/Down to move, Enter to choose, Esc to cancel)
            const levelButtonsInit = selectDiv.querySelectorAll('.levelButton');
            let levelFocus = 0;
            function updateLevelFocus() {
                const btns = selectDiv.querySelectorAll('.levelButton');
                btns.forEach((b, i) => {
                    if (i === levelFocus) {
                        b.classList.add('focused');
                        try { b.scrollIntoView({ block: 'center', inline: 'center' }); } catch (e) { }
                    } else {
                        b.classList.remove('focused');
                    }
                });
            }
            updateLevelFocus();
            const levelKeyHandler = function (ev) {
                if (!selectDiv || !document.body.contains(selectDiv)) return;
                if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown' || ev.key === 'Enter' || ev.key === 'Escape') {
                    ev.preventDefault();
                    const btns = selectDiv.querySelectorAll('.levelButton');
                    if (ev.key === 'ArrowUp') {
                        levelFocus = (levelFocus - 1 + btns.length) % btns.length;

                    } else if (ev.key === 'ArrowDown') {

                    } else if (ev.key === 'Enter') {
                        const b = btns[levelFocus]; if (b) b.click();
                    } else if (ev.key === 'Escape') {
                        try { selectDiv.remove(); } catch (e) { }
                        try { style.remove(); } catch (e) { }
                        document.removeEventListener('keydown', levelKeyHandler);
                        // re-enable language selection when selection is cancelled
                        try { window.langSelectionEnabled = true; } catch (e) { }
                        try { const staticRoot2 = document.getElementById('staticLangSelector'); if (staticRoot2) staticRoot2.classList.remove('disabled'); } catch (e) { }
                        // restore attract screen children (remove bg-only) and restart attract/top-ten alternation when selection is cancelled
                        try { const staticAttract = document.getElementById('attractScreen'); if (staticAttract) staticAttract.classList.remove('bg-only'); } catch (e) { }
                        showAttractOrTopTen();
                    }
                }
            };
            document.addEventListener('keydown', levelKeyHandler);
            // After choosing difficulty, start the game immediately when a difficulty is chosen
            selectDiv.querySelectorAll('button').forEach(btn => {
                btn.onclick = function () {
                    selectedDifficulty = btn.getAttribute('data-diff');
                    switch (selectedDifficulty) {
                        case 'Beginner': gameLevel = 1; subLevel = 1; scoreMultiplier = 1; break;
                        case 'Medium': gameLevel = 2; subLevel = 1; scoreMultiplier = 2; break;
                        case 'Expert': gameLevel = 3; subLevel = 1; scoreMultiplier = 3; break;
                    }
                    configureStage();
                    // choose players: use preselectPlayers if supplied, otherwise default to 1
                    numPlayers = (preselectPlayers === 2) ? 2 : 1;
                    const per = (window.GAME_CONFIG && window.GAME_CONFIG.CREDITS_PER_PLAYER) || 1;
                    const required = per * numPlayers;
                    if (credits < required) {
                        playCoinRequiredSound(required);
                        animateCreditHint(required);
                        return;
                    }
                    credits -= required;
                    try { const sc = document.getElementById('selectCredits'); if (sc) sc.textContent = credits; } catch (e) { }
                    try { document.removeEventListener('keydown', levelKeyHandler); } catch (e) { }
                    try { const staticAttract3 = document.getElementById('attractScreen'); if (staticAttract3) staticAttract3.classList.remove('bg-only'); } catch (e) { }
                    try { selectDiv.remove(); } catch (e) { }
                    try { style.remove(); } catch (e) { }
                    try { document.getElementById('attractScreen').classList.add('hidden'); } catch (e) { }
