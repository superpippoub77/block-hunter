        // Avvia il gioco
        function startGame() {
            console.log('Starting game...');
            try { if (window.attractInterval) { clearInterval(window.attractInterval); window.attractInterval = null; } } catch (e) { }
            // ensure persistent topTen is hidden when a new game starts
            try { const persistentTop = document.getElementById('topTen'); if (persistentTop) { persistentTop.classList.add('hidden'); } } catch (e) { }
            // apply the in-game decorative frame
            document.body.classList.add('in-game');
            gameState = 'playing';
            score = 0;
            // level viene impostato dalla selezione
            lives = 3;
            blocks = [];
            bullets = [];
            bulletsBlock = [];
            particles = [];
            frameCount = 0;
            player.x = 400;
            player.y = 550;
            player.speed = PLAYER_INITIAL_SPEED;
            playerKeys = 0;
            gemsCollected = 0;
            // give player full dynamite for the level
            playerDynamite = DYNAMITE_MAX;
            inTransition = false;
            // configure initial stage (sets doors according to difficulty)
            configureStage();
            // load a predefined level map (JS) or fallback to generated floor map
            const ib = getInnerBounds();
            loadLevelMap(gameLevel, subLevel, function (lm) {
                if (lm && lm.map && Array.isArray(lm.map)) {
                    // use provided map; allow optional tileSize and origin offsets
                    const tileSizeProvided = lm.tileSize || (tailReady && tailCellW ? Math.max(8, Math.round(Math.min(tailCellW, tailCellH) * (SIZE_SCALE || 1))) : (spriteReady && spriteCellW ? Math.max(8, Math.round(Math.min(spriteCellW, spriteCellH) * (SIZE_SCALE || 1))) : Math.max(16, Math.round(scale(32)))));
                    const originX = (typeof lm.originX === 'number') ? (ib.minX + lm.originX) : ib.minX;
                    const originY = (typeof lm.originY === 'number') ? (ib.minY + lm.originY) : ib.minY;
                    const cols = lm.cols || (lm.map[0] ? lm.map[0].length : 0);
                    const rows = lm.rows || lm.map.length;
                    window.FLOOR_MAP = { originX: originX, originY: originY, cols: cols, rows: rows, tileSize: tileSizeProvided, map: lm.map };
                } else {
                    // fallback: procedurally generate a floor map as before
                    try {
                        // compute tileSize consistent with gameLoop logic (use tailCell when available)
                        let fs;
                        if (tailReady && tailCellW && tailCellH) fs = Math.max(8, Math.round(Math.min(tailCellW, tailCellH) * (SIZE_SCALE || 1)));
                        else if (spriteReady && spriteCellW && spriteCellH) fs = Math.max(8, Math.round(Math.min(spriteCellW, spriteCellH) * (SIZE_SCALE || 1)));
                        else fs = Math.max(16, Math.round(scale(32)));
                        const w = Math.max(0, ib.maxX - ib.minX);
                        const h = Math.max(0, ib.maxY - ib.minY);
                        const cols = Math.max(1, Math.floor(w / fs));
                        const rows = Math.max(1, Math.floor(h / fs));
                        const map = [];
                        const sandKeys = ['sand1', 'sand2', 'sand3', 'sand4', 'sand5', 'sand6', 'sand7', 'sand8', 'sand9', 'sand10', 'sandPile'];
                        for (let r = 0; r < rows; r++) {
                            const row = [];
                            for (let c = 0; c < cols; c++) {
                                // small chance of hole tile (e.g. 3%)
                                if (Math.random() < 0.03) row.push('hole');
                                else {
                                    const idx = (r * cols + c) % sandKeys.length;
                                    row.push(sandKeys[idx]);
                                }
                            }
                            map.push(row);
                        }
                        window.FLOOR_MAP = { originX: ib.minX, originY: ib.minY, cols: cols, rows: rows, tileSize: fs, map: map };
                    } catch (e) { window.FLOOR_MAP = null; }
                }
                // continue init after floor map ready
                levelKeys = [];
                doorCloseTimer = 0;

                // Rimuovi eventuali overlay .gameOver transient ma non rimuovere il container persistente #topTen
                try {
                    const olds = Array.from(document.querySelectorAll('.gameOver')).filter(e => e.id !== 'topTen');
                    olds.forEach(o => o.remove());
                    // if #topTen exists, just hide it
                    const persistentTop = document.getElementById('topTen');
                    if (persistentTop) { persistentTop.classList.add('hidden'); }
                } catch (e) { }

                // hide any attract overlays with a short fade, then start
                hideAttractOverlaysWithFade(() => {
                    document.getElementById('hud').classList.remove('hidden');
                    spawnTarget();
                    updateHUD();
                    gameLoop();
                });
            });
            // NOTE: the rest of startGame's continuation will be executed asynchronously
            return; // we already started the continuation in the callback
        }

        // Dissolvi e rimuovi le overlay di attrazione (statiche e dinamiche), poi chiama cb
        function hideAttractOverlaysWithFade(cb) {
            // play a short transition cue if sound enabled
            if (soundEnabled) playTransitionSound();
            const els = [];
            const staticAttract = document.getElementById('attractScreen');
            if (staticAttract && !staticAttract.classList.contains('hidden')) els.push(staticAttract);
            const customAttract = document.getElementById('attractScreenCustom');
            if (customAttract) els.push(customAttract);
            // collect transient gameOver overlays (do not include persistent #topTen to avoid removing it)
            try {
                const transientGameOvers = Array.from(document.querySelectorAll('.gameOver')).filter(e => e.id !== 'topTen');
                transientGameOvers.forEach(o => els.push(o));
            } catch (e) { }

            // If the persistent topTen is visible, fade it out but don't remove it from DOM
            try {
                const persistentTop = document.getElementById('topTen');
                if (persistentTop && !persistentTop.classList.contains('hidden')) {
                    persistentTop.classList.add('fade-out');
                    setTimeout(() => {
                        persistentTop.classList.add('hidden');

                        persistentTop.classList.remove('fade-out');
                    }, 360);
                }
            } catch (e) { }

            if (els.length === 0) {
                cb();
                return;
            }

            els.forEach(el => {
                // if overlay registered a cleanup handler (e.g. lang selector), call it
                try { if (el.cleanupLang) el.cleanupLang(); } catch (e) { }
                el.classList.add('fade-out');
            });

            // remove after transition
            setTimeout(() => {
                els.forEach(el => {
                    try { el.remove(); } catch (e) { /* ignore */ }
                });
                cb();
            }, 360);
        }

        // Usa una dinamite: distrugge i blocchi vicini
        function useDynamite() {
            if (playerDynamite <= 0) {
                addFloatingText(player.x + player.width / 2, player.y, 'NO DYNAMITE', '#ff4444');
                return;
            }
            playerDynamite--;
            updateHUD();
            const cx = player.x + player.width / 2;
            const cy = player.y + player.height / 2;
            const radius = 90;
            let destroyed = 0;
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                const bx = b.x + b.width / 2;
                const by = b.y + b.height / 2;
                const dist = Math.hypot(bx - cx, by - cy);
                if (dist <= radius) {
                    createParticles(b.x + b.width / 2, b.y + b.height / 2, '#ff6622');
                    blocks.splice(i, 1);
                    destroyed++;
                }
            }
            if (destroyed > 0) {
                addFloatingText(cx, cy - 10, `BOOM x${destroyed}`, '#ffcc00');
                // add visual explosion effect
                explosions.push({ x: cx, y: cy, life: 30, maxLife: 30, maxRadius: radius });
                // screen shake on strong explosions (intensity scales with destroyed count)
                if (destroyed >= STRONG_EXPLOSION_THRESHOLD) {
                    screenShake.intensity = Math.min(28, destroyed * 4);
                    screenShake.time = 18 + destroyed * 3;
                    screenShake.maxTime = screenShake.time;
                }
                // small explosion sound
                if (soundEnabled) playExplosionSound();
            } else {
                addFloatingText(cx, cy - 10, 'BOOM', '#ffcc00');
            }
        }

        function playExplosionSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!_audioCtx) _audioCtx = new AudioCtx();
                const ctx = _audioCtx;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.18, now + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.36);
            } catch (e) { }
        }

        // Breve suono di transizione generato con WebAudio (nessun file esterno)
        let _audioCtx = null;
        function playTransitionSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!_audioCtx) _audioCtx = new AudioCtx();
                const ctx = _audioCtx;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                // gentle metallic/chime effect: start high, sweep down
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, now);
                osc.frequency.exponentialRampToValueAtTime(420, now + 0.28);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.46);
            } catch (e) {
                // WebAudio may be blocked; ignore silently
            }
        }

        // Suono breve per indicare che servono coins (feedback negativo)
        function playCoinRequiredSound(required) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!_audioCtx) _audioCtx = new AudioCtx();
                const ctx = _audioCtx;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                // frequency depends on required coins (higher for 1, lower for 2) so user can tell
                const base = required === 1 ? 600 : 360;
                osc.frequency.setValueAtTime(base, now);
                osc.frequency.exponentialRampToValueAtTime(base * 0.6, now + 0.18);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.14, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.42);
            } catch (e) { /* ignore */ }
        }

        // Suono breve positivo per inserimento moneta
        function playCoinInsertSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!_audioCtx) _audioCtx = new AudioCtx();
                const ctx = _audioCtx;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(1800, now + 0.06);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.18, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            } catch (e) { /* ignore */ }
        }

        // Animazione visiva breve per evidenziare l'elemento dei crediti
        function animateCreditHint(required) {
            // Preferisci elementi dinamici se presenti
            const els = [];
            const ac = document.getElementById('attractCredits'); if (ac) els.push(ac);
            const asc = document.getElementById('attractStaticCredits'); if (asc) els.push(asc);
            const insetBtn = document.getElementById('insertCoinBtn'); if (insetBtn) els.push(insetBtn);
            // create a temporary popup in the center as well
            addFloatingText(canvas.width / 2, canvas.height / 2 + 80, `INSERISCI ${required} COIN${required > 1 ? 'S' : ''}`, '#ffcc00');

            els.forEach(el => {
                try {
                    el.style.transition = 'transform 140ms ease, box-shadow 140ms ease';
                    el.style.transform = 'scale(1.18)';
                    el.style.boxShadow = '0 0 18px rgba(255,204,0,0.95)';
                } catch (e) { }
            });
            setTimeout(() => {
                els.forEach(el => {
                    try {
                        el.style.transform = '';
                        el.style.boxShadow = '';
                    } catch (e) { }
                });
            }, 420);
        }

        // Loop principale del gioco
        function gameLoop() {
            if (gameState !== 'playing') return;
            frameCount++;

            // valore base della larghezza blocco usata per normalizzare gli effetti di impatto
            const DEFAULT_BLOCK_W = scale(34);

            // If we're in a stage transition, draw an overlay message and count down
            if (inTransition) {
                // Draw background (cleared above)
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.font = '40px Arial';
                ctx.fillText(transitionText, canvas.width / 2, canvas.height / 2);
                transitionTimer--;
                if (transitionTimer <= 0) {
                    finishAdvanceAfterTransition();
                }
                requestAnimationFrame(gameLoop);
                return;
            }

            // Clear canvas
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Apply screen shake by translating the canvas element (keeps ctx state intact)
            if (screenShake.time > 0) {
                const prog = screenShake.time / Math.max(1, screenShake.maxTime);
                const mag = screenShake.intensity * prog;
                const sx = (Math.random() * 2 - 1) * mag;
                const sy = (Math.random() * 2 - 1) * mag;
                try { canvas.style.transform = `translate(${sx}px, ${sy}px)`; } catch (e) { }
                screenShake.time--;
            } else {
                // clear any leftover transform
                if (canvas.style.transform) canvas.style.transform = '';
            }

            // Grid background
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw visible inner wall (the main walled area). The outer band around it is an open escape path.
            const _ib_draw = getInnerBounds();
            try {
                // Decide tileSize: when sprite sheet is ready, use the actual sprite cell
                // dimension for pixel-perfect alignment (scaled by SIZE_SCALE). Otherwise
                // fall back to the previous scale(32) value.
                let tileSize;
                if (spriteReady && spriteCellW && spriteCellH) {
                    // Use the smaller of cell W/H to avoid non-square distortion, then scale
                    // by SIZE_SCALE so the art respects the global size multiplier.
                    tileSize = Math.max(8, Math.round(Math.min(spriteCellW, spriteCellH) * (SIZE_SCALE || 1)));
                } else {
                    tileSize = Math.max(16, Math.round(scale(32)));
                }

                // If sprite sheet is loaded, draw repeated 'wall' tiles along the inner rectangle
                if (!window.DISABLE_WALL && spriteReady && drawFromSheet) {
                    const w = Math.max(0, _ib_draw.maxX - _ib_draw.minX);
                    const h = Math.max(0, _ib_draw.maxY - _ib_draw.minY);
                    const cols = Math.max(1, Math.ceil(w / tileSize));
                    const rows = Math.max(1, Math.ceil(h / tileSize));
                    // Top and bottom rows (use tail wall tiles if available, otherwise previous sprite 'wall')
                    for (let i = 0; i < cols; i++) {
                        const cx = _ib_draw.minX + i * tileSize + tileSize / 2;
                        const topY = _ib_draw.minY + tileSize / 2;
                        const bottomY = _ib_draw.maxY - tileSize / 2;
                        if (tailReady && drawFromTail) {
                            // pick a wall variant in a tiled pattern for variety
                            const idx = i % 4;
                            const wkeys = ['wall1', 'wall2', 'wall3', 'wall4'];
                            drawTailTile(ctx, wkeys[idx], cx, topY, tileSize, tileSize, 0) || drawFromSheet(ctx, 'wall', cx, topY, tileSize, 0);
                            drawTailTile(ctx, wkeys[idx], cx, bottomY, tileSize, tileSize, 0) || drawFromSheet(ctx, 'wall', cx, bottomY, tileSize, 0);
                        } else {
                            drawFromSheet(ctx, 'wall', cx, topY, tileSize, 0);
                            drawFromSheet(ctx, 'wall', cx, bottomY, tileSize, 0);
                        }
                    }
                    // Left and right columns
                    for (let j = 0; j < rows; j++) {
                        const cy = _ib_draw.minY + j * tileSize + tileSize / 2;
                        const leftX = _ib_draw.minX + tileSize / 2;
                        const rightX = _ib_draw.maxX - tileSize / 2;
                        if (tailReady && drawFromTail) {
                            const idx = j % 4;
                            const wkeys = ['wall1', 'wall2', 'wall3', 'wall4'];
                            drawTailTile(ctx, wkeys[idx], leftX, cy, tileSize, tileSize, 0) || drawFromSheet(ctx, 'wall', leftX, cy, tileSize, 0);
                            drawTailTile(ctx, wkeys[idx], rightX, cy, tileSize, tileSize, 0) || drawFromSheet(ctx, 'wall', rightX, cy, tileSize, 0);
                        } else {
                            drawFromSheet(ctx, 'wall', leftX, cy, tileSize, 0);
                            drawFromSheet(ctx, 'wall', rightX, cy, tileSize, 0);
                        }
                    }
                } else {
                    // subtle wall border fallback
                    if (!window.DISABLE_WALL) {
                        ctx.strokeStyle = '#444444';
                        ctx.lineWidth = Math.max(3, Math.round(scale(6)));
                        ctx.strokeRect(_ib_draw.minX + 1, _ib_draw.minY + 1, Math.max(0, _ib_draw.maxX - _ib_draw.minX - 2), Math.max(0, _ib_draw.maxY - _ib_draw.minY - 2));
                    }
                }
            } catch (e) { }

            // Update player movement
            playerIsMoving = false;
            // Movement with 8 directions and angle rotation
            let inputX = 0;
            let inputY = 0;
            if (keys['ArrowLeft']) inputX -= 1;
            if (keys['ArrowRight']) inputX += 1;
            if (keys['ArrowUp']) inputY -= 1;
            if (keys['ArrowDown']) inputY += 1;

            if (inputX !== 0 || inputY !== 0) {
                // normalize diagonal speed
                const invMag = 1 / Math.hypot(inputX, inputY);
                const vx = inputX * invMag * player.speed;
                const vy = inputY * invMag * player.speed;

                // remember previous position to allow revert if movement collides with impassable tile
                const prevX = player.x, prevY = player.y;
                player.x += vx;
                player.y += vy;
                playerIsMoving = true;

                // Clamp inside the inner walled area when inside (can't walk into outer band unless outside via doors)
                if (!isOutside) {
                    const ib = getInnerBounds();
                    player.x = Math.max(ib.minX, Math.min(ib.maxX - player.width, player.x));
                    player.y = Math.max(ib.minY, Math.min(ib.maxY - player.height, player.y));
                }

                // Prevent walking into impassable floor tiles defined by FLOOR_MAP
                try {
                    if (!window.DISABLE_FLOOR && window.FLOOR_MAP) {
                        const fm = window.FLOOR_MAP;
                        const centerXNew = player.x + player.width / 2;
                        const centerYNew = player.y + player.height / 2;
                        const gx = Math.floor((centerXNew - fm.originX) / fm.tileSize);
                        const gy = Math.floor((centerYNew - fm.originY) / fm.tileSize);
                        if (gx >= 0 && gx < fm.cols && gy >= 0 && gy < fm.rows) {
                            const tk = fm.map[gy][gx];
                            if (tk && IMPASSABLE_TILES.has(tk)) {
                                // revert movement
                                player.x = prevX; player.y = prevY; playerIsMoving = false;
                            }
                        }
                    }
                } catch (e) { }

                // Determine direction string and angle
                if (inputY < 0 && inputX === 0) player.direction = 'up';
                else if (inputY > 0 && inputX === 0) player.direction = 'down';
                else if (inputX < 0 && inputY === 0) player.direction = 'left';
                else if (inputX > 0 && inputY === 0) player.direction = 'right';
                else if (inputY < 0 && inputX < 0) player.direction = 'up-left';
                else if (inputY < 0 && inputX > 0) player.direction = 'up-right';
                else if (inputY > 0 && inputX < 0) player.direction = 'down-left';
                else if (inputY > 0 && inputX > 0) player.direction = 'down-right';

                // Angle: 0 radians = right, rotate clockwise
                player.angle = Math.atan2(vy, vx);
            }

            // If outside, keep player constrained to the outer band (snap to nearest edge band)
            if (isOutside) {
                const band = OUTER_BAND;
                // keep within canvas but prefer the band distance from edges
                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
                player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

                // Snap to nearest edge band if close to it
                const distLeft = player.x;
                const distRight = canvas.width - (player.x + player.width);
                const distTop = player.y;
                const distBottom = canvas.height - (player.y + player.height);
                const minDist = Math.min(distLeft, distRight, distTop, distBottom);
                if (minDist === distLeft) {
                    player.x = Math.min(band - player.width / 2, player.x);
                } else if (minDist === distRight) {
                    player.x = Math.max(canvas.width - band, player.x);
                } else if (minDist === distTop) {
                    player.y = Math.min(band - player.height / 2, player.y);
                } else {
                    player.y = Math.max(canvas.height - band, player.y);
                }
            }

            // Draw player with rotation based on movement angle
            ctx.font = '32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = player.color;
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            const centerX = player.x + player.width / 2;
            const centerY = player.y + player.height / 2;
            // Check fall into hole (tile 'hole' from FLOOR_MAP)
            try {
                if (!window.DISABLE_FLOOR && window.FLOOR_MAP && !playerInvulnerable) {
                    const fm = window.FLOOR_MAP;
                    const gx = Math.floor((centerX - fm.originX) / fm.tileSize);
                    const gy = Math.floor((centerY - fm.originY) / fm.tileSize);
                    if (gx >= 0 && gx < fm.cols && gy >= 0 && gy < fm.rows) {
                        const tk = fm.map[gy][gx];
                        if (tk === 'hole') {
                            // player falls into hole
                            lives--;
                            createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                            playerInvulnerable = true;
                            invulTimer = Math.max(90, Math.floor(DOBLON_DURATION_FRAMES / 2));
                            // respawn player to a safe location (center-bottom of inner bounds)
                            const ib = getInnerBounds();
                            player.x = Math.max(ib.minX + 8, Math.min(ib.maxX - player.width - 8, (ib.minX + ib.maxX) / 2 - player.width / 2));
                            player.y = ib.maxY - player.height - 8;
                            updateHUD();
                            if (lives <= 0) { endGame(); return; }
                        }
                    }
                }
            } catch (e) { }
            ctx.save();
            ctx.translate(centerX, centerY);
            // If angle is NaN (no movement yet), default to 0
            const angle = isFinite(player.angle) ? player.angle : 0;
            ctx.rotate(angle);
            // draw pixel-player centered at 0,0 (after translate/rotate)
            drawPlayerSpriteAt(ctx, 0, 0, Math.max(player.width, player.height), player.color);
            ctx.restore();

            // Draw floor tiles (if FLOOR_MAP is present) — must happen after walls so floor is under objects
            try {
                if (!window.DISABLE_FLOOR && window.FLOOR_MAP) {
                    const fm = window.FLOOR_MAP;
                    for (let ry = 0; ry < fm.rows; ry++) {
                        for (let cxIdx = 0; cxIdx < fm.cols; cxIdx++) {
                            const tk = fm.map[ry][cxIdx] || 'sand1';
                            const drawX = fm.originX + cxIdx * fm.tileSize + fm.tileSize / 2;
                            const drawY = fm.originY + ry * fm.tileSize + fm.tileSize / 2;
                            // prefer tail tiles for floor
                            if (tailReady && drawTailTile) {
                                // Use drawTailTile to stretch the tail-sheet source to the grid cell
                                // This avoids tight-source aspect-preserved drawing that can overlap adjacent tiles
                                drawTailTile(ctx, tk, drawX, drawY, fm.tileSize, fm.tileSize, 0) || drawFromSheet(ctx, 'block', drawX, drawY, fm.tileSize, 0);
                            } else if (tailReady && drawFromTail) {
                                // fallback to aspect-preserving draw if the strict tile-stretch helper isn't available
                                drawFromTail(ctx, tk, drawX, drawY, fm.tileSize, 0) || drawFromSheet(ctx, 'block', drawX, drawY, fm.tileSize, 0);
                            } else if (spriteReady && drawFromSheet) {
                                // fallback: use a generic tile if available
                                drawFromSheet(ctx, 'block', drawX, drawY, fm.tileSize, 0);
                            } else {
                                // programmatic fallback: sandy rectangle
                                ctx.fillStyle = '#bfa57a'; ctx.fillRect(drawX - fm.tileSize / 2, drawY - fm.tileSize / 2, fm.tileSize, fm.tileSize);
                            }
                        }
                    }
                }
            } catch (e) { }

            // Debug overlay: show computed tail bboxes and impassable tiles when enabled
            try {
                if (window._debugShowTailBBoxes && tailReady) {
                    // draw bboxes from TAIL_SHEET_BBOX (in source image space) onto a small preview
                    const previewX = 8, previewY = canvas.height - 8 - Math.min(160, tailSheet.height);
                    const previewW = Math.min(160, tailSheet.width);
                    const previewH = Math.min(160, tailSheet.height);
                    // draw a tiny background for visibility
                    ctx.save();
                    ctx.globalAlpha = 0.9;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(previewX - 2, previewY - 2, previewW + 4, previewH + 4);
                    // draw the full tail sheet preview (scaled)
                    try { ctx.drawImage(tailSheet, 0, 0, tailSheet.width, tailSheet.height, previewX, previewY, previewW, previewH); } catch (e) { }
                    // overlay bbox rectangles (scaled)
                    Object.keys(TAIL_SHEET_BBOX).forEach(k => {
                        const b = TAIL_SHEET_BBOX[k];
                        if (!b) return;
                        const sx = previewX + (b.sx / tailSheet.width) * previewW;
                        const sy = previewY + (b.sy / tailSheet.height) * previewH;
                        const sw = (b.sw / tailSheet.width) * previewW;
                        const sh = (b.sh / tailSheet.height) * previewH;
                        ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1; ctx.strokeRect(sx, sy, sw, sh);
                        ctx.fillStyle = 'rgba(0,255,255,0.08)'; ctx.fillRect(sx, sy, sw, sh);
                        ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.fillText(k, sx + 2, sy + 10);
                    });
                    ctx.restore();

                    // highlight impassable tiles on the floor map (only if floor enabled)
                    if (!window.DISABLE_FLOOR && window.FLOOR_MAP) {
                        const fm = window.FLOOR_MAP;
                        ctx.save();
                        ctx.strokeStyle = 'rgba(255,0,0,0.9)'; ctx.lineWidth = 2;
                        for (let ry = 0; ry < fm.rows; ry++) {
                            for (let cxIdx = 0; cxIdx < fm.cols; cxIdx++) {
                                const tk = fm.map[ry][cxIdx];
                                if (tk && IMPASSABLE_TILES.has(tk)) {
                                    const rx = fm.originX + cxIdx * fm.tileSize;
                                    const ry_px = fm.originY + ry * fm.tileSize;
                                    ctx.strokeRect(rx + 1, ry_px + 1, fm.tileSize - 2, fm.tileSize - 2);
                                }
                            }
                        }
                        ctx.restore();
                    }
                    // optionally draw a border around the floor map (visual aid)
                    try {
                        if (window._showFloorBorder && window.FLOOR_MAP) {
                            const fm = window.FLOOR_MAP;
                            ctx.save();
                            ctx.setLineDash([6, 4]);
                            ctx.strokeStyle = 'rgba(0,200,255,0.95)';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(fm.originX + 0.5, fm.originY + 0.5, fm.cols * fm.tileSize - 1, fm.rows * fm.tileSize - 1);
                            ctx.setLineDash([]);
                            ctx.fillStyle = 'rgba(0,200,255,0.9)';
                            ctx.font = '14px monospace';
                            const label = `${fm.cols}x${fm.rows}`;
                            ctx.fillText(label, fm.originX + 6, Math.max(fm.originY + 16, fm.originY + fm.rows * fm.tileSize - 6));
                            ctx.restore();
                        }
                    } catch (e) { }
                }
            } catch (e) { }

            // Aggiorna e disegna il target (gemma)
            target.currentLife++;
            if (target.currentLife >= target.lifetime) {
                spawnTarget();
            }

            // Pulsating target
            // draw pixel target
            drawTargetSpriteAt(ctx, target.x + target.width / 2, target.y + target.height / 2, Math.max(target.width, target.height));

            // Check target (gem) collection
            if (!inTransition && checkCollision(player, target)) {
                const points = 100 * getCombinedLevel() * scoreMultiplier;
                score += points;
                gemsCollected++;
                createParticles(target.x + target.width / 2, target.y + target.height / 2, '#ffff00');
                addFloatingText(target.x + target.width / 2, target.y + target.height / 2, `+${points}`, '#ffff00');
                spawnTarget();
                updateHUD();

                // If collected enough gems, trigger transition to next sublevel
                if (gemsCollected >= GEMS_PER_STAGE) {
                    inTransition = true;
                    transitionTimer = TRANSITION_FRAMES;
                    transitionText = `LEVEL ${gameLevel}.${subLevel} COMPLETE`;
                }
            }

            // During transition we don't spawn new blocks
            if (!inTransition) {
                const spawnRate = stageConfig.spawnRate || Math.max(Math.round(48 - getCombinedLevel() * 1.2), 14);
                if (frameCount % spawnRate === 0) {
                    spawnBlock();
                }
            }

            // Aggiorna e disegna i blocchi (massii)
            for (let i = blocks.length - 1; i >= 0; i--) {
                const block = blocks[i];

                // Spawn animation for mushroom blocks
                if (block.spawnAnimation < block.maxSpawnAnimation) {
                    block.spawnAnimation++;
                }

                // Aggiorna angolo/rotazione del blocco ogni frame
                if (typeof block.angle === 'number') {
                    // Se il blocco sta cadendo, aumenta leggermente la velocità angolare in base alla velocità di caduta
                    if (!block.landed) {
                        const fallSpeed = Math.abs(block.vy || 0);
                        if (fallSpeed > 0.2) {
                            // scala molto piccola: solo per dare più rotazione quando cade veloce
                            const add = fallSpeed * (0.006 + Math.random() * 0.004);
                            // preserva il verso corrente, se zero scegli un verso casuale
                            if (!block.angularVel) block.angularVel = (Math.random() < 0.5 ? -1 : 1) * add;
                            else block.angularVel += (block.angularVel >= 0 ? 1 : -1) * add;
                        }
                    }

                    block.angle += block.angularVel || 0;

                    // attrito dell'aria / freno: riduce lentamente la velocità angolare
                    if (block.angularVel) {
                        if (block.landed) block.angularVel *= 0.75; else block.angularVel *= 0.995;
                        if (Math.abs(block.angularVel) < 0.0005) block.angularVel = 0;
                    }
                }

                // Aggiorna animazione bounce quando presente
                if (block.bounce && Math.abs(block.bounce) > 0.01) {
                    // semplice smorzamento del bounce
                    block.bounce *= 0.72;
                    if (Math.abs(block.bounce) < 0.5) block.bounce = 0;
                }

                if (!block.landed) {
                    block.x += block.vx;
                    block.y += block.vy;

                    // Check if falling/moving block hits another block
                    for (let j = 0; j < blocks.length; j++) {
                        if (i !== j && blocks[j].landed) {
                            // Check collision with landed blocks
                            const nextX = block.x + block.vx;
                            const nextY = block.y + block.vy;

                            // Predict collision
                            const willCollide =
                                nextX < blocks[j].x + blocks[j].width &&
                                nextX + block.width > blocks[j].x &&
                                nextY < blocks[j].y + blocks[j].height &&
                                nextY + block.height > blocks[j].y;

                            if (willCollide) {
                                const impactSpeed = Math.hypot(block.vx || 0, block.vy || 0);
                                // Position block based on collision direction
                                if (block.vy > 0) {
                                    // Falling from top - land on top of other block
                                    block.y = blocks[j].y - block.height;
                                } else if (block.vy < 0) {
                                    // Coming from bottom
                                    block.y = blocks[j].y + blocks[j].height;
                                } else if (block.vx > 0) {
                                    // Coming from left
                                    block.x = blocks[j].x - block.width;
                                } else if (block.vx < 0) {
                                    // Coming from right
                                    block.x = blocks[j].x + blocks[j].width;
                                }

                                // set landed state and zero velocities
                                const wasFalling = !block.landed;
                                block.landed = true;
                                block.falling = false;
                                block.vx = 0;
                                block.vy = 0;

                                // Landing effects only when we were falling
                                if (wasFalling) {
                                    // Amplifica velocità angolare in base all'impatto
                                    if (!block.angularVel) block.angularVel = (Math.random() < 0.5 ? -1 : 1) * (0.02 + impactSpeed * 0.01);
                                    else block.angularVel += (block.angularVel >= 0 ? 1 : -1) * (0.02 + impactSpeed * 0.01);

                                    // piccola vibrazione e particelle di polvere
                                    const sizeFactor = Math.max(1, Math.round(block.width / DEFAULT_BLOCK_W));
                                    const intensity = Math.min(18, 4 + Math.floor(impactSpeed * 1.8));
                                    screenShake.intensity = Math.min(28, (screenShake.intensity || 0) + intensity * sizeFactor);
                                    screenShake.time = Math.max(screenShake.time || 0, 8);
                                    screenShake.maxTime = screenShake.time;

                                    // bounce visivo (scalato per dimensione)
                                    block.bounce = Math.min(12 * sizeFactor, 6 + impactSpeed * 1.5 * sizeFactor);

                                    // particelle di polvere (scalate con la dimensione del blocco)
                                    const baseDust = 6 + Math.min(8, Math.floor(impactSpeed * 1.5));
                                    const dustCount = Math.floor(baseDust * sizeFactor);
                                    for (let d = 0; d < dustCount; d++) {
                                        particles.push({
                                            x: block.x + block.width / 2 + (Math.random() - 0.5) * block.width * 0.6,
                                            y: block.y + block.height,
                                            vx: (Math.random() - 0.5) * (2.2 * sizeFactor),
                                            vy: -Math.random() * 2.8 - 0.4,
                                            life: 26 + Math.floor(Math.random() * 12) * sizeFactor,
                                            color: '#c2b280'
                                        });
                                    }

                                    // se il blocco è configurato per snap a 90°, allinealo ora
                                    if (block.snapTo90) {
                                        block.angle = Math.round(block.angle / (Math.PI / 2)) * (Math.PI / 2);
                                        block.angularVel = 0;
                                    }
                                }

                                break;
                            }
                        }
                    }

                    // Check if hit ground
                    const ib = getInnerBounds();
                    if (block.y + block.height >= ib.maxY) {
                        // Se il blocco sta atterrando ora, attiva piccoli effetti di impatto (polvere, tremolio)
                        if (!block.landed) {
                            block.landed = true;
                            block.falling = false;
                            block.vy = 0;
                            block.y = ib.maxY - block.height;

                            // Riduci rapidamente la velocà angolare per simulare attrito a terra
                            if (block.angularVel) block.angularVel *= 0.25;

                            // piccolo tremolio dello schermo e particelle di polvere
                            const sizeFactor = Math.max(1, Math.round(block.width / DEFAULT_BLOCK_W));
                            screenShake.intensity = Math.min(12, (screenShake.intensity || 0) + 3 * sizeFactor);
                            screenShake.time = Math.max(screenShake.time || 0, 8);
                            screenShake.maxTime = screenShake.time;

                            // Genera particelle 'polvere' verso l'alto scalate per dimensione
                            const dustCount = Math.floor(4 * sizeFactor);
                            for (let d = 0; d < dustCount; d++) {
                                particles.push({
                                    x: block.x + block.width / 2 + (Math.random() - 0.5) * block.width * 0.6,
                                    y: block.y + block.height,
                                    vx: (Math.random() - 0.5) * (1.6 * sizeFactor),
                                    vy: -Math.random() * (2.8) - 0.6,
                                    life: 20 + Math.floor(Math.random() * 12),
                                    color: '#c2b280'
                                });
                            }

                            // piccolo salto/bounce visivo proporzionale alla dimensione
                            block.bounce = Math.min(12 * sizeFactor, 6 * sizeFactor);
                        } else {
                            // assicurati che rimanga posizionato correttamente
                            block.landed = true;
                            block.falling = false;
                            block.vy = 0;
                            block.y = ib.maxY - block.height;
                        }
                    }

                    // Check if hit ceiling
                    if (block.y <= ib.minY) {
                        block.landed = true;
                        block.vy = 0;
                        block.y = ib.minY;
                    }

                    // Check if hit walls
                    if (block.x <= ib.minX) {
                        block.landed = true;
                        block.vx = 0;
                        block.x = ib.minX;
                    }
                    if (block.x + block.width >= ib.maxX) {
                        block.landed = true;
                        block.vx = 0;
                        block.x = ib.maxX - block.width;
                    }
                }

                // Draw block with spawn animation
                const scale = block.spawnAnimation / block.maxSpawnAnimation;
                let drawWidth = block.width * scale;
                let drawHeight = block.height * scale;
                let drawX = block.x + (block.width - drawWidth) / 2;
                let drawY = block.y + (block.height - drawHeight) / 2;

                // Effetto impulso solo se pulse=true
                if (block.pulse) {
                    // Oscilla tra 80% e 140% della dimensione base
                    const pulseScale = 1 + 0.3 * Math.sin(frameCount * 0.15 + block.pulsePhase);
                    drawWidth = block.width * scale * pulseScale;
                    drawHeight = block.height * scale * pulseScale;
                    drawX = block.x + (block.width - drawWidth) / 2;
                    drawY = block.y + (block.height - drawHeight) / 2;
                }
                // draw pixel block (applichiamo bounce grafico sottraendo l'offset dal centro Y)
                const blockCenterX = drawX + drawWidth / 2;
                const blockCenterY = drawY + drawHeight / 2 - (block.bounce || 0);
                // Passiamo l'angolo del blocco al renderer in modo che venga disegnato ruotato
                drawBlockSpriteAt(ctx, blockCenterX, blockCenterY, Math.max(drawWidth, drawHeight), block.pulse, block.angle || 0);

                // Check collision with player (only if fully spawned)
                if (block.spawnAnimation >= block.maxSpawnAnimation && checkCollision(player, block)) {
                    if (!playerInvulnerable) {
                        lives--;
                        createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                        blocks.splice(i, 1);

                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                        updateHUD();
                    } else {
                        // while invulnerable, obstacles have no effect
                        addFloatingText(blockCenterX, blockCenterY, 'INVUL', '#ffd700');
                    }
                    continue;
                }

                // Remove off-screen blocks (only moving blocks)
                if (!block.landed && (block.x < -block.width * 2 || block.x > canvas.width + block.width ||
                    block.y < -block.height * 2 || block.y > canvas.height + block.height)) {
                    blocks.splice(i, 1);
                }
            }

            // Aggiorna e disegna i proiettili
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;

                ctx.fillStyle = '#00ff00';
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);

                // Check collision with blocks
                for (let j = blocks.length - 1; j >= 0; j--) {
                    if (checkCollision(bullet, blocks[j])) {
                        score += 10 * scoreMultiplier;
                        const bx = blocks[j].x + blocks[j].width / 2;
                        const by = blocks[j].y + blocks[j].height / 2;
                        createParticles(bx, by, '#ff00ff');
                        addFloatingText(bx, by, `+${10 * scoreMultiplier}`, '#ff88ff');
                        blocks.splice(j, 1);
                        bullets.splice(i, 1);
                        updateHUD();
                        break;
                    }
                }

                // Check collision with player (auto-hit)
                if (checkCollision(bullet, player)) {
                    // always remove projectile, but only apply effects when not invulnerable
                    bullets.splice(i, 1);
                    if (!playerInvulnerable) {
                        player.speed = Math.max(PLAYER_MIN_SPEED, player.speed - 1);
                        createParticles(player.x + player.width / 2, player.y + player.height / 2, '#00ff00');
                        if (player.speed <= PLAYER_MIN_SPEED) {
                            lives--;
                            player.speed = PLAYER_INITIAL_SPEED;
                            updateHUD();
                            if (lives <= 0) {
                                endGame();
                                return;
                            }
                        }
                    } else {
                        // invulnerable: indicate harmless hit
                        addFloatingText(player.x + player.width / 2, player.y, 'INVUL HIT', '#ffd700');
                    }
                    continue;
                }

                // Rimbalzo sui bordi
                let bounced = false;
                if (bullet.x <= 0 || bullet.x + bullet.width >= canvas.width) {
                    bullet.dx = -bullet.dx;
                    bounced = true;
                }
                if (bullet.y <= 0 || bullet.y + bullet.height >= canvas.height) {
                    bullet.dy = -bullet.dy;
                    bounced = true;
                }
                // Se ha rimbalzato, cambia direzione randomica (ma non opposta a quella da cui arriva)
                if (bounced) {
                    const dirs = [];
                    if (Math.abs(bullet.dx) > 0) {
                        dirs.push({ dx: 0, dy: -8 }); // up
                        dirs.push({ dx: 0, dy: 8 });  // down
                    } else {
                        dirs.push({ dx: -8, dy: 0 }); // left
                        dirs.push({ dx: 8, dy: 0 });  // right
                    }
                    if (Math.random() < 0.5) {
                        const newDir = dirs[Math.floor(Math.random() * dirs.length)];
                        bullet.dx = newDir.dx;
                        bullet.dy = newDir.dy;
                    }
                }

                // Rimuovi proiettili "impazziti" che escono troppo
                if (
                    bullet.x < -50 || bullet.x > canvas.width + 50 ||
                    bullet.y < -50 || bullet.y > canvas.height + 50
                ) {
                    bullets.splice(i, 1);
                }
            }

            // Aggiorna e disegna le particelle (effetti)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Disegna esplosioni (anelli in espansione)
            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.life--;
                const t = ex.life / ex.maxLife;
                const r = ex.maxRadius * (1 - t);
                const alpha = Math.max(0, t);
                // radial ring
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255,160,32,${alpha * 0.8})`;
                ctx.lineWidth = Math.max(2, r * 0.08);
                ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
                ctx.stroke();
                if (ex.life <= 0) explosions.splice(i, 1);
            }

            // Floating texts (score, key, door messages)
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.x += 0;
                ft.y += ft.vy;
                ft.life--;
                ctx.globalAlpha = Math.max(0, ft.life / 60);
                ctx.fillStyle = ft.color;
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // Verifica vita extra ogni 1000 punti
            if (score > 0 && score % 1000 === 0) {
                lives++;
                updateHUD();
            }

            // Pulsi/pulse blocks may shoot shards when stage enables it (level 5)
            if (stageConfig.shards) {
                for (let block of blocks) {
                    if (block.pulse && block.landed && Math.random() < (stageConfig.shardFireChance || 0.01)) {
                        const speed = 6 + (stageConfig.shardSpeed || 1) * 2; // base speed scaled
                        const dirs = [
                            { dx: speed, dy: 0 },
                            { dx: -speed, dy: 0 },
                            { dx: 0, dy: speed },
                            { dx: 0, dy: -speed }
                        ];
                        const dir = dirs[Math.floor(Math.random() * dirs.length)];
                        bulletsBlock.push({
                            x: block.x + block.width / 2 - scale(4),
                            y: block.y + block.height / 2 - scale(4),
                            width: scale(8),
                            height: scale(8),
                            dx: dir.dx,
                            dy: dir.dy
                        });
                    }
                }
            }

            // Gestione proiettili dei blocchi pulsanti
            for (let i = bulletsBlock.length - 1; i >= 0; i--) {
                const bullet = bulletsBlock[i];
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                // Rimbalzo sui bordi
                if (bullet.x <= 0 || bullet.x + bullet.width >= canvas.width) {
                    bullet.dx = -bullet.dx;
                }
                if (bullet.y <= 0 || bullet.y + bullet.height >= canvas.height) {
                    bullet.dy = -bullet.dy;
                }
                // Se colpisce un blocco, si ferma
                let hitBlock = false;
                for (let j = 0; j < blocks.length; j++) {
                    if (checkCollision(bullet, blocks[j])) {
                        hitBlock = true;
                        break;
                    }
                }
                if (hitBlock) {
                    bulletsBlock.splice(i, 1);
                    continue;
                }
                // Rimuovi proiettili fuori area
                if (
                    bullet.x < -50 || bullet.x > canvas.width + 50 ||
                    bullet.y < -50 || bullet.y > canvas.height + 50
                ) {
                    bulletsBlock.splice(i, 1);
                }
            }

            // Gestione porte
            if (frameCount % 600 === 0) { // ogni tot tempo
                doors.forEach(d => d.open = false);
            }

            // Disegna porte (con glow per porte aperte)
            ctx.font = '32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            doors.forEach(door => {
                const cx = door.x;
                const cy = door.y;
                // If open, draw a pulsing glow behind the door
                if (door.open) {
                    // decrement door timer if present
                    if (typeof door.timer === 'number') {
                        door.timer--;
                        if (door.timer <= 0) {
                            // close the door and if player is near penalize
                            door.open = false;
                            // If player overlapping door when it closes, lose a life
                            if (checkCollision(player, { x: door.x - scale(16), y: door.y - scale(16), width: scale(32), height: scale(32) })) {
                                if (!playerInvulnerable) {
                                    lives--;
                                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff0000');
                                    addFloatingText(door.x, door.y, '-1 LIFE', '#ff4444');
                                    updateHUD();
                                } else {
                                    addFloatingText(door.x, door.y, 'INVUL', '#ffd700');
                                }
                            }
                        }
                    }
                    const pulse = 12 + Math.sin(frameCount * 0.15) * 6; // blur radius
                    ctx.save();
                    // soft glowing circle
                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(0,255,0,0.12)';
                    ctx.arc(cx, cy, 22 + Math.abs(Math.sin(frameCount * 0.12)) * 6, 0, Math.PI * 2);
                    ctx.fill();
                    // shadowed glow for stronger effect
                    ctx.shadowColor = 'rgba(0,255,0,0.9)';
                    ctx.shadowBlur = pulse;
                    ctx.fillStyle = 'rgba(0,255,0,0.02)';
                    ctx.fillRect(cx - 1, cy - 1, 2, 2);
                    ctx.restore();
                }

                // draw door sprite
                // compute a door tile size: prefer pixel-perfect sprite cell scaled by SIZE_SCALE,
                // fallback to the previous scale(40)
                let doorSize = Math.max(20, Math.round(scale(40)));
                if (spriteReady && spriteCellW && spriteCellH) {
                    doorSize = Math.max(16, Math.round(Math.min(spriteCellW, spriteCellH) * (SIZE_SCALE || 1)));
                }
                drawDoorSpriteAt(ctx, cx, cy, doorSize, door.open);
            });
            // Disegna chiavi
            levelKeys.forEach(key => {
                if (!key.collected) {
                    drawKeySpriteAt(ctx, key.x, key.y, scale(28));
                }
            });
            // Raccogli chiave
            levelKeys.forEach(key => {
                if (!key.collected && checkCollision(player, { x: key.x - scale(14), y: key.y - scale(14), width: scale(28), height: scale(28) })) {
                    key.collected = true;
                    playerKeys++;
                    addFloatingText(key.x, key.y, 'KEY!', '#ffff00');
                    updateHUD();
                }
            });
            // Spawn chiave se necessario
            spawnKey();
            // Spawn dynamite box occasionally
            spawnDynamiteBox();

            // Disegna scatolotti di dinamite
            for (let i = dynamiteBoxes.length - 1; i >= 0; i--) {
                const box = dynamiteBoxes[i];
                if (box.collected) continue;
                // life countdown
                box.life--;
                if (box.life <= 0) {
                    dynamiteBoxes.splice(i, 1);
                    continue;
                }
                // draw dynamite box sprite
                drawDynamiteSpriteAt(ctx, box.x, box.y, Math.max(box.width, box.height));
                // collision with player
                if (checkCollision(player, { x: box.x - box.width / 2, y: box.y - box.height / 2, width: box.width, height: box.height })) {
                    box.collected = true;
                    playerDynamite = Math.min(DYNAMITE_MAX, playerDynamite + box.amount);
                    addFloatingText(box.x, box.y, `+${box.amount} DYNAMITE`, '#ffcc00');
                    dynamiteBoxes.splice(i, 1);
                    updateHUD();
                }
            }
            // Disegna dobloni d'oro (per invulnerabilità)
            for (let i = doblonBoxes.length - 1; i >= 0; i--) {
                const d = doblonBoxes[i];
                if (d.collected) continue;
                // draw coin sprite
                drawCoinSpriteAt(ctx, d.x, d.y, Math.max(d.width, d.height));
                // collision with player
                if (checkCollision(player, { x: d.x - d.width / 2, y: d.y - d.height / 2, width: d.width, height: d.height })) {
                    d.collected = true;
                    playerInvulnerable = true;
                    invulTimer = DOBLON_DURATION_FRAMES;
                    addFloatingText(d.x, d.y, 'DOBLON! INVUL', '#ffd700');
                    // play a pickup chime
                    if (soundEnabled) playTransitionSound();
                    doblonBoxes.splice(i, 1);
                    updateHUD();
                }
            }

            // Door interactions: open, exit to outside and re-enter
            for (let door of doors) {
                const doorBox = { x: door.x - scale(16), y: door.y - scale(16), width: scale(32), height: scale(32) };
                if (!isOutside) {
                    // Player is inside and touching a door
                    if (checkCollision(player, doorBox)) {
                        // If door is closed and player has a key, open it (consume key)
                        if (!door.open && playerKeys > 0) {
                            door.open = true;
                            // set a timer for this opened door (frames)
                            door.timer = Math.max(300, 600 - getCombinedLevel() * 20); // shorter timer at higher levels
                            playerKeys--;
                            addFloatingText(door.x, door.y - 20, 'DOOR OPEN', '#88ff88');
                            updateHUD();
                        }
                        // If door is open and player is inside, step outside without consuming an extra key
                        else if (door.open && !isOutside) {
                            isOutside = true;
                            // Place player along the outer band just next to the door (use OUTER_BAND for feel)
                            const bandHalf = Math.max(10, Math.floor(OUTER_BAND / 2));
                            // left
                            if (door.x <= 64) {
                                player.x = Math.max(5, bandHalf - player.width / 2);
                                player.y = Math.max(5, Math.min(canvas.height - player.height - 5, door.y - player.height / 2));
                            }
                            // right
                            else if (door.x >= canvas.width - 64) {
                                player.x = Math.min(canvas.width - player.width - 5, canvas.width - bandHalf - player.width / 2);
                                player.y = Math.max(5, Math.min(canvas.height - player.height - 5, door.y - player.height / 2));
                            }
                            // top
                            else if (door.y <= 64) {
                                player.y = Math.max(5, bandHalf - player.height / 2);
                                player.x = Math.max(5, Math.min(canvas.width - player.width - 5, door.x - player.width / 2));
                            }
                            // bottom
                            else {
                                player.y = Math.min(canvas.height - player.height - 5, canvas.height - bandHalf - player.height / 2);
                                player.x = Math.max(5, Math.min(canvas.width - player.width - 5, door.x - player.width / 2));
                            }
                            // leave the door open so player can re-enter
                            updateHUD();
                        }
                    }
                } else {
                    // Player is outside: can re-enter through an open door without a key
                    if (door.open && checkCollision(player, doorBox)) {
                        isOutside = false;
                        // Place player just inside the door
                        player.x = door.x - player.width / 2;
                        player.y = door.y - player.height / 2;
                        updateHUD();
                    }
                }
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Verifica vita extra ogni 1000 punti
            if (score > 0 && score % 1000 === 0) {
                lives++;
                updateHUD();
            }

            // Pulsi/pulse blocks may shoot shards when stage enables it (level 5)
            if (stageConfig.shards) {
                for (let block of blocks) {
                    if (block.pulse && block.landed && Math.random() < (stageConfig.shardFireChance || 0.01)) {
                        const speed = 6 + (stageConfig.shardSpeed || 1) * 2;
                        const dirs = [
                            { dx: speed, dy: 0 },
                            { dx: -speed, dy: 0 },
                            { dx: 0, dy: speed },
                            { dx: 0, dy: -speed }
                        ];
                        const dir = dirs[Math.floor(Math.random() * dirs.length)];
                        bulletsBlock.push({
                            x: block.x + block.width / 2 - scale(4),
                            y: block.y + block.height / 2 - scale(4),
                            width: scale(8),
                            height: scale(8),
                            dx: dir.dx,
                            dy: dir.dy
                        });
                    }
                }
            }

            // Gestione proiettili dei blocchi pulsanti
            for (let i = bulletsBlock.length - 1; i >= 0; i--) {
                const bullet = bulletsBlock[i];
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                // Rimbalzo sui bordi
                if (bullet.x <= 0 || bullet.x + bullet.width >= canvas.width) {
                    bullet.dx = -bullet.dx;
                }
                if (bullet.y <= 0 || bullet.y + bullet.height >= canvas.height) {
                    bullet.dy = -bullet.dy;
                }
                // Se colpisce un blocco, si ferma
                let hitBlock = false;
                for (let j = 0; j < blocks.length; j++) {
                    if (checkCollision(bullet, blocks[j])) {
                        hitBlock = true;
                        break;
                    }
                }
                if (hitBlock) {
                    bulletsBlock.splice(i, 1);
                    continue;
                }
                // Rimuovi proiettili fuori area
                if (
                    bullet.x < -50 || bullet.x > canvas.width + 50 ||
                    bullet.y < -50 || bullet.y > canvas.height + 50
                ) {
                    bulletsBlock.splice(i, 1);
                }
            }

            // Decrement invulnerability timer if active
            if (playerInvulnerable && invulTimer > 0) {
                invulTimer--;
                if (invulTimer <= 0) {
                    playerInvulnerable = false;

        // Input handlers
        document.addEventListener('keydown', (e) => {
            // Start flow from attract: open level/select screen with Enter (so coin check is enforced)
            if (e.key === 'Enter' && gameState === 'attract') {
                e.preventDefault();
                // apri la selezione solo se ci sono crediti
                if ((credits || 0) > 0) {
                    showLevelSelect();
                } else {
                    // immediate feedback: sound + animation + floating text
                    playCoinRequiredSound(1);
                    animateCreditHint(1);
                }
                return;
            }
            // Supporto input stile MAME: premi '1' o '2' per scegliere giocatori nella schermata di attract
            if ((e.key === '1' || e.key === '2') && gameState === 'attract') {
                const n = parseInt(e.key, 10);
                e.preventDefault();
                const per = (window.GAME_CONFIG && window.GAME_CONFIG.CREDITS_PER_PLAYER) || 1;
                const req = per * n;
                if ((credits || 0) >= req) {
                    // Apri la schermata di selezione e passa il numero di giocatori da pre-selezionare
                    showLevelSelect(n);
                } else {
                    // immediate feedback for required coins: sound + animation + floating text
                    playCoinRequiredSound(req);
                    animateCreditHint(req);
                }
                return;
            }
            // Insert coin with key '5' (MAME coin)
            if (e.key === '5') {
                // increment credits and refresh HUD/attract indicators but do NOT auto-enter player select
                credits = (credits || 0) + 1;
                updateHUD();
                // update any visible counters
                const sc = document.getElementById('selectCredits'); if (sc) sc.textContent = credits;
                const asc = document.getElementById('attractStaticCredits'); if (asc) asc.textContent = (credits && credits > 0) ? `${(window.DICT && window.DICT.credits_word) || 'CREDITS'}: ${credits}` : (window.DICT && window.DICT.insert_coin || 'INSERT COIN');

                animateCreditHint(1);
                try { refreshAttractPlayerHints(); } catch (e) { }

                if (continueDiv && gameState === 'gameOver') {
                    if (credits > 0) {
                        credits--;
                        updateHUD();
                        continueResume();
                    }
                    return; // don't also set keys['5']
                }
            }
            keys[e.key] = true;
            // Shoot bullet
            if (e.key === ' ' && gameState === 'playing') {
                e.preventDefault();
                // Determina la direzione
                let dx = 0, dy = 0, width = scale(8), height = scale(8), offsetX = 0, offsetY = 0;
                switch (player.direction) {
                    case 'left': dx = -8; width = scale(10); height = scale(4); offsetX = -player.width / 2 - width / 2; break;
                    case 'right': dx = 8; width = scale(10); height = scale(4); offsetX = player.width / 2 + width / 2; break;
                    case 'up': dy = -8; width = scale(4); height = scale(10); offsetY = -player.height / 2 - height / 2; break;
                    case 'down': dy = 8; width = scale(4); height = scale(10); offsetY = player.height / 2 + height / 2; break;
                }
                bullets.push({
                    x: player.x + player.width / 2 - width / 2 + offsetX,
                    y: player.y + player.height / 2 - height / 2 + offsetY,
                    width: width,
                    height: height,
                    dx: dx,
                    dy: dy
                });
            }
            // Use dynamite with 'D'
            if (e.key.toLowerCase && e.key.toLowerCase() === 'd' && gameState === 'playing') {
                e.preventDefault();
                useDynamite();
            }
        });

            if (gameState !== 'attract') return;

            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Animated background
            ctx.strokeStyle = `rgba(0, 255, 255, ${0.2 + Math.sin(Date.now() * 0.001) * 0.1})`;
            ctx.lineWidth = 2;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.arc(
                    canvas.width / 2 + Math.sin(Date.now() * 0.001 + i) * 200,
                    canvas.height / 2 + Math.cos(Date.now() * 0.001 + i) * 200,
                    50 + i * 30,
                    0,
                    Math.PI * 2
                );
                ctx.stroke();
            }

            requestAnimationFrame(attractAnimation);

            // wire pixel-flag selector: render flags, handle left/right and clicks
            const LANGS = ['en', 'it', 'fr'];
            let selectedLangIndex = Math.max(0, LANGS.indexOf((window.DICT && window.DICT.lang) || DEFAULT_LANG));
            function drawFlag(canvas, lang) {
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;
                const W = canvas.width; const H = canvas.height;
                // clear
                ctx.clearRect(0, 0, W, H);
                if (lang === 'it') {
                    // vertical tricolor: green white red
                    const w3 = Math.floor(W / 3);
                    ctx.fillStyle = '#088A29'; ctx.fillRect(0, 0, w3, H);
                    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(w3, 0, w3, H);
                    ctx.fillStyle = '#CE2B37'; ctx.fillRect(w3 * 2, 0, W - w3 * 2, H);
                } else if (lang === 'fr') {
                    const w3 = Math.floor(W / 3);
                    ctx.fillStyle = '#0055A4'; ctx.fillRect(0, 0, w3, H);
                    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(w3, 0, w3, H);
                    ctx.fillStyle = '#EF4135'; ctx.fillRect(w3 * 2, 0, W - w3 * 2, H);
                } else {
                    // improved Union Jack approximation using strokes for diagonals and rectangles for crosses
                    ctx.fillStyle = '#012169'; ctx.fillRect(0, 0, W, H);
                    // white diagonals
                    ctx.lineCap = 'square';
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = Math.max(1, Math.floor(Math.min(W, H) * 0.28));
                    ctx.beginPath(); ctx.moveTo(-W, -W); ctx.lineTo(W * 2, W * 2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(W * 2, -W); ctx.lineTo(-W, W * 2); ctx.stroke();
                    // red diagonal thinner
                    ctx.strokeStyle = '#C8102E';
                    ctx.lineWidth = Math.max(1, Math.floor(Math.min(W, H) * 0.12));
                    ctx.beginPath(); ctx.moveTo(-W, -W); ctx.lineTo(W * 2, W * 2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(W * 2, -W); ctx.lineTo(-W, W * 2); ctx.stroke();
                    // white cross (horizontal + vertical)
                    const whiteCross = Math.max(1, Math.floor(Math.min(W, H) * 0.26));
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(Math.floor(W / 2 - whiteCross / 2), 0, whiteCross, H);
                    ctx.fillRect(0, Math.floor(H / 2 - whiteCross / 2), W, whiteCross);
                    // red cross narrower on top
                    const redCross = Math.max(1, Math.floor(Math.min(W, H) * 0.12));
                    ctx.fillStyle = '#C8102E';
                    ctx.fillRect(Math.floor(W / 2 - redCross / 2), 0, redCross, H);
                    ctx.fillRect(0, Math.floor(H / 2 - redCross / 2), W, redCross);
                }
            }
