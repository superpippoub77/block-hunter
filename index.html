<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK HUNTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        :root {
            /* overlay alpha for attract screen to tune readability */
            --attract-overlay: 0.65;
            --attract-color1: 26, 31, 58;
            /* rgb triplet */
            --attract-color2: 10, 14, 39;
            /* rgb triplet */
        }

        /* Default container (no decorative frame) - frame applied only when playing */
        #gameContainer {
            position: relative;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1229 100%);
            border-radius: 8px;
            /* prepare animatable border and shadow (transparent by default) */
            border: 4px solid rgba(0, 255, 255, 0);
            box-shadow: none;
            transition: border-color 360ms ease, box-shadow 360ms ease, transform 300ms ease;
        }

        /* Decorative arcade frame applied only during gameplay */
        body.in-game #gameContainer {
            border-color: rgba(0, 255, 255, 1);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.5),
                0 0 40px rgba(0, 255, 255, 0.3),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            transform: scale(1.005);
        }

        /* subtle fade for overlays when removed */
        .fade-out {
            opacity: 0 !important;
            transition: opacity 320ms ease;
            pointer-events: none;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #attractScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Use provided background image for attract screen with adjustable overlay via CSS variable */
            background: radial-gradient(circle, rgba(var(--attract-color1), var(--attract-overlay)) 0%, rgba(var(--attract-color2), var(--attract-overlay)) 100%), url('images/bg.png') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            animation: scanline 8s linear infinite;
        }

        /* helper class for dynamic attract divs to reuse same background + overlay */
        .attract-bg {
            background: radial-gradient(circle, rgba(var(--attract-color1), var(--attract-overlay)) 0%, rgba(var(--attract-color2), var(--attract-overlay)) 100%), url('images/bg.png') center/cover no-repeat !important;
        }

        @keyframes scanline {

            0%,
            100% {
                background-position: 0 0;
            }

            50% {
                background-position: 0 100%;
            }
        }

        #attractScreen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(4px);
            }
        }

        .title {
            font-size: 48px;
            color: #ff00ff;
            text-shadow:
                3px 3px 0 #00ffff,
                -2px -2px 0 #ffff00,
                0 0 20px #ff00ff,
                0 0 40px #ff00ff;
            margin-bottom: 40px;
            animation: glow 2s ease-in-out infinite alternate, float 3s ease-in-out infinite;
            letter-spacing: 4px;
        }

        @keyframes glow {
            from {
                text-shadow:
                    3px 3px 0 #00ffff,
                    -2px -2px 0 #ffff00,
                    0 0 20px #ff00ff,
                    0 0 40px #ff00ff;
            }

            to {
                text-shadow:
                    3px 3px 0 #00ffff,
                    -2px -2px 0 #ffff00,
                    0 0 40px #ff00ff,
                    0 0 80px #ff00ff;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .instructions {
            font-size: 14px;
            color: #00ffff;
            text-align: center;
            line-height: 2;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
        }

        .startButton {
            padding: 15px 40px;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: 3px solid #ffff00;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
            transition: all 0.3s;
        }

        .startButton:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.9);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: #00ffff;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
            z-index: 5;
            line-height: 1.8;
        }

        .gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 15;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 4px solid #ff00ff;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
        }

        .gameOver h2 {
            font-size: 36px;
            color: #ff0000;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #ffff00;
        }

        .gameOver p {
            font-size: 16px;
            color: #00ffff;
            margin-bottom: 30px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="attractScreen">
            <div class="title">BLOCK HUNTER</div>
            <div class="instructions">
                FRECCE - MOVIMENTO<br>
                SPAZIO - SPARA<br>
                RECUPERA L'OGGETTO<br>
                SCHIVA I BLOCCHI
            </div>
            <button class="startButton" id="startButton">INSERISCI MONETA</button>
        </div>

        <div class="hud hidden" id="hud">
            <div>SCORE: <span id="score">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
            <div>LIVES: <span id="lives">3</span></div>
            <div>GEMS: <span id="gems">0</span>/<span id="gemsReq">20</span></div>
            <div>KEYS: <span id="keys">0</span></div>
            <div>OUTSIDE: <span id="outside">NO</span></div>
            <div>DYNAMITE: <span id="dynamiteCount">0</span>
                <div id="dynamiteBar"
                    style="display:inline-block; vertical-align:middle; width:120px; height:12px; background:#222; border:1px solid #444; margin-left:8px;">
                    <div id="dynamiteFill" style="height:100%; width:0%; background:#ff3333;"></div>
                </div>
            </div>
            <div>INVUL: <span id="invul">NO</span></div>
            <div>CREDITS: <span id="credits">0</span></div>
            <div><button id="hudSoundToggle" style="margin-top:6px; padding:4px 8px; font-size:12px; background:#111; color:#0ff; border:1px solid #0ff; cursor:pointer;">SOUND: ON</button></div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameState = 'attract'; // attract, playing, gameOver
        let score = 0;
        // level kept for compatibility (combined stage = (gameLevel-1)*5 + subLevel)
        let level = 1;
        // New structured levels: gameLevel (1..5) and subLevel (1..5)
        let gameLevel = 1;
        let subLevel = 1;
        let stageConfig = {};
        // Credits and players
        let credits = 0;
        let numPlayers = 1;
        const CONTINUE_FRAMES = 600; // 10s at ~60fps
        let continueDiv = null;
        let continueTimer = 0;
        let continueEligibleTopTen = false;
        let storedFinalScore = 0;
        // Gems and transitions
        const GEMS_PER_STAGE = 20;
        let gemsCollected = 0;
        let inTransition = false;
        let transitionTimer = 0;
        const TRANSITION_FRAMES = 150; // ~2.5s at 60fps
        let transitionText = '';

        // Floating texts (score, key, door messages)
        let floatingTexts = [];

        function addFloatingText(x, y, text, color = '#ffffff') {
            floatingTexts.push({ x: x, y: y, text: text, color: color, life: 60, vy: -0.5 });
        }
        let lives = 3;
        let frameCount = 0;

        // Player
        const PLAYER_INITIAL_SPEED = 5;
        const PLAYER_MIN_SPEED = 1;
        const player = {
            x: 400,
            y: 550,
            width: 20,
            height: 20,
            speed: PLAYER_INITIAL_SPEED,
            color: '#00ff00',
            direction: 'up', // 'up', 'down', 'left', 'right', 'up-left', ...
            angle: 0 // radians for rendering rotation
        };

        // Movement helper (declared to avoid ReferenceError)
        let playerIsMoving = false;
        // Whether the player is outside (walking the outer border)
        let isOutside = false;
        const OUTER_BAND = 80; // how wide the outside path is along the edges (tuned)

        // Target object
        const target = {
            x: 0,
            y: 0,
            width: 15,
            height: 15,
            color: '#ffff00',
            lifetime: 300, // frames before moving
            currentLife: 0
        };

    // Game objects
    let blocks = [];
    let dynamiteBoxes = [];
    let doubloonBoxes = [];
    // Explosion visuals
    let explosions = [];
    // Screen shake state for strong explosions
    let screenShake = { time: 0, maxTime: 0, intensity: 0 };
    const STRONG_EXPLOSION_THRESHOLD = 4; // blocks destroyed to trigger shake
        // Invulnerability (doubloon) state
        let playerInvulnerable = false;
        let invulTimer = 0;
    const DOUBLOON_DURATION_FRAMES = 5 * 60; // ~5 seconds
        // Sound and dynamite settings
        let soundEnabled = true;
        const DYNAMITE_MAX = 50; // fixed per level
        let playerDynamite = DYNAMITE_MAX;
        // Inizializza le porte ai bordi del canvas
        function setupDoors() {
            doors = [
                { x: 32, y: canvas.height / 2, open: false }, // sinistra
                { x: canvas.width - 32, y: canvas.height / 2, open: false }, // destra
                { x: canvas.width / 2, y: 32, open: false }, // alto
                { x: canvas.width / 2, y: canvas.height - 32, open: false } // basso
            ];
        }
        let bullets = [];
        let particles = [];
        let bulletsBlock = [];
        const DOOR_ICON = '\u{1F6AA}'; // 🚪 (legacy, replaced by pixel art)
        const KEY_ICON = '\u{1F511}'; // 🔑 (legacy, replaced by pixel art)
        let doors = [];
        let levelKeys = [];
        let playerKeys = 0;
        let doorCloseTimer = 0;

        // Input
        const keys = {};

        // Top ten array
        let topTen = [];
        let scoreMultiplier = 1;
        let selectedDifficulty = 'Beginner';

        // Legacy emoji (kept as references) - we use programmatic pixel sprites now
        const PLAYER_ICON = '\u{1F47B}'; // 👻 (legacy)
        const BLOCK_ICON = '\u{1F4A3}'; // 💣 (legacy)
        const BLOCK_PULSE_ICON = '\u{1F525}'; // 🔥 (legacy)
        const TARGET_ICON = '\u{1F4A1}'; // 💡 (legacy)

        // Simple pixel-sprite renderer (programmatic sprites so we don't need assets)
        // pattern arrays: numbers map to palette indices (0 = transparent)
    const SPRITES = {
            player: [
                '00110000',
                '01111000',
                '11111100',
                '11111100',
                '11111100',
                '10101100',
                '10000100',
                '10000100'
            ],
            block: [
                '11111',
                '10001',
                '10101',
                '10101',
                '11111'
            ],
            key: [
                '001100',
                '011110',
                '011110',
                '001100',
                '001110',
                '011111'
            ],
            door: [
                '01110',
                '10001',
                '10001',
                '10001',
                '10001',
                '10001',
                '10001'
            ],
            target: [
                '00100',
                '01110',
                '11111',
                '01110',
                '00100'
            ],
            dynamite: [
                '00100',
                '01110',
                '11111',
                '11111',
                '01110',
                '00100'
            ]
            ,
            coin: [
                '00100',
                '01110',
                '11110',
                '11110',
                '01110',
                '00100'
            ]
        };

        function drawSpritePattern(ctx, pattern, centerX, centerY, size, palette) {
            const rows = pattern.length;
            const cols = pattern[0].length;
            const px = size / Math.max(rows, cols);
            const offsetX = -cols * px / 2;
            const offsetY = -rows * px / 2;
            for (let r = 0; r < rows; r++) {
                const row = pattern[r];
                for (let c = 0; c < cols; c++) {
                    const ch = row[c];
                    if (ch === '1') {
                        ctx.fillStyle = palette[0];
                        ctx.fillRect(Math.round(centerX + offsetX + c * px), Math.round(centerY + offsetY + r * px), Math.ceil(px), Math.ceil(px));
                    }
                }
            }
        }

        function drawPlayerSpriteAt(ctx, cx, cy, size, color) {
            ctx.save();
            drawSpritePattern(ctx, SPRITES.player, cx, cy, size, [color]);
            // eyes/highlight
            ctx.fillStyle = '#ffffff';
            const eyeSize = Math.max(1, Math.round(size / 12));
            ctx.fillRect(Math.round(cx - size * 0.18), Math.round(cy - size * 0.12), eyeSize, eyeSize);
            ctx.fillRect(Math.round(cx + size * 0.06), Math.round(cy - size * 0.12), eyeSize, eyeSize);
            ctx.restore();
        }

        function drawBlockSpriteAt(ctx, cx, cy, size, pulse) {
            const color = pulse ? '#ff6a00' : '#ff00ff';
            drawSpritePattern(ctx, SPRITES.block, cx, cy, size, [color]);
            if (pulse) {
                ctx.strokeStyle = 'rgba(255,255,0,0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, size * 0.6, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawKeySpriteAt(ctx, cx, cy, size) {
            drawSpritePattern(ctx, SPRITES.key, cx, cy, size, ['#ffff00']);
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 1;
            ctx.strokeRect(Math.round(cx - size / 3), Math.round(cy - size / 3), Math.round(size / 1.5), Math.round(size / 1.5));
        }

        function drawDoorSpriteAt(ctx, cx, cy, size, open) {
            drawSpritePattern(ctx, SPRITES.door, cx, cy - (size * 0.1), size, [open ? '#00ff00' : '#ff4444']);
            // small frame
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(Math.round(cx - size / 2), Math.round(cy - size / 2), Math.round(size), Math.round(size));
        }

        function drawTargetSpriteAt(ctx, cx, cy, size) {
            drawSpritePattern(ctx, SPRITES.target, cx, cy, size, ['#ffff00']);
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, size * 0.45, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawDynamiteSpriteAt(ctx, cx, cy, size) {
            drawSpritePattern(ctx, SPRITES.dynamite, cx, cy, size, ['#ff3333']);
            // fuse line
            const flick = (Math.sin(Date.now() * 0.02) + 1) * 0.5;
            ctx.strokeStyle = `rgba(255,200,50,${0.6 + 0.4 * flick})`;
            ctx.lineWidth = Math.max(1, size * 0.06);
            ctx.beginPath();
            ctx.moveTo(cx + size * 0.45, cy - size * 0.3);
            ctx.lineTo(cx + size * 0.8, cy - size * 0.55);
            ctx.stroke();
        }

        function drawCoinSpriteAt(ctx, cx, cy, size) {
            drawSpritePattern(ctx, SPRITES.coin, cx, cy, size, ['#ffd700']);
            // inner shine
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.ellipse(cx - size*0.12, cy - size*0.12, size*0.18, size*0.12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#ffb400';
            ctx.lineWidth = 1;
            ctx.strokeRect(Math.round(cx - size/2), Math.round(cy - size/2), Math.round(size), Math.round(size));
        }

        // Initialize target position
        function spawnTarget() {
            target.x = Math.random() * (canvas.width - target.width);
            target.y = Math.random() * (canvas.height - 100 - target.height) + 50;
            target.currentLife = 0;
        }

        // Return combined numeric level used for scoring/legacy behavior
        function getCombinedLevel() {
            return (gameLevel - 1) * 5 + subLevel;
        }

        // Configure stage parameters based on gameLevel and subLevel
        function configureStage() {
            // default
            stageConfig = {
                doorsCount: 0,
                spawnTypes: ['random'], // 'random', 'top', 'bottom', 'left', 'right'
                blockSpeed: 1,
                pulseChance: 0,
                pulseSizes: [],
                shards: false,
                shardSpeed: 0,
                shardFireChance: 0.01,
                spawnRate: 20
            };

            const g = gameLevel;
            const s = subLevel;

            // Map according to spec
            if (g === 1) {
                // Level 1: only random; doors on sublevel 4-5
                stageConfig.spawnTypes = ['random'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s >= 4) ? 2 : 0;
            } else if (g === 2) {
                // Level 2: random + top/bottom; doors on sublevel 3-5
                stageConfig.spawnTypes = ['random', 'top', 'bottom'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s >= 3) ? 2 : 0;
            } else if (g === 3) {
                // Level 3: random + all four directions
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s <= 2) ? 4 : 6;
            } else if (g === 4) {
                // Level 4: like 3 but with pulse rocks; doors vary 6/8
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = (s <= 2) ? 6 : 8;
                stageConfig.pulseChance = 0.25; // some rocks pulse
                stageConfig.pulseSizes = ['small', 'big'];
            } else if (g === 5) {
                // Level 5: like 4 but pulse rocks shoot shards
                stageConfig.spawnTypes = ['random', 'top', 'bottom', 'left', 'right'];
                stageConfig.blockSpeed = s; // 1..5
                stageConfig.doorsCount = 8;
                stageConfig.pulseChance = 0.3;
                stageConfig.pulseSizes = ['small', 'big'];
                stageConfig.shards = true;
                stageConfig.shardSpeed = s; // shards speed equals sublevel
                stageConfig.shardFireChance = 0.02 + s * 0.005; // increase with sublevel
            }

            // spawnRate inversely proportional to difficulty
            stageConfig.spawnRate = Math.max(24 - getCombinedLevel(), 6);

            // Update global legacy level var
            level = getCombinedLevel();

            // Setup doors according to new config
            setupDoorsForStage(stageConfig.doorsCount || 0);
            // Setup doubloons for this gameLevel
            let doubloonCount = 1;
            if (gameLevel <= 2) doubloonCount = 1;
            else if (gameLevel === 3) doubloonCount = 2;
            else if (gameLevel >= 4) doubloonCount = 4;
            setupDoubloonsForStage(doubloonCount);
        }

        // Clean fields and advance after transition
        function finishAdvanceAfterTransition() {
            // Clear playfield
            blocks = [];
            bullets = [];
            bulletsBlock = [];
            particles = [];
            levelKeys = [];
            floatingTexts = [];
            doors = [];
            gemsCollected = 0;
            // Reset player position
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 50;

            inTransition = false;
            // Advance to next sublevel (this will configure stage and set doors)
            advanceSublevel();

            // Start fresh
            spawnTarget();
            updateHUD();
        }

        // Setup doors array with a given number of doors distributed on edges
        function setupDoorsForStage(count) {
            doors = [];
            if (!count || count <= 0) return;
            const positions = [];
            // We'll distribute doors around the edges: left, top, right, bottom, repeating
            const edges = ['left', 'top', 'right', 'bottom'];
            for (let i = 0; i < count; i++) {
                const edge = edges[i % edges.length];
                const idx = Math.floor(i / edges.length);
                // spread along the edge
                const t = 0.2 + (idx + (i % edges.length) / Math.max(1, Math.floor((count + edges.length - 1) / edges.length))) * 0.6;
                let x = canvas.width / 2, y = canvas.height / 2;
                switch (edge) {
                    case 'left': x = 32; y = Math.round(canvas.height * t); break;
                    case 'right': x = canvas.width - 32; y = Math.round(canvas.height * t); break;
                    case 'top': y = 32; x = Math.round(canvas.width * t); break;
                    case 'bottom': y = canvas.height - 32; x = Math.round(canvas.width * t); break;
                }
                doors.push({ x: x, y: y, open: false });
            }
        }

        // Place doubloons (gold coins) for this stage
        function setupDoubloonsForStage(count) {
            doubloonBoxes = [];
            if (!count || count <= 0) return;
            for (let i = 0; i < count; i++) {
                const box = {
                    x: Math.random() * (canvas.width - 80) + 40,
                    y: Math.random() * (canvas.height - 160) + 80,
                    width: 20,
                    height: 20,
                    collected: false
                };
                doubloonBoxes.push(box);
            }
        }

        // Advance sublevel/level when player progresses
        function advanceSublevel() {
            if (gameLevel === 5 && subLevel === 5) {
                // End game - reached final
                endGame();
                return;
            }
            subLevel++;
            if (subLevel > 5) {
                subLevel = 1;
                gameLevel = Math.min(5, gameLevel + 1);
            }
            configureStage();
            updateHUD();
        }

        // Spawn a key occasionally for doors (only one active at a time)
        function spawnKey() {
            // If there is already an uncollected key, do nothing
            const active = levelKeys.find(k => !k.collected);
            if (active) return;

            // Small random chance to spawn a key, scaled by level
            const baseChance = 0.001; // per frame
            const chance = baseChance + Math.min(level * 0.0005, 0.01);
            if (Math.random() < chance) {
                const key = {
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: Math.random() * (canvas.height - 120) + 60,
                    collected: false
                };
                levelKeys.push(key);
            }
        }

        // Spawn dynamite box occasionally which replenishes player's dynamite
        function spawnDynamiteBox() {
            // limit number of boxes active
            const active = dynamiteBoxes.find(b => !b.collected);
            if (active) return;
            // chance scaled by level
            const baseChance = 0.0008;
            const chance = baseChance + Math.min(level * 0.0008, 0.01);
            if (Math.random() < chance) {
                const box = {
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: Math.random() * (canvas.height - 120) + 60,
                    width: 22,
                    height: 16,
                    amount: 10,
                    collected: false,
                    life: 600 // frames before it disappears (~10s)
                };
                dynamiteBoxes.push(box);
            }
        }

        // Block spawning based on level
        function spawnBlock() {
            const baseSize = 20;
            const bs = stageConfig.blockSpeed || 1;
            const baseWidth = baseSize;
            const baseHeight = baseSize;
            const pulse = Math.random() < (stageConfig.pulseChance || 0);
            const pulsePhase = Math.random() * Math.PI * 2;

            const block = {
                width: baseWidth,
                height: baseHeight,
                color: '#ff00ff',
                hit: false,
                vx: 0,
                vy: 0,
                falling: false,
                landed: true,
                spawnAnimation: 0,
                maxSpawnAnimation: 20,
                pulse: pulse,
                pulsePhase: pulsePhase
            };

            // Choose spawn type based on stageConfig
            const spawnTypes = stageConfig.spawnTypes || ['random'];
            const spawnType = spawnTypes[Math.floor(Math.random() * spawnTypes.length)];

            switch (spawnType) {
                case 'random':
                    block.x = Math.random() * (canvas.width - block.width - 40) + 20;
                    block.y = Math.random() * (canvas.height - block.height - 100) + 50;
                    block.landed = true;
                    break;
                case 'top':
                    block.x = Math.random() * (canvas.width - block.width);
                    block.y = -block.height;
                    block.vy = 1 + bs;
                    block.falling = true;
                    block.landed = false;
                    break;
                case 'bottom':
                    block.x = Math.random() * (canvas.width - block.width);
                    block.y = canvas.height + block.height;
                    block.vy = -(1 + bs);
                    block.landed = false;
                    break;
                case 'left':
                    block.x = -block.width;
                    block.y = Math.random() * (canvas.height - block.height - 40) + 20;
                    block.vx = 1 + bs;
                    block.landed = false;
                    break;
                case 'right':
                    block.x = canvas.width + block.width;
                    block.y = Math.random() * (canvas.height - block.height - 40) + 20;
                    block.vx = -(1 + bs);
                    block.landed = false;
                    break;
                default:
                    block.x = Math.random() * (canvas.width - block.width - 40) + 20;
                    block.y = Math.random() * (canvas.height - block.height - 100) + 50;
                    block.landed = true;
            }

            blocks.push(block);
        }

        // Create particle effect
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color: color
                });
            }
        }

        // Collision detection
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                obj1.x + obj1.width > obj2.x &&
                obj1.y < obj2.y + obj2.height &&
                obj1.y + obj1.height > obj2.y;
        }

            selectDiv.style.height = '100%';

            selectDiv.style.display = 'flex';

                            pbtn.style.opacity = '1';

                    });
                    // default 1 player
                    numPlayers = 1;
                    // wire sound toggle
                    const soundToggle = selectDiv.querySelector('#soundToggle');
