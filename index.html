<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockHunter - Arcade Game</title>
    <style>
        /* Local font: place your font files in assets/fonts/
           Example filenames expected by the project:
             - assets/fonts/PressStart2P.woff2
             - assets/fonts/PressStart2P.woff
           The @font-face below will prefer the local files and fall back to
           Google Fonts if the local files are missing. This avoids network
           dependency and adblock issues during development. */
        @font-face {
            font-family: 'Press Start 2P';
            /* prefer modern compressed formats first for performance */
            src: local('Press Start 2P'),
                url('assets/fonts/PressStart2P-Regular.woff2') format('woff2'),
                url('assets/fonts/PressStart2P-Regular.woff') format('woff'),
                url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            box-shadow: 0 0 40px rgba(255, 255, 0, 0.3);
            border: 4px solid #333;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="game.js"></script>
</body>

</html>
